title: Admin
icon: mdi:tune-vertical
panel: true
cards:
  - type: vertical-stack
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr
          grid-gap: 14px
          margin: 14px 18px 24px 18px
        cards:

          # ════════════════════════════════════════════════════════════════════
          #  SOLSTICE DIAGNOSTICS HUD — Entity Registry & Group Inspector
          # ════════════════════════════════════════════════════════════════════
          - type: markdown
            content: >-
              <div class="hud-bar">
                <div class="hud-left">
                  <div class="hud-eyebrow">SOLSTICE SYSTEM DIAGNOSTICS · ENTITY REGISTRY INSPECTOR</div>
                  <div class="hud-title">Administration & Raw Telemetry <span class="hud-divider">·</span> <span class="hud-sub">All Room & System Groups</span></div>
                </div>
                <div class="hud-badges">
                  <span class="hud-pill pill-sky">HA Core 2026.8.3</span>
                </div>
              </div>
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg, rgba(41, 50, 72, 0.92) 0%, rgba(28, 35, 52, 0.96) 100%) !important;
                  border-radius: 8px !important;
                  border: 1px solid rgba(255, 255, 255, 0.09) !important;
                  box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.14), 0 12px 30px -8px rgba(8, 12, 21, 0.5) !important;
                  padding: 4px 10px !important;
                }
                .hud-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
                .hud-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 1.8px; color: #38bdf8; margin-bottom: 2px; }
                .hud-title { font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 700; color: #f8fafc; letter-spacing: -0.3px; }
                .hud-divider { color: rgba(148, 163, 184, 0.45); margin: 0 4px; }
                .hud-sub { font-weight: 500; font-size: 16px; color: #94a3b8; }
                .hud-pill { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12.5px; font-weight: 600; padding: 6px 14px; border-radius: 6px; background: rgba(56, 189, 248, 0.14); color: #bae6fd; border: 1px solid rgba(56, 189, 248, 0.3); }

          # ── People Trackers ──
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: 1fr 1fr
              grid-gap: 14px
            cards:
              - type: custom:mushroom-entity-card
                entity: device_tracker.funky_monkey_s_iphone
                icon_color: green
                layout: horizontal
                card_mod: &admin_card
                  style: |
                    ha-card {
                      background: linear-gradient(145deg, rgba(41, 50, 72, 0.90) 0%, rgba(30, 37, 54, 0.94) 100%) !important;
                      border-radius: 8px !important;
                      border: 1px solid rgba(255, 255, 255, 0.085) !important;
                      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.12), 0 12px 28px -8px rgba(9, 13, 22, 0.45) !important;
                    }
              - type: custom:mushroom-entity-card
                entity: device_tracker.ivavvays_iphone
                icon_color: green
                layout: horizontal
                card_mod: *admin_card

          # ── Garage Tilt Sensor & Z-Wave Battery Health Radar ──
          - type: custom:mushroom-title-card
            title: Z-Wave Battery & Garage Barrier Health
            subtitle: Garage tilt sensor telemetry & lowest-first battery replacement queue

          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: 1fr 1fr
              grid-gap: 14px
              mediaquery:
                "(max-width: 800px)":
                  grid-template-columns: 1fr
            cards:
              - type: entities
                title: "🏍️ Garage Controllers & Tilt Sensors"
                show_header_toggle: false
                card_mod: *admin_card
                entities:
                  - entity: cover.garage_door_small
                    name: Moto Bay (Small Garage)
                  - entity: sensor.garage_door_small_battery_level
                    name: Moto Bay Tilt Sensor Battery
                  - entity: binary_sensor.garage_door_small_barrier_ul_disabling_status
                    name: Moto Bay UL Lockout Status
                  - entity: cover.garage_door_big
                    name: Big Garage Door
                  - entity: sensor.garage_battery_level
                    name: Big Garage Tilt Sensor Battery
                  - entity: binary_sensor.garage_barrier_ul_disabling_status
                    name: Big Garage UL Lockout Status

              - type: custom:auto-entities
                card:
                  type: entities
                  title: "🔋 All Z-Wave Sensor Batteries (Lowest First)"
                  show_header_toggle: false
                  state_color: true
                  card_mod: *admin_card
                sort:
                  method: state
                  numeric: true
                  reverse: false
                filter:
                  include:
                    - entity_id: "sensor.*battery_level*"
                  exclude:
                    - entity_id: "sensor.*iphone*"
                    - entity_id: "sensor.*watch*"

          # ── Energy & Solar Raw Data ──
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: 1fr 1fr
              grid-gap: 14px
              mediaquery:
                "(max-width: 800px)":
                  grid-template-columns: 1fr
            cards:
              - type: custom:auto-entities
                card:
                  type: entities
                  state_color: true
                  title: Solar Forecast
                  show_header_toggle: false
                  card_mod: *admin_card
                filter:
                  include:
                    - group: group.solar_forecast

              - type: custom:auto-entities
                card:
                  type: entities
                  state_color: true
                  title: Home Energy
                  show_header_toggle: false
                  card_mod: *admin_card
                filter:
                  include:
                    - group: group.home_energy

          # ── Room Entities Inspector ──
          - type: custom:mushroom-title-card
            title: Room Entity Groups
            subtitle: Complete state & attribute inspection by room

          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: 1fr 1fr
              grid-gap: 14px
              mediaquery:
                "(max-width: 800px)":
                  grid-template-columns: 1fr
            cards:
              - type: custom:auto-entities
                card:
                  type: entities
                  state_color: true
                  title: Living Room
                  show_header_toggle: false
                  card_mod: *admin_card
                filter:
                  include:
                    - group: group.living_room

              - type: custom:auto-entities
                card:
                  type: entities
                  state_color: true
                  title: Kitchen
                  show_header_toggle: false
                  card_mod: *admin_card
                filter:
                  include:
                    - group: group.kitchen

              - type: custom:auto-entities
                card:
                  type: entities
                  state_color: true
                  title: Master Bedroom
                  show_header_toggle: false
                  card_mod: *admin_card
                filter:
                  include:
                    - group: group.master_bedroom

              - type: custom:auto-entities
                card:
                  type: entities
                  state_color: true
                  title: Master Bathroom
                  show_header_toggle: false
                  card_mod: *admin_card
                filter:
                  include:
                    - group: group.master_bathroom

              - type: custom:auto-entities
                card:
                  type: entities
                  state_color: true
                  title: Entertainment Room
                  show_header_toggle: false
                  card_mod: *admin_card
                filter:
                  include:
                    - group: group.entertainment_room

              - type: custom:auto-entities
                card:
                  type: entities
                  state_color: true
                  title: Welcome Room
                  show_header_toggle: false
                  card_mod: *admin_card
                filter:
                  include:
                    - group: group.welcome_room

              - type: custom:auto-entities
                card:
                  type: entities
                  state_color: true
                  title: Upper Big Bedroom
                  show_header_toggle: false
                  card_mod: *admin_card
                filter:
                  include:
                    - group: group.upper_big_bedroom

              - type: custom:auto-entities
                card:
                  type: entities
                  state_color: true
                  title: Upper Small Bedroom
                  show_header_toggle: false
                  card_mod: *admin_card
                filter:
                  include:
                    - group: group.upper_small_bedroom

              - type: custom:auto-entities
                card:
                  type: entities
                  state_color: true
                  title: Upper Guest Bedroom
                  show_header_toggle: false
                  card_mod: *admin_card
                filter:
                  include:
                    - group: group.upper_guest_bedroom

              - type: custom:auto-entities
                card:
                  type: entities
                  state_color: true
                  title: Attic
                  show_header_toggle: false
                  card_mod: *admin_card
                filter:
                  include:
                    - group: group.attic

              - type: custom:auto-entities
                card:
                  type: entities
                  state_color: true
                  title: Entryway
                  show_header_toggle: false
                  card_mod: *admin_card
                filter:
                  include:
                    - group: group.entryway

              - type: custom:auto-entities
                card:
                  type: entities
                  state_color: true
                  title: Garage
                  show_header_toggle: false
                  card_mod: *admin_card
                filter:
                  include:
                    - group: group.garage

              - type: custom:auto-entities
                card:
                  type: entities
                  state_color: true
                  title: Backyard
                  show_header_toggle: false
                  card_mod: *admin_card
                filter:
                  include:
                    - group: group.backyard

              - type: custom:auto-entities
                card:
                  type: entities
                  state_color: true
                  title: Side Deck
                  show_header_toggle: false
                  card_mod: *admin_card
                filter:
                  include:
                    - group: group.side_deck

          # ── Infrastructure Raw Data ──
          - type: custom:mushroom-title-card
            title: Infrastructure Entities
            subtitle: NAS, Network & System Monitor Groups

          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: 1fr 1fr
              grid-gap: 14px
              mediaquery:
                "(max-width: 800px)":
                  grid-template-columns: 1fr
            cards:
              - type: custom:auto-entities
                card:
                  type: entities
                  state_color: true
                  title: UbhiNAS
                  show_header_toggle: false
                  card_mod: *admin_card
                filter:
