title: Infrastructure
path: infrastructure
icon: mdi:server-network
panel: true
cards:
  - type: vertical-stack
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr
          grid-gap: 10px
          margin: 8px 12px 16px 12px
          mediaquery:
            "(max-width: 600px)":
              grid-gap: 8px
              margin: 6px 6px 14px 6px
        cards:

          # ════════════════════════════════════════════════════════════════════
          #  COMPACT INFRASTRUCTURE BAR — Rack PDU, NAS & Host Telemetry
          # ════════════════════════════════════════════════════════════════════
          - type: custom:mushroom-chips-card
            alignment: justify
            chips:
              - type: template
                icon: mdi:flash
                icon_color: amber
                content: "PDU {{ states('sensor.homelab_server_pdu_load') }}A"
                tap_action:
                  action: more-info
                  entity: sensor.homelab_server_pdu_load
              - type: template
                icon: mdi:nas
                icon_color: "{{ 'green' if is_state('sensor.ubhinas_status','good') else 'red' }}"
                content: "UbhiNAS: {{ states('sensor.ubhinas_status') | title }}"
                tap_action:
                  action: more-info
                  entity: sensor.ubhinas_status
              - type: template
                icon: mdi:nas
                icon_color: "{{ 'green' if is_state('sensor.plexnas_status','good') else 'red' }}"
                content: "PlexNAS: {{ states('sensor.plexnas_status') | title }}"
                tap_action:
                  action: more-info
                  entity: sensor.plexnas_status
              - type: template
                icon: mdi:cpu-64-bit
                icon_color: light-blue
                content: "HA CPU {{ states('sensor.processor_use') }}% · RAM {{ states('sensor.memory_use_percent') }}%"
                tap_action:
                  action: more-info
                  entity: sensor.processor_use
              - type: template
                icon: mdi:wan
                icon_color: cyan
                content: "↓{{ states('sensor.speedtest_download') | float(0) | round(0) }} ↑{{ states('sensor.speedtest_upload') | float(0) | round(0) }} Mbps"
                tap_action:
                  action: more-info
                  entity: sensor.speedtest_download
              - type: template
                icon: mdi:chart-areaspline
                icon_color: orange
                content: "Grafana ↗"
                tap_action:
                  action: url
                  url_path: https://grafana.ubhits.com/d/ae751mokonhfkf/nas-status?orgId=1&timezone=browser&kiosk

          # ════════════════════════════════════════════════════════════════════
          #  PDU POWER CONTROLS — 8-Outlet Switched Rack Matrix (4-col / 2-col)
          # ════════════════════════════════════════════════════════════════════
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(4, minmax(0, 1fr))
              grid-gap: 8px
              mediaquery:
                "(max-width: 900px)":
                  grid-template-columns: repeat(2, minmax(0, 1fr))
            cards:
              - type: custom:mushroom-entity-card
                entity: switch.homelab_server_pdu_outlet_1
                name: Network Switch
                icon: mdi:router-network-wireless
                icon_color: cyan
                layout: horizontal
                tap_action: &pdu_net_confirm
                  action: toggle
                  confirmation:
                    text: "Toggle power for HomeLab Network Switch?"
                icon_tap_action: *pdu_net_confirm

              - type: custom:mushroom-entity-card
                entity: switch.homelab_server_pdu_outlet_2
                name: HP DL380 G9
                icon: mdi:server
                icon_color: amber
                layout: horizontal
                tap_action: &pdu_dl380_confirm
                  action: toggle
                  confirmation:
                    text: "Toggle power for HP DL380 G9?"
                icon_tap_action: *pdu_dl380_confirm

              - type: custom:mushroom-entity-card
                entity: switch.homelab_server_pdu_outlet_3
                name: SuperMicro 01
                icon: mdi:server
                icon_color: purple
                layout: horizontal
                tap_action: &pdu_sm01_confirm
                  action: toggle
                  confirmation:
                    text: "Toggle power for SuperMicro 01?"
                icon_tap_action: *pdu_sm01_confirm

              - type: custom:mushroom-entity-card
                entity: switch.homelab_server_pdu_outlet_4
                name: SuperMicro 02
                icon: mdi:server
                icon_color: purple
                layout: horizontal
                tap_action: &pdu_sm02_confirm
                  action: toggle
                  confirmation:
                    text: "Toggle power for SuperMicro 02?"
                icon_tap_action: *pdu_sm02_confirm

              - type: custom:mushroom-entity-card
                entity: switch.homelab_server_pdu_outlet_5
                name: Rack Monitor
                icon: mdi:monitor
                icon_color: light-blue
                layout: horizontal
                tap_action: &pdu_mon_confirm
                  action: toggle
                  confirmation:
                    text: "Toggle power for Rack Monitor?"
                icon_tap_action: *pdu_mon_confirm

              - type: custom:mushroom-entity-card
                entity: switch.homelab_server_pdu_outlet_6
                name: PlexNAS
                icon: mdi:nas
                icon_color: green
                layout: horizontal
                tap_action: &pdu_plex_confirm
                  action: toggle
                  confirmation:
                    text: "Toggle power for PlexNAS?"
                icon_tap_action: *pdu_plex_confirm

              - type: custom:mushroom-entity-card
                entity: switch.homelab_server_pdu_outlet_7
                name: ThorNAS
                icon: mdi:nas
                icon_color: green
                layout: horizontal
                tap_action: &pdu_thor_confirm
                  action: toggle
                  confirmation:
                    text: "Toggle power for ThorNAS?"
                icon_tap_action: *pdu_thor_confirm

              - type: custom:mushroom-entity-card
                entity: switch.homelab_server_pdu_outlet_8
                name: NVR
                icon: mdi:cctv
                icon_color: teal
                layout: horizontal
                tap_action: &pdu_nvr_confirm
                  action: toggle
                  confirmation:
                    text: "Toggle power for the NVR?"
                icon_tap_action: *pdu_nvr_confirm

          # ════════════════════════════════════════════════════════════════════
          #  STORAGE ARRAYS (Native HA Telemetry — Replaces Heavy Iframe)
          # ════════════════════════════════════════════════════════════════════
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(2, minmax(0, 1fr))
              grid-gap: 10px
              mediaquery:
                "(max-width: 800px)":
                  grid-template-columns: 1fr
            cards:
              # UbhiNAS Card
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-template-card
                    entity: sensor.ubhinas_status
                    primary: "UbhiNAS · {{ states('sensor.ubhinas_status') | title }}"
                    secondary: "Used: {{ states('sensor.ubhinas_volume_used_storage') }}% · Free: {{ states('sensor.ubhinas_free_space_storage') }} TB"
                    icon: mdi:nas
                    icon_color: "{{ 'green' if is_state('sensor.ubhinas_status','good') else 'red' }}"
                    layout: horizontal
                    tap_action:
                      action: more-info
                  - type: custom:layout-card
                    layout_type: custom:grid-layout
                    layout:
                      grid-template-columns: repeat(3, minmax(0, 1fr))
                      grid-gap: 6px
                    cards:
                      - type: custom:mushroom-entity-card
                        entity: sensor.ubhinas_cpu_usage
                        name: CPU
                        icon: mdi:cpu-64-bit
                        icon_color: light-blue
                        layout: horizontal
                      - type: custom:mushroom-entity-card
                        entity: sensor.ubhinas_memory_usage
                        name: RAM
                        icon: mdi:memory
                        icon_color: purple
                        layout: horizontal
                      - type: custom:mushroom-entity-card
                        entity: sensor.ubhinas_system_temperature
                        name: Temp
                        icon: mdi:thermometer
                        icon_color: amber
                        layout: horizontal

              # PlexNAS Card
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-template-card
                    entity: sensor.plexnas_status
                    primary: "PlexNAS · {{ states('sensor.plexnas_status') | title }}"
                    secondary: "Used: {{ states('sensor.plexnas_volume_used_storage') }}% · Free: {{ states('sensor.plexnas_free_space_storage') }} TB"
                    icon: mdi:nas
                    icon_color: "{{ 'green' if is_state('sensor.plexnas_status','good') else 'red' }}"
                    layout: horizontal
                    tap_action:
                      action: more-info
                  - type: custom:layout-card
                    layout_type: custom:grid-layout
                    layout:
                      grid-template-columns: repeat(3, minmax(0, 1fr))
                      grid-gap: 6px
                    cards:
                      - type: custom:mushroom-entity-card
                        entity: sensor.plexnas_cpu_usage
                        name: CPU
                        icon: mdi:cpu-64-bit
                        icon_color: light-blue
                        layout: horizontal
                      - type: custom:mushroom-entity-card
                        entity: sensor.plexnas_memory_usage
                        name: RAM
                        icon: mdi:memory
                        icon_color: purple
                        layout: horizontal
                      - type: custom:mushroom-entity-card
                        entity: sensor.plexnas_system_temperature
                        name: Temp
                        icon: mdi:thermometer
                        icon_color: amber
                        layout: horizontal

          # ════════════════════════════════════════════════════════════════════
          #  HP DL380 G9 TITAN AI SERVER — Conditional Telemetry
          # ════════════════════════════════════════════════════════════════════
          - type: conditional
            conditions:
              - condition: state
                entity: switch.homelab_server_pdu_outlet_2
                state: "on"
            card:
              type: vertical-stack
              cards:
                - type: custom:layout-card
                  layout_type: custom:grid-layout
                  layout:
                    grid-template-columns: repeat(4, minmax(0, 1fr))
                    grid-gap: 8px
                    mediaquery:
                      "(max-width: 900px)":
                        grid-template-columns: repeat(2, minmax(0, 1fr))
                  cards:
                    - type: custom:mushroom-entity-card
                      entity: sensor.hp_ilo_power_status
                      name: DL380 Power
                      icon: mdi:power
                      icon_color: green
                      layout: horizontal
                    - type: custom:mushroom-entity-card
                      entity: sensor.hp_ilo_power_reading
                      name: Power Draw
                      icon: mdi:flash
                      icon_color: amber
                      layout: horizontal
                    - type: custom:mushroom-template-card
                      entity: sensor.hp_ilo_temp_cpu1
                      primary: "CPU {{ states('sensor.hp_ilo_temp_cpu1') }}° / {{ states('sensor.hp_ilo_temp_cpu2') }}°C"
                      secondary: "Inlet {{ states('sensor.hp_ilo_temp_inlet') }}°C"
                      icon: mdi:thermometer
                      icon_color: amber
                      layout: horizontal
                    - type: custom:mushroom-template-card
                      primary: iLO Power Cycle
                      secondary: Toggle Server Power
                      icon: mdi:power-cycle
                      icon_color: red
                      layout: horizontal
                      tap_action:
                        action: call-service
                        service: rest_command.hp_server_toggleonoff
                        confirmation:
                          text: "Toggle HP DL380 via iLO?"

          # ════════════════════════════════════════════════════════════════════
          #  SUPERMICRO 01 & 02 — Conditional Telemetry
          # ════════════════════════════════════════════════════════════════════
          - type: conditional
            conditions:
              - condition: state
                entity: switch.homelab_server_pdu_outlet_3
                state: "on"
            card:
              type: custom:layout-card
              layout_type: custom:grid-layout
              layout:
                grid-template-columns: repeat(4, minmax(0, 1fr))
                grid-gap: 8px
                mediaquery:
                  "(max-width: 900px)":
                    grid-template-columns: repeat(2, minmax(0, 1fr))
              cards:
                - type: custom:mushroom-entity-card
                  entity: sensor.supermicro_01_state
                  name: SM-01 State
                  icon: mdi:server
                  layout: horizontal
                - type: custom:mushroom-entity-card
                  entity: sensor.supermicro_01_cpu1_temp
                  name: SM-01 CPU 1
                  icon: mdi:cpu-64-bit
                  layout: horizontal
                - type: custom:mushroom-entity-card
                  entity: sensor.supermicro_01_cpu2_temp
                  name: SM-01 CPU 2
                  icon: mdi:cpu-64-bit
                  layout: horizontal
                - type: custom:mushroom-entity-card
                  entity: sensor.supermicro_01_system_temp
                  name: SM-01 Sys Temp
                  icon: mdi:thermometer
                  layout: horizontal

          - type: conditional
            conditions:
              - condition: state
                entity: switch.homelab_server_pdu_outlet_4
                state: "on"
            card:
              type: custom:layout-card
              layout_type: custom:grid-layout
              layout:
                grid-template-columns: repeat(4, minmax(0, 1fr))
                grid-gap: 8px
                mediaquery:
                  "(max-width: 900px)":
                    grid-template-columns: repeat(2, minmax(0, 1fr))
              cards:
                - type: custom:mushroom-entity-card
                  entity: sensor.supermicro_02_state
                  name: SM-02 State
                  icon: mdi:server
                  layout: horizontal
                - type: custom:mushroom-entity-card
                  entity: sensor.supermicro_02_cpu1_temp
                  name: SM-02 CPU 1
                  icon: mdi:cpu-64-bit
                  layout: horizontal
                - type: custom:mushroom-entity-card
                  entity: sensor.supermicro_02_cpu2_temp
                  name: SM-02 CPU 2
                  icon: mdi:cpu-64-bit
                  layout: horizontal
                - type: custom:mushroom-entity-card
                  entity: sensor.supermicro_02_system_temp
                  name: SM-02 Sys Temp
                  icon: mdi:thermometer
                  layout: horizontal

          # ════════════════════════════════════════════════════════════════════
          #  HOME ASSISTANT CORE & WAN TELEMETRY (3-col / 2-col)
          # ════════════════════════════════════════════════════════════════════
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(3, minmax(0, 1fr))
              grid-gap: 8px
              mediaquery:
                "(max-width: 768px)":
                  grid-template-columns: repeat(2, minmax(0, 1fr))
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.processor_use
                name: HA CPU Usage
                icon: mdi:cpu-64-bit
                icon_color: green
                layout: horizontal

              - type: custom:mushroom-entity-card
                entity: sensor.memory_use_percent
                name: HA Memory
                icon: mdi:memory
                icon_color: light-blue
                layout: horizontal

              - type: custom:mushroom-entity-card
                entity: sensor.disk_free
                name: Disk Free
                icon: mdi:harddisk
                icon_color: cyan
                layout: horizontal

              - type: custom:mushroom-entity-card
                entity: sensor.load_1m
                name: Load (1m)
                icon: mdi:gauge
                icon_color: purple
                layout: horizontal

              - type: custom:mushroom-entity-card
                entity: sensor.xfinity_usage
                name: Xfinity Quota
                icon: mdi:wan
                icon_color: amber
                layout: horizontal

              - type: custom:mushroom-entity-card
                entity: sensor.speedtest_ping
                name: WAN Ping
                icon: mdi:speedometer
                icon_color: teal
                layout: horizontal
