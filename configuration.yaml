homeassistant:
  customize:
    cover.garage_door_small:
      friendly_name: "Moto Bay (Small Garage)"
      device_class: garage
      icon: mdi:motorbike
    cover.garage_door_big:
      friendly_name: "Big Garage Door"
      device_class: garage
      icon: mdi:garage
    sensor.garage_door_small_battery_level:
      friendly_name: "Moto Bay Tilt Sensor Battery"
      device_class: battery
    sensor.garage_battery_level:
      friendly_name: "Big Garage Tilt Sensor Battery"
      device_class: battery
    sensor.battery_level:
      friendly_name: "Master Bedroom Window Right Battery"
      device_class: battery
    sensor.battery_level_2:
      friendly_name: "Master Bedroom Window Left Small Battery"
      device_class: battery
    sensor.battery_level_3:
      friendly_name: "Kitchen Window Left Battery"
      device_class: battery
    sensor.nodeid_166_battery_level:
      friendly_name: "Upper Guest Bedroom Thermostat Battery"
      device_class: battery

  customize_glob:
    "binary_sensor.*door":
      device_class: door
    "binary_sensor.*window":
      device_class: window
    "binary_sensor.*window_left":
      device_class: window
    "binary_sensor.*window_right":
      device_class: window
    "binary_sensor.*window_left_small":
      device_class: window
    "binary_sensor.*window_right_small":
      device_class: window
    "binary_sensor.*window_front":
      device_class: window
    "binary_sensor.*window_peep":
      device_class: window
    "binary_sensor.*motion":
      device_class: motion
    "switch.*light_fan":
      icon: mdi:ceiling-fan-light
    "sensor.*battery_level*":
      device_class: battery


