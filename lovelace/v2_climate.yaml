title: Climate
path: climate
icon: mdi:thermometer
type: custom:grid-layout
layout:
  grid-template-columns: 1fr
  grid-gap: 16px
  margin: 12px 20px 28px 20px
  mediaquery:
    "(max-width: 800px)":
      margin: 8px 10px 20px 10px
cards:
  - type: vertical-stack
    cards:
      # ════════════════════════════════════════════════════════════════════════
      #  CLIMATE COMMAND HEADER + WHOLE-HOME QUICK PRESET BAR
      # ════════════════════════════════════════════════════════════════════════
      - type: custom:mushroom-template-card
        primary: >-
          {% set conflicts = [] %}
          {% if not is_state('climate.thermostat_master_bedroom', 'off') and (is_state('binary_sensor.master_bedroom_window_left', 'on') or is_state('binary_sensor.master_bedroom_window_right', 'on') or is_state('binary_sensor.master_bedroom_window_left_small', 'on') or is_state('binary_sensor.master_bedroom_window_right_small', 'on')) %}
            {% set conflicts = conflicts + ['Master Bed'] %}
          {% endif %}
          {% if not is_state('climate.thermostat_living_room', 'off') and (is_state('binary_sensor.living_room_window_left', 'on') or is_state('binary_sensor.living_room_window_right', 'on') or is_state('binary_sensor.kitchen_window_left', 'on') or is_state('binary_sensor.kitchen_window_right', 'on')) %}
            {% set conflicts = conflicts + ['Living/Kitchen'] %}
          {% endif %}
          {% if not is_state('climate.thermostat_entertainment_room', 'off') and (is_state('binary_sensor.entertainment_room_window_left', 'on') or is_state('binary_sensor.entertainment_room_window_right', 'on')) %}
            {% set conflicts = conflicts + ['Entertainment'] %}
          {% endif %}
          {% if not is_state('climate.thermostat_upper_big_bedroom', 'off') and (is_state('binary_sensor.upper_big_bedroom_window_left', 'on') or is_state('binary_sensor.upper_big_bedroom_window_right', 'on')) %}
            {% set conflicts = conflicts + ['Upper Big Bed'] %}
          {% endif %}
          {% if not is_state('climate.thermostat_upper_small_bedroom', 'off') and is_state('binary_sensor.upper_small_bedroom_window', 'on') %}
            {% set conflicts = conflicts + ['Upper Small Bed'] %}
          {% endif %}
          {% if not is_state('climate.thermostat_upper_guest_bedroom', 'off') and is_state('binary_sensor.upper_guest_bedroom_window', 'on') %}
            {% set conflicts = conflicts + ['Guest Bed'] %}
          {% endif %}
          {% if conflicts | count > 0 %}
            ⚠️ HVAC Window Conflict: {{ conflicts | join(', ') }} Window Open!
          {% else %}
            Climate Command Center
          {% endif %}
        secondary: >-
          {% set zones = [
            states('climate.thermostat_master_bedroom'),
            states('climate.thermostat_living_room'),
            states('climate.thermostat_entertainment_room'),
            states('climate.thermostat_upper_big_bedroom'),
            states('climate.thermostat_upper_small_bedroom'),
            states('climate.thermostat_upper_guest_bedroom'),
            states('climate.thermostat_attic')
          ] %}
          {% set active = zones | reject('in', ['off', 'Off', 'unknown', 'unavailable']) | list | count %}
          {% set open_wins = expand(["binary_sensor.welcome_window_left","binary_sensor.welcome_window_right","binary_sensor.welcome_window_front","binary_sensor.welcome_window_peep","binary_sensor.living_room_window_left","binary_sensor.living_room_window_right","binary_sensor.kitchen_window_left","binary_sensor.kitchen_window_right","binary_sensor.entertainment_room_window_left","binary_sensor.entertainment_room_window_right","binary_sensor.master_bedroom_window_left","binary_sensor.master_bedroom_window_right","binary_sensor.master_bedroom_window_left_small","binary_sensor.master_bedroom_window_right_small","binary_sensor.master_bathroom_window","binary_sensor.upper_big_bedroom_window_left","binary_sensor.upper_big_bedroom_window_right","binary_sensor.upper_small_bedroom_window","binary_sensor.upper_guest_bedroom_window"]) | selectattr("state","eq","on") | list | count %}
          {{ active }} of 7 Zones Active · {{ 'All Windows Sealed (Optimal Efficiency)' if open_wins == 0 else (open_wins ~ ' Window(s) Currently Open') }}
        icon: mdi:thermometer
        icon_color: >-
          {% set open_wins = expand(["binary_sensor.welcome_window_left","binary_sensor.welcome_window_right","binary_sensor.welcome_window_front","binary_sensor.welcome_window_peep","binary_sensor.living_room_window_left","binary_sensor.living_room_window_right","binary_sensor.kitchen_window_left","binary_sensor.kitchen_window_right","binary_sensor.entertainment_room_window_left","binary_sensor.entertainment_room_window_right","binary_sensor.master_bedroom_window_left","binary_sensor.master_bedroom_window_right","binary_sensor.master_bedroom_window_left_small","binary_sensor.master_bedroom_window_right_small","binary_sensor.master_bathroom_window","binary_sensor.upper_big_bedroom_window_left","binary_sensor.upper_big_bedroom_window_right","binary_sensor.upper_small_bedroom_window","binary_sensor.upper_guest_bedroom_window"]) | selectattr("state","eq","on") | list | count %}
          {{ 'amber' if open_wins > 0 else 'cyan' }}
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, rgba(35, 44, 64, 0.88) 0%, rgba(25, 31, 46, 0.94) 100%) !important;
              border-radius: 8px !important;
              border: 1px solid rgba(56, 189, 248, 0.24) !important;
              box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.12), 0 10px 24px -6px rgba(8, 12, 21, 0.45) !important;
              padding: 10px 14px !important;
            }
            mushroom-state-info {
              --card-primary-font-size: 20px;
              --card-primary-font-weight: 700;
              --card-secondary-font-size: 13px;
            }

      # ── Whole-Home Master Preset Bar ──
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: repeat(5, 1fr)
          grid-gap: 10px
          margin: 10px 0 14px 0
          mediaquery:
            "(max-width: 900px)":
              grid-template-columns: repeat(2, 1fr)
        cards:
          - type: custom:mushroom-template-card
            primary: All Zones Off
            secondary: Standby Mode
            icon: mdi:power-off
            icon_color: red
            layout: horizontal
            tap_action:
              action: call-service
              service: script.climate_all_zones_preset
              data:
                preset_mode: "off"
            card_mod: &preset_btn
              style: |
                ha-card {
                  background: linear-gradient(145deg, rgba(41, 50, 72, 0.82) 0%, rgba(28, 35, 52, 0.96) 100%) !important;
                  border-radius: 8px !important;
                  border: 1px solid rgba(255, 255, 255, 0.09) !important;
                  box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.10), 0 6px 16px -4px rgba(8, 12, 21, 0.40) !important;
                }
                mushroom-state-info {
                  --card-primary-font-size: 13.5px;
                  --card-primary-font-weight: 700;
                  --card-secondary-font-size: 11px;
                }

          - type: custom:mushroom-template-card
            primary: Smart Auto
            secondary: All Zones · 68°–73°F
            icon: mdi:thermostat-auto
            icon_color: green
            layout: horizontal
            tap_action:
              action: call-service
              service: script.climate_all_zones_preset
              data:
                preset_mode: "auto"
                target_temp_low: 68
                target_temp_high: 73
            card_mod: *preset_btn

          - type: custom:mushroom-template-card
            primary: Comfort Heat
            secondary: All Zones · 70°F
            icon: mdi:fire
            icon_color: orange
            layout: horizontal
            tap_action:
              action: call-service
              service: script.climate_all_zones_preset
              data:
                preset_mode: "heat"
                target_temp: 70
            card_mod: *preset_btn

          - type: custom:mushroom-template-card
            primary: Cool Breeze
            secondary: All Zones · 72°F
            icon: mdi:snowflake
            icon_color: light-blue
            layout: horizontal
            tap_action:
              action: call-service
              service: script.climate_all_zones_preset
              data:
                preset_mode: "cool"
                target_temp: 72
            card_mod: *preset_btn

          - type: custom:mushroom-template-card
            primary: Night Sleep
            secondary: Bedrooms · 67°F
            icon: mdi:weather-night
            icon_color: indigo
            layout: horizontal
            tap_action:
              action: call-service
              service: script.climate_all_zones_preset
              data:
                preset_mode: "sleep"
                target_temp: 67
            card_mod: *preset_btn

      # ════════════════════════════════════════════════════════════════════════
      #  INDIVIDUAL ZONE THERMOSTAT CONSOLES (Capability-Driven Generic Cards)
      # ════════════════════════════════════════════════════════════════════════
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: repeat(2, 1fr)
          grid-gap: 14px
          mediaquery:
            "(max-width: 1100px)":
              grid-template-columns: 1fr
        cards:
              # ════════════════════════════════════════════════════════════════
              #  ZONE CONSOLE: MASTER BEDROOM
              # ════════════════════════════════════════════════════════════════
              - type: custom:stack-in-card
                mode: vertical
                keep:
                  border: true
                  border_radius: true
                  background: true
                  box_shadow: true
                card_mod:
                  style: |
                    ha-card {
                      {% set m = states('climate.thermostat_master_bedroom') | lower %}
                      {% if m == 'heat' %}
                      background: radial-gradient(circle at 12% 0%, rgba(251, 146, 60, 0.18), rgba(30, 37, 54, 0.94) 70%) !important;
                      border: 1px solid rgba(251, 146, 60, 0.36) !important;
                      {% elif m == 'cool' %}
                      background: radial-gradient(circle at 12% 0%, rgba(56, 189, 248, 0.18), rgba(30, 37, 54, 0.94) 70%) !important;
                      border: 1px solid rgba(56, 189, 248, 0.36) !important;
                      {% elif m in ['auto', 'heat_cool'] %}
                      background: radial-gradient(circle at 12% 0%, rgba(52, 211, 153, 0.16), rgba(30, 37, 54, 0.94) 70%) !important;
                      border: 1px solid rgba(52, 211, 153, 0.34) !important;
                      {% else %}
                      background: linear-gradient(145deg, rgba(38, 46, 66, 0.86) 0%, rgba(27, 34, 50, 0.94) 100%) !important;
                      border: 1px solid rgba(255, 255, 255, 0.09) !important;
                      {% endif %}
                      border-radius: 8px !important;
                      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.12), 0 10px 22px -6px rgba(8, 12, 21, 0.45) !important;
                      padding: 4px 10px 10px 10px !important;
                    }
                cards:
                  # ── 1. Zone Telemetry Header ──
                  - type: custom:mushroom-template-card
                    entity: climate.thermostat_master_bedroom
                    primary: "Master Bedroom"
                    secondary: >-
                      {% set c = 'climate.thermostat_master_bedroom' %}
                      {% set h = states('sensor.master_bedroom_thermostat_master_bedroom_thermostat_humidity_air_2') if states('sensor.master_bedroom_thermostat_master_bedroom_thermostat_humidity_air_2') not in ['unknown', 'unavailable', 'none'] else states('sensor.master_bedroom_thermostat_humidity_air_1') %}
                      {% set f_raw = (state_attr(c, 'fan_mode') | default('auto', true) | string | lower) %}
                      {% set f = 'ON' if f_raw in ['on', 'low', 'high', 'medium'] else 'AUTO' %}
                      {% set m = states(c) | lower %}
                      {% set t_low = state_attr(c, 'target_temp_low') | default(state_attr(c, 'temperature'), true) | int(68) %}
                      {% set t_high = state_attr(c, 'target_temp_high') | default(state_attr(c, 'temperature'), true) | int(73) %}
                      Room: {{ state_attr(c, 'current_temperature') | float(0) | round(1) }}°F · {{ h | int(0) }}% RH · {% if m == 'off' %}OFF{% elif m == 'heat' %}HEAT → {{ t_low }}°F{% elif m == 'cool' %}COOL → {{ t_high }}°F{% else %}AUTO → {{ t_low }}°F – {{ t_high }}°F{% endif %} · Fan: {{ f }}
                    icon: mdi:bed-king-outline
                    icon_color: >-
                      {% set m = states('climate.thermostat_master_bedroom') | lower %}
                      {% if m == 'heat' %}orange{% elif m == 'cool' %}light-blue{% elif m in ['auto', 'heat_cool'] %}green{% else %}blue-grey{% endif %}
                    badge_icon: >-
                      {% set m = states('climate.thermostat_master_bedroom') | lower %}
                      {% if m == 'heat' %}mdi:fire{% elif m == 'cool' %}mdi:snowflake{% elif m in ['auto', 'heat_cool'] %}mdi:thermostat-auto{% else %}mdi:power-standby{% endif %}
                    badge_color: >-
                      {% set m = states('climate.thermostat_master_bedroom') | lower %}
                      {% if m == 'heat' %}orange{% elif m == 'cool' %}light-blue{% elif m in ['auto', 'heat_cool'] %}green{% else %}grey{% endif %}
                    tap_action:
                      action: more-info
                      entity: climate.thermostat_master_bedroom
                    card_mod:
                      style: |
                        ha-card {
                          background: transparent !important;
                          border: none !important;
                          box-shadow: none !important;
                          padding: 4px 2px 4px 2px !important;
                        }
                        mushroom-state-info {
                          --card-primary-font-size: 16px;
                          --card-primary-font-weight: 700;
                          --card-secondary-font-size: 12px;
                        }
                        mushroom-shape-icon {
                          --icon-size: 36px;
                        }

                  # ── 2. Generic Capability-Driven Controls & Setpoint Bar ──
                  - type: custom:thermostat-range-bar
                    entity: climate.thermostat_master_bedroom
                    min: 55
                    max: 85
                    min_gap: 2

              # ════════════════════════════════════════════════════════════════
              #  ZONE CONSOLE: LIVING ROOM
              # ════════════════════════════════════════════════════════════════
              - type: custom:stack-in-card
                mode: vertical
                keep:
                  border: true
                  border_radius: true
                  background: true
                  box_shadow: true
                card_mod:
                  style: |
                    ha-card {
                      {% set m = states('climate.thermostat_living_room') | lower %}
                      {% if m == 'heat' %}
                      background: radial-gradient(circle at 12% 0%, rgba(251, 146, 60, 0.18), rgba(30, 37, 54, 0.94) 70%) !important;
                      border: 1px solid rgba(251, 146, 60, 0.36) !important;
                      {% elif m == 'cool' %}
                      background: radial-gradient(circle at 12% 0%, rgba(56, 189, 248, 0.18), rgba(30, 37, 54, 0.94) 70%) !important;
                      border: 1px solid rgba(56, 189, 248, 0.36) !important;
                      {% elif m in ['auto', 'heat_cool'] %}
                      background: radial-gradient(circle at 12% 0%, rgba(52, 211, 153, 0.16), rgba(30, 37, 54, 0.94) 70%) !important;
                      border: 1px solid rgba(52, 211, 153, 0.34) !important;
                      {% else %}
                      background: linear-gradient(145deg, rgba(38, 46, 66, 0.86) 0%, rgba(27, 34, 50, 0.94) 100%) !important;
                      border: 1px solid rgba(255, 255, 255, 0.09) !important;
                      {% endif %}
                      border-radius: 8px !important;
                      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.12), 0 10px 22px -6px rgba(8, 12, 21, 0.45) !important;
                      padding: 4px 10px 10px 10px !important;
                    }
                cards:
                  # ── 1. Zone Telemetry Header ──
                  - type: custom:mushroom-template-card
                    entity: climate.thermostat_living_room
                    primary: "Living Room"
                    secondary: >-
                      {% set c = 'climate.thermostat_living_room' %}
                      {% set h = states('sensor.living_room_thermostat_living_room_thermostat_humidity_air_2') if states('sensor.living_room_thermostat_living_room_thermostat_humidity_air_2') not in ['unknown', 'unavailable', 'none'] else states('sensor.thermostat_living_room_humidity') %}
                      {% set f_raw = (state_attr(c, 'fan_mode') | default('auto', true) | string | lower) %}
                      {% set f = 'ON' if f_raw in ['on', 'low', 'high', 'medium'] else 'AUTO' %}
                      {% set m = states(c) | lower %}
                      {% set t_low = state_attr(c, 'target_temp_low') | default(state_attr(c, 'temperature'), true) | int(68) %}
                      {% set t_high = state_attr(c, 'target_temp_high') | default(state_attr(c, 'temperature'), true) | int(73) %}
                      Room: {{ state_attr(c, 'current_temperature') | float(0) | round(1) }}°F · {{ h | int(0) }}% RH · {% if m == 'off' %}OFF{% elif m == 'heat' %}HEAT → {{ t_low }}°F{% elif m == 'cool' %}COOL → {{ t_high }}°F{% else %}AUTO → {{ t_low }}°F – {{ t_high }}°F{% endif %} · Fan: {{ f }}
                    icon: mdi:sofa-outline
                    icon_color: >-
                      {% set m = states('climate.thermostat_living_room') | lower %}
                      {% if m == 'heat' %}orange{% elif m == 'cool' %}light-blue{% elif m in ['auto', 'heat_cool'] %}green{% else %}blue-grey{% endif %}
                    badge_icon: >-
                      {% set m = states('climate.thermostat_living_room') | lower %}
                      {% if m == 'heat' %}mdi:fire{% elif m == 'cool' %}mdi:snowflake{% elif m in ['auto', 'heat_cool'] %}mdi:thermostat-auto{% else %}mdi:power-standby{% endif %}
                    badge_color: >-
                      {% set m = states('climate.thermostat_living_room') | lower %}
                      {% if m == 'heat' %}orange{% elif m == 'cool' %}light-blue{% elif m in ['auto', 'heat_cool'] %}green{% else %}grey{% endif %}
                    tap_action:
                      action: more-info
                      entity: climate.thermostat_living_room
                    card_mod:
                      style: |
                        ha-card {
                          background: transparent !important;
                          border: none !important;
                          box-shadow: none !important;
                          padding: 4px 2px 4px 2px !important;
                        }
                        mushroom-state-info {
                          --card-primary-font-size: 16px;
                          --card-primary-font-weight: 700;
                          --card-secondary-font-size: 12px;
                        }
                        mushroom-shape-icon {
                          --icon-size: 36px;
                        }

                  # ── 2. Generic Capability-Driven Controls & Setpoint Bar ──
                  - type: custom:thermostat-range-bar
                    entity: climate.thermostat_living_room
                    min: 55
                    max: 85
                    min_gap: 2

              # ════════════════════════════════════════════════════════════════
              #  ZONE CONSOLE: ENTERTAINMENT ROOM
              # ════════════════════════════════════════════════════════════════
              - type: custom:stack-in-card
                mode: vertical
                keep:
                  border: true
                  border_radius: true
                  background: true
                  box_shadow: true
                card_mod:
                  style: |
                    ha-card {
                      {% set m = states('climate.thermostat_entertainment_room') | lower %}
                      {% if m == 'heat' %}
                      background: radial-gradient(circle at 12% 0%, rgba(251, 146, 60, 0.18), rgba(30, 37, 54, 0.94) 70%) !important;
                      border: 1px solid rgba(251, 146, 60, 0.36) !important;
                      {% elif m == 'cool' %}
                      background: radial-gradient(circle at 12% 0%, rgba(56, 189, 248, 0.18), rgba(30, 37, 54, 0.94) 70%) !important;
                      border: 1px solid rgba(56, 189, 248, 0.36) !important;
                      {% elif m in ['auto', 'heat_cool'] %}
                      background: radial-gradient(circle at 12% 0%, rgba(52, 211, 153, 0.16), rgba(30, 37, 54, 0.94) 70%) !important;
                      border: 1px solid rgba(52, 211, 153, 0.34) !important;
                      {% else %}
                      background: linear-gradient(145deg, rgba(38, 46, 66, 0.86) 0%, rgba(27, 34, 50, 0.94) 100%) !important;
                      border: 1px solid rgba(255, 255, 255, 0.09) !important;
                      {% endif %}
                      border-radius: 8px !important;
                      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.12), 0 10px 22px -6px rgba(8, 12, 21, 0.45) !important;
                      padding: 4px 10px 10px 10px !important;
                    }
                cards:
                  # ── 1. Zone Telemetry Header ──
                  - type: custom:mushroom-template-card
                    entity: climate.thermostat_entertainment_room
                    primary: "Entertainment Room"
                    secondary: >-
                      {% set c = 'climate.thermostat_entertainment_room' %}
                      {% set h = states('sensor.thermostat_entertainment_room_humidity') %}
                      {% set f_raw = (state_attr(c, 'fan_mode') | default('auto', true) | string | lower) %}
                      {% set f = 'ON' if f_raw in ['on', 'low', 'high', 'medium'] else 'AUTO' %}
                      {% set m = states(c) | lower %}
                      {% set t_low = state_attr(c, 'target_temp_low') | default(state_attr(c, 'temperature'), true) | int(68) %}
                      {% set t_high = state_attr(c, 'target_temp_high') | default(state_attr(c, 'temperature'), true) | int(73) %}
                      Room: {{ state_attr(c, 'current_temperature') | float(0) | round(1) }}°F · {{ h | int(0) }}% RH · {% if m == 'off' %}OFF{% elif m == 'heat' %}HEAT → {{ t_low }}°F{% elif m == 'cool' %}COOL → {{ t_high }}°F{% else %}AUTO → {{ t_low }}°F – {{ t_high }}°F{% endif %} · Fan: {{ f }}
                    icon: mdi:television-ambient-light
                    icon_color: >-
                      {% set m = states('climate.thermostat_entertainment_room') | lower %}
                      {% if m == 'heat' %}orange{% elif m == 'cool' %}light-blue{% elif m in ['auto', 'heat_cool'] %}green{% else %}blue-grey{% endif %}
                    badge_icon: >-
                      {% set m = states('climate.thermostat_entertainment_room') | lower %}
                      {% if m == 'heat' %}mdi:fire{% elif m == 'cool' %}mdi:snowflake{% elif m in ['auto', 'heat_cool'] %}mdi:thermostat-auto{% else %}mdi:power-standby{% endif %}
                    badge_color: >-
                      {% set m = states('climate.thermostat_entertainment_room') | lower %}
                      {% if m == 'heat' %}orange{% elif m == 'cool' %}light-blue{% elif m in ['auto', 'heat_cool'] %}green{% else %}grey{% endif %}
                    tap_action:
                      action: more-info
                      entity: climate.thermostat_entertainment_room
                    card_mod:
                      style: |
                        ha-card {
                          background: transparent !important;
                          border: none !important;
                          box-shadow: none !important;
                          padding: 4px 2px 4px 2px !important;
                        }
                        mushroom-state-info {
                          --card-primary-font-size: 16px;
                          --card-primary-font-weight: 700;
                          --card-secondary-font-size: 12px;
                        }
                        mushroom-shape-icon {
                          --icon-size: 36px;
                        }

                  # ── 2. Generic Capability-Driven Controls & Setpoint Bar ──
                  - type: custom:thermostat-range-bar
                    entity: climate.thermostat_entertainment_room
                    min: 55
                    max: 85
                    min_gap: 2

              # ════════════════════════════════════════════════════════════════
              #  ZONE CONSOLE: UPPER BIG BEDROOM
              # ════════════════════════════════════════════════════════════════
              - type: custom:stack-in-card
                mode: vertical
                keep:
                  border: true
                  border_radius: true
                  background: true
                  box_shadow: true
                card_mod:
                  style: |
                    ha-card {
                      {% set m = states('climate.thermostat_upper_big_bedroom') | lower %}
                      {% if m == 'heat' %}
                      background: radial-gradient(circle at 12% 0%, rgba(251, 146, 60, 0.18), rgba(30, 37, 54, 0.94) 70%) !important;
                      border: 1px solid rgba(251, 146, 60, 0.36) !important;
                      {% elif m == 'cool' %}
                      background: radial-gradient(circle at 12% 0%, rgba(56, 189, 248, 0.18), rgba(30, 37, 54, 0.94) 70%) !important;
                      border: 1px solid rgba(56, 189, 248, 0.36) !important;
                      {% elif m in ['auto', 'heat_cool'] %}
                      background: radial-gradient(circle at 12% 0%, rgba(52, 211, 153, 0.16), rgba(30, 37, 54, 0.94) 70%) !important;
                      border: 1px solid rgba(52, 211, 153, 0.34) !important;
                      {% else %}
                      background: linear-gradient(145deg, rgba(38, 46, 66, 0.86) 0%, rgba(27, 34, 50, 0.94) 100%) !important;
                      border: 1px solid rgba(255, 255, 255, 0.09) !important;
                      {% endif %}
                      border-radius: 8px !important;
                      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.12), 0 10px 22px -6px rgba(8, 12, 21, 0.45) !important;
