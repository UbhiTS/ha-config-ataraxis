title: Security
icon: mdi:shield-home-outline
panel: true
cards:
  - type: vertical-stack
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr
          grid-gap: 14px
          margin: 14px 18px 24px 18px
        cards:

          # ════════════════════════════════════════════════════════════════════
          #  SOLSTICE SECURITY HUD — Perimeter Defense & 12-Camera Surveillance
          # ════════════════════════════════════════════════════════════════════
          - type: markdown
            content: >-
              {% set doors = expand(["binary_sensor.main_door","binary_sensor.welcome_laundry_door","binary_sensor.garage_laundry_door","binary_sensor.kitchen_door","binary_sensor.master_bedroom_door","binary_sensor.upper_big_bedroom_door","binary_sensor.upper_small_bedroom_door","binary_sensor.upper_guest_bedroom_door","binary_sensor.upper_common_bathroom_door","binary_sensor.lower_common_bathroom_door"]) | selectattr("state","eq","on") | list | count %}
              {% set wins = expand(["binary_sensor.welcome_window_left","binary_sensor.welcome_window_right","binary_sensor.welcome_window_front","binary_sensor.welcome_window_peep","binary_sensor.living_room_window_left","binary_sensor.living_room_window_right","binary_sensor.kitchen_window_left","binary_sensor.kitchen_window_right","binary_sensor.entertainment_room_window_left","binary_sensor.entertainment_room_window_right","binary_sensor.master_bedroom_window_left","binary_sensor.master_bedroom_window_right","binary_sensor.master_bedroom_window_left_small","binary_sensor.master_bedroom_window_right_small","binary_sensor.master_bathroom_window","binary_sensor.upper_big_bedroom_window_left","binary_sensor.upper_big_bedroom_window_right","binary_sensor.upper_small_bedroom_window","binary_sensor.upper_guest_bedroom_window"]) | selectattr("state","eq","on") | list | count %}
              {% set garage = expand(["cover.garage_door_small","cover.garage_door_big"]) | selectattr("state","eq","open") | list | count %}
              {% set total_open = doors + wins + garage %}
              <div class="hud-bar">
                <div class="hud-left">
                  <div class="hud-eyebrow">SOLSTICE PERIMETER SHIELD · 12-CAMERA OPTICS & SENSORS</div>
                  <div class="hud-title">Security & Surveillance <span class="hud-divider">·</span> <span class="hud-sub">{{ 'All Entry Points Closed' if total_open == 0 else (total_open ~ ' Entry Point(s) Open') }}</span></div>
                </div>
                <div class="hud-badges">
                  <span class="hud-pill {{ 'pill-alert' if doors > 0 else 'pill-ok' }}">🚪 {{ doors }} Door{{ 's' if doors != 1 }} Open</span>
                  <span class="hud-pill {{ 'pill-amber' if wins > 0 else 'pill-ok' }}">🪟 {{ wins }} Window{{ 's' if wins != 1 }} Open</span>
                  <span class="hud-pill {{ 'pill-alert' if garage > 0 else 'pill-ok' }}">🚗 Garage {{ 'OPEN' if garage > 0 else 'Closed' }}</span>
                  <span class="hud-pill {{ 'pill-ok' if is_state('switch.homelab_server_pdu_outlet_8','on') else 'pill-alert' }}">📹 NVR {{ 'Online' if is_state('switch.homelab_server_pdu_outlet_8','on') else 'OFFLINE' }}</span>
                </div>
              </div>
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg, rgba(41, 50, 72, 0.92) 0%, rgba(28, 35, 52, 0.96) 100%) !important;
                  border-radius: 8px !important;
                  border: 1px solid rgba(255, 255, 255, 0.09) !important;
                  box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.14), 0 12px 30px -8px rgba(8, 12, 21, 0.5) !important;
                  padding: 4px 10px !important;
                }
                .hud-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
                .hud-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 1.8px; color: #34d399; margin-bottom: 2px; }
                .hud-title { font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 700; color: #f8fafc; letter-spacing: -0.3px; }
                .hud-divider { color: rgba(148, 163, 184, 0.45); margin: 0 4px; }
                .hud-sub { font-weight: 500; font-size: 16px; color: #94a3b8; }
                .hud-badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
                .hud-pill { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12.5px; font-weight: 600; padding: 6px 14px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.08); }
                .pill-ok { background: rgba(52, 211, 153, 0.14); color: #6ee7b7; border-color: rgba(52, 211, 153, 0.3); }
                .pill-amber { background: rgba(251, 191, 36, 0.16); color: #fde68a; border-color: rgba(251, 191, 36, 0.34); }
                .pill-alert { background: rgba(251, 113, 133, 0.18); color: #fda4af; border-color: rgba(251, 113, 133, 0.38); }

          # ════════════════════════════════════════════════════════════════════
          #  GARAGE COMMAND + PERIMETER STATUS BANNER
          # ════════════════════════════════════════════════════════════════════
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: 1fr 1fr
              grid-gap: 14px
              mediaquery:
                "(max-width: 700px)":
                  grid-template-columns: 1fr
            cards:
              - type: custom:mushroom-cover-card
                entity: cover.garage_door_big
                name: Garage Door Big
                icon: mdi:garage
                show_buttons_control: true
                show_position_control: false
                layout: horizontal
                card_mod: &sec_card
                  style: |
                    ha-card {
                      background: linear-gradient(145deg, rgba(41, 50, 72, 0.90) 0%, rgba(30, 37, 54, 0.94) 100%) !important;
                      border-radius: 8px !important;
                      border: 1px solid rgba(255, 255, 255, 0.085) !important;
                      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.12), 0 12px 28px -8px rgba(9, 13, 22, 0.45) !important;
                    }
              - type: custom:mushroom-cover-card
                entity: cover.garage_door_small
                name: Garage Door Small
                icon: mdi:garage-variant
                show_buttons_control: true
                show_position_control: false
                layout: horizontal
                card_mod: *sec_card

          # ── All Secure Emerald Glass Banner ──
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.main_door
                state: "off"
              - condition: state
                entity: binary_sensor.kitchen_door
                state: "off"
              - condition: state
                entity: binary_sensor.garage_laundry_door
                state: "off"
              - condition: state
                entity: cover.garage_door_big
                state: "closed"
              - condition: state
                entity: cover.garage_door_small
                state: "closed"
            card:
              type: custom:mushroom-template-card
              primary: Perimeter Armed & Secure
              secondary: All primary entry doors and garage bays are sealed
              icon: mdi:shield-check-outline
              icon_color: green
              layout: horizontal
              card_mod:
                style: |
                  ha-card {
                    background: linear-gradient(135deg, rgba(52, 211, 153, 0.14) 0%, rgba(30, 38, 56, 0.84) 100%) !important;
                    border-radius: 8px !important;
                    border: 1px solid rgba(52, 211, 153, 0.28) !important;
                  }

          # ── Currently Open Items (hidden when empty) ──
          - type: custom:auto-entities
            card:
              type: entities
              title: Active Open Entry Points
              show_header_toggle: false
              card_mod:
                style: |
                  ha-card {
                    background: linear-gradient(135deg, rgba(251, 113, 133, 0.14) 0%, rgba(31, 38, 56, 0.88) 100%) !important;
                    border-radius: 8px !important;
                    border: 1px solid rgba(251, 113, 133, 0.32) !important;
                  }
            show_empty: false
            sort:
              method: state
              reverse: true
            filter:
              include:
                - domain: binary_sensor
                  attributes:
                    device_class: door
                  state: "on"
                - domain: binary_sensor
                  attributes:
                    device_class: window
                  state: "on"
              exclude:
                - entity_id: "*_door_state"
                - entity_id: "*_window_state"
                - entity_id: "*_state_of_*"
                - domain: cover
                  state: open

          # ════════════════════════════════════════════════════════════════════
          #  12-CAMERA SURVEILLANCE WALL — Framed Evening Glass Viewports
          # ════════════════════════════════════════════════════════════════════
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: 1fr 1fr 1fr
              grid-gap: 12px
              mediaquery:
                "(max-width: 1000px)":
                  grid-template-columns: 1fr 1fr
                "(max-width: 600px)":
                  grid-template-columns: 1fr
            cards:
              - type: picture-glance
                title: Main Door
                camera_image: camera.main_door_camera
                camera_view: auto
                entities:
                  - binary_sensor.main_door
                  - light.living_room_light
                card_mod: &cam_card
                  style: |
                    ha-card {
                      border-radius: 8px !important;
                      overflow: hidden;
                      border: 1px solid rgba(255, 255, 255, 0.10) !important;
                      box-shadow: 0 12px 28px -8px rgba(8, 12, 21, 0.5) !important;
                    }

              - type: picture-glance
                title: Living Room
                camera_image: camera.living_room_camera
                camera_view: auto
                entities:
                  - light.living_room_light
                card_mod: *cam_card

              - type: picture-glance
                title: Upper Hallway
                camera_image: camera.hallway_camera
                camera_view: auto
                entities: []
                card_mod: *cam_card

              - type: picture-glance
                title: Front Left
                camera_image: camera.front_left_camera
                camera_view: auto
                entities: []
                card_mod: *cam_card

              - type: picture-glance
                title: Welcome Room
                camera_image: camera.welcome_room_camera
                camera_view: auto
                entities:
                  - switch.welcome_room_light
                card_mod: *cam_card

              - type: picture-glance
                title: Front Right
                camera_image: camera.front_right_camera
                camera_view: auto
                entities: []
                card_mod: *cam_card

              - type: picture-glance
                title: Front Street Right
                camera_image: camera.front_street_right_camera
                camera_view: auto
                entities: []
                card_mod: *cam_card

              - type: picture-glance
                title: Front Street Straight
                camera_image: camera.front_street_straight_camera
                camera_view: auto
                entities: []
                card_mod: *cam_card

              - type: picture-glance
                title: Side Deck
                camera_image: camera.side_deck_camera
                camera_view: auto
                entities:
                  - switch.side_deck_light
                card_mod: *cam_card

              - type: picture-glance
                title: Garage Left
                camera_image: camera.garage_left_camera
                camera_view: auto
                entities:
                  - cover.garage_door_big
                  - cover.garage_door_small
                card_mod: *cam_card

              - type: picture-glance
                title: Garage Right
                camera_image: camera.garage_right_camera
                camera_view: auto
                entities:
                  - cover.garage_door_big
                card_mod: *cam_card

              - type: picture-glance
                title: Backyard Left
                camera_image: camera.backyard_left_camera
                camera_view: auto
                entities:
                  - switch.backyard_light_left
                card_mod: *cam_card

              - type: picture-glance
                title: Backyard Right
                camera_image: camera.backyard_right_camera
                camera_view: auto
                entities:
                  - switch.backyard_light_right
                card_mod: *cam_card

              - type: picture-glance
                title: Veggie Garden Left
                camera_image: camera.veggie_garden_left_camera
                camera_view: auto
                entities: []
                card_mod: *cam_card

              - type: picture-glance
                title: Veggie Garden Right
                camera_image: camera.veggie_garden_right_camera
                camera_view: auto
                entities: []
                card_mod: *cam_card

          # ════════════════════════════════════════════════════════════════════
          #  DOORS & WINDOWS — Tactile Soft-UI Sensor Matrix
          # ════════════════════════════════════════════════════════════════════
          - type: custom:mushroom-title-card
            title: Downstairs Perimeter
            subtitle: Entry Doors & Window Sensors

          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(4, 1fr)
              grid-gap: 10px
              mediaquery:
                "(max-width: 1000px)":
                  grid-template-columns: repeat(3, 1fr)
                "(max-width: 600px)":
                  grid-template-columns: 1fr 1fr
            cards:
              - type: custom:mushroom-entity-card
                entity: binary_sensor.main_door
                name: Main Door
                layout: horizontal
                icon_color: "{{ 'red' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: &card_border
                  style: |
                    ha-card {
                      border-radius: 8px !important;
                      {% set dc = state_attr(config.entity, 'device_class') %}
                      {% if is_state(config.entity, 'on') %}
                        {% if dc == 'door' %}
                        background: linear-gradient(135deg, rgba(251, 113, 133, 0.22), rgba(31, 38, 56, 0.88)) !important;
                        border: 1px solid rgba(251, 113, 133, 0.42) !important;
                        {% else %}
                        background: linear-gradient(135deg, rgba(251, 191, 36, 0.20), rgba(31, 38, 56, 0.88)) !important;
                        border: 1px solid rgba(251, 191, 36, 0.38) !important;
                        {% endif %}
                      {% else %}
                      background: linear-gradient(145deg, rgba(41, 50, 72, 0.75) 0%, rgba(30, 37, 54, 0.84) 100%) !important;
                      border: 1px solid rgba(255, 255, 255, 0.075) !important;
                      {% endif %}
                    }
              - type: custom:mushroom-entity-card
                entity: binary_sensor.kitchen_door
                name: Kitchen Door
                layout: horizontal
                icon_color: "{{ 'red' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.garage_laundry_door
                name: Garage Laundry
                layout: horizontal
                icon_color: "{{ 'red' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.welcome_laundry_door
                name: Welcome Laundry
                layout: horizontal
                icon_color: "{{ 'red' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.lower_common_bathroom_door
                name: Bathroom
                layout: horizontal
                icon_color: "{{ 'red' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.master_bedroom_door
                name: Master BR
                layout: horizontal
                icon_color: "{{ 'red' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.living_room_window_left
                name: Living L
                layout: horizontal
                icon_color: "{{ 'amber' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.living_room_window_right
                name: Living R
                layout: horizontal
                icon_color: "{{ 'amber' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.master_bedroom_window_left
                name: Master Win L
                layout: horizontal
                icon_color: "{{ 'amber' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.master_bedroom_window_right
                name: Master Win R
                layout: horizontal
                icon_color: "{{ 'amber' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.master_bedroom_window_left_small
                name: Master Sm L
                layout: horizontal
                icon_color: "{{ 'amber' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.master_bedroom_window_right_small
                name: Master Sm R
                layout: horizontal
                icon_color: "{{ 'amber' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.master_bathroom_window
                name: Master Bath
                layout: horizontal
                icon_color: "{{ 'amber' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.welcome_window_front
                name: Welcome Front
                layout: horizontal
                icon_color: "{{ 'amber' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.welcome_window_left
                name: Welcome L
                layout: horizontal
                icon_color: "{{ 'amber' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.welcome_window_right
                name: Welcome R
                layout: horizontal
                icon_color: "{{ 'amber' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.welcome_window_peep
                name: Peep
                layout: horizontal
                icon_color: "{{ 'amber' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.entertainment_room_window_left
                name: Entertain L
                layout: horizontal
                icon_color: "{{ 'amber' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.entertainment_room_window_right
                name: Entertain R
                layout: horizontal
                icon_color: "{{ 'amber' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border

          - type: custom:mushroom-title-card
            title: Upstairs Perimeter
            subtitle: Bedroom Doors & Window Sensors

          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(4, 1fr)
              grid-gap: 10px
              mediaquery:
                "(max-width: 1000px)":
                  grid-template-columns: repeat(3, 1fr)
                "(max-width: 600px)":
                  grid-template-columns: 1fr 1fr
            cards:
              - type: custom:mushroom-entity-card
                entity: binary_sensor.upper_big_bedroom_door
                name: Big BR Door
                layout: horizontal
                icon_color: "{{ 'red' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.upper_small_bedroom_door
                name: Small BR Door
                layout: horizontal
                icon_color: "{{ 'red' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.upper_guest_bedroom_door
                name: Guest BR Door
                layout: horizontal
                icon_color: "{{ 'red' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.upper_common_bathroom_door
                name: Bathroom
                layout: horizontal
                icon_color: "{{ 'red' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.upper_big_bedroom_window_left
                name: Big BR Win L
                layout: horizontal
                icon_color: "{{ 'amber' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.upper_big_bedroom_window_right
                name: Big BR Win R
                layout: horizontal
                icon_color: "{{ 'amber' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.upper_small_bedroom_window
                name: Small BR Win
                layout: horizontal
                icon_color: "{{ 'amber' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
              - type: custom:mushroom-entity-card
                entity: binary_sensor.upper_guest_bedroom_window
                name: Guest BR Win
                layout: horizontal
                icon_color: "{{ 'amber' if is_state(config.entity, 'on') else 'green' }}"
                card_mod: *card_border
