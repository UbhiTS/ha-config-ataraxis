          # ════════════════════════════════════════════════════════════════════
          #  AGENDA + PRESENCE / GARAGE / QUICK ACTIONS BENTO
          # ════════════════════════════════════════════════════════════════════
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: 1.45fr 1fr
              grid-gap: 14px
              mediaquery:
                "(max-width: 1000px)":
                  grid-template-columns: 1fr
            cards:
              # ── Left: Evening Glass Agenda Calendar ──
              - type: custom:atomic-calendar
                enableModeChange: true
                defaultMode: 2
                entities:
                  - entity: calendar.important_dates
                    type: icon1
                  - entity: calendar.birthdays
                    type: icon2
                  - entity: calendar.holidays_in_united_states
                    type: holiday
                fullDayEventText: 'All Day'
                firstDayOfWeek: 0
                untilText: 'Until'
                showColors: true
                showDate: true
                showNoEventsForToday: true
                maxDaysToShow: 30
                showLocation: false
                showMonth: true
                showCurrentEventLine: false
                dateColor: '#94a3b8'
                dateSize: 90
                timeColor: '#38bdf8'
                timeSize: 90
                titleColor: '#f1f5f9'
                titleSize: 108
                locationIconColor: '#fb7185'
                locationLinkColor: '#94a3b8'
                locationTextSize: 90
                dimFinishedEvents: true
                finishedEventOpacity: 0.55
                finishedEventFilter: 'grayscale(80%)'
                dayWrapperLineColor: 'rgba(148, 163, 184, 0.12)'
                eventBarColor: '#38bdf8'
                showProgressBar: false
                CalEventHolidayColor: '#a78bfa'
                CalEventIcon1Color: '#22d3ee'
                CalEventIcon2Color: '#fb7185'
                CalEventIcon3Color: '#34d399'
                CalEventIcon1: mdi:home-heart
                CalEventIcon2: mdi:gift-outline
                CalEventIcon3: mdi:star-four-points
                card_mod: *card_style

              # ── Right: Who's Home + Garage + Quick Actions ──
              - type: vertical-stack
                cards:
                  - type: custom:layout-card
                    layout_type: custom:grid-layout
                    layout:
                      grid-template-columns: 1fr 1fr
                      grid-gap: 10px
                    cards:
                      - type: custom:mushroom-entity-card
                        entity: device_tracker.funky_monkey_s_iphone
                        icon_color: green
                        layout: horizontal
                        card_mod: *card_style
                      - type: custom:mushroom-entity-card
                        entity: device_tracker.ivavvays_iphone
                        icon_color: green
                        layout: horizontal
                        card_mod: *card_style

                  - type: custom:layout-card
                    layout_type: custom:grid-layout
                    layout:
                      grid-template-columns: 1fr 1fr
                      grid-gap: 10px
                    cards:
                      - type: custom:mushroom-cover-card
                        entity: cover.garage_door_big
                        name: Big Garage
                        icon: mdi:garage
                        show_buttons_control: true
                        show_position_control: false
                        layout: horizontal
                        card_mod: *card_style
                      - type: custom:mushroom-cover-card
                        entity: cover.garage_door_small
                        name: Small Garage
                        icon: mdi:garage-variant
                        show_buttons_control: true
                        show_position_control: false
                        layout: horizontal
                        card_mod: *card_style

                  - type: custom:layout-card
                    layout_type: custom:grid-layout
                    layout:
                      grid-template-columns: repeat(4, 1fr)
                      grid-gap: 10px
                    cards:
                      - type: custom:mushroom-entity-card
                        entity: input_boolean.buzz_home
                        icon: mdi:bullhorn-outline
                        icon_color: amber
                        name: Buzz
                        tap_action:
                          action: toggle
                        icon_tap_action:
                          action: toggle
                        layout: vertical
                        card_mod: *card_style
                      - type: custom:mushroom-entity-card
                        entity: input_boolean.reset_internet
                        icon: mdi:wifi-refresh
                        icon_color: light-blue
                        name: Reset Net
                        tap_action:
                          action: more-info
                        icon_tap_action:
                          action: more-info
                        layout: vertical
                        card_mod: *card_style
                      - type: custom:mushroom-template-card
                        primary: UbhiNAS
                        secondary: "{{ states('sensor.ubhinas_status') | title }}"
                        icon: mdi:nas
                        icon_color: "{{ 'green' if is_state('sensor.ubhinas_status','good') else 'red' }}"
                        layout: vertical
                        tap_action:
                          action: more-info
                          entity: sensor.ubhinas_status
                        card_mod: *card_style
                      - type: custom:mushroom-template-card
                        primary: PlexNAS
                        secondary: "{{ states('sensor.plexnas_status') | title }}"
                        icon: mdi:nas
                        icon_color: "{{ 'green' if is_state('sensor.plexnas_status','good') else 'red' }}"
                        layout: vertical
                        tap_action:
                          action: more-info
                          entity: sensor.plexnas_status
                        card_mod: *card_style

          # ════════════════════════════════════════════════════════════════════
          #  CHARTS ROW — Solar + Home Consumption + Efficiency Gauges
          # ════════════════════════════════════════════════════════════════════
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: 1.2fr 1.2fr 0.9fr
              grid-gap: 14px
              mediaquery:
                "(max-width: 1200px)":
                  grid-template-columns: 1fr 1fr
                "(max-width: 600px)":
                  grid-template-columns: 1fr
            cards:
              - type: energy-solar-graph
                title: Solar Production
                card_mod: *card_style
              - type: energy-usage-graph
                title: Home Consumption
                card_mod: *card_style
              - type: vertical-stack
                cards:
                  - type: energy-grid-neutrality-gauge
                    card_mod: *card_style
                  - type: energy-self-sufficiency-gauge
                    card_mod: *card_style

          # ════════════════════════════════════════════════════════════════════
          #  NETWORK & ISP TELEMETRY — Smooth Bezier Curve + Speedtest Tiles
          # ════════════════════════════════════════════════════════════════════
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: 1.8fr 1fr
              grid-gap: 14px
              mediaquery:
                "(max-width: 850px)":
                  grid-template-columns: 1fr
            cards:
              - type: custom:mini-graph-card
                name: ISP Data Telemetry (72h)
                icon: mdi:wan
                entities:
                  - entity: sensor.xfinity_usage
                    name: Used GB
                    show_state: true
                    show_points: false
                    color: '#38bdf8'
                  - entity: sensor.data_allowance_till_date
                    name: Pace Target
                    show_state: true
                    show_line: true
                    show_points: false
                    color: '#fbbf24'
                  - entity: binary_sensor.sleep_time
                    show_fill: true
                    show_state: false
                    show_line: false
                    show_legend: false
                    show_points: false
                    color: '#0f172a'
                    y_axis: secondary
                cache: false
                hours_to_show: 72
                points_per_hour: 1
                aggregate_func: max
                line_width: 2.5
                smoothing: true
                font_size: 85
                show:
                  legend: true
                  extrema: false
                  labels: false
                  labels_secondary: false
                  fill: fade
                state_map:
                  - value: "off"
                  - value: "on"
                card_mod: *card_style

              - type: custom:layout-card
                layout_type: custom:grid-layout
                layout:
                  grid-template-columns: 1fr 1fr 1fr
                  grid-gap: 10px
                cards:
                  - type: custom:mushroom-template-card
                    primary: "{{ states('sensor.speedtest_ping') | float(0) | round(0) }} ms"
                    secondary: Latency
                    icon: mdi:timer-sand
                    icon_color: |-
                      {% set p = states('sensor.speedtest_ping') | float(0) %}
                      {% if p < 30 %}green{% elif p < 60 %}amber{% else %}red{% endif %}
                    layout: vertical
                    tap_action:
                      action: more-info
                      entity: sensor.speedtest_ping
                    card_mod: &speed_card
                      style: |
                        ha-card {
                          background: linear-gradient(145deg, rgba(41, 50, 72, 0.90) 0%, rgba(30, 37, 54, 0.94) 100%) !important;
                          border-radius: 8px !important;
                          border: 1px solid rgba(255, 255, 255, 0.085) !important;
                          box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.12), 0 10px 24px -6px rgba(9, 13, 22, 0.45) !important;
                        }
                        mushroom-state-info {
                          --card-primary-font-size: 20px;
                          --card-primary-font-weight: 700;
                        }

                  - type: custom:mushroom-template-card
                    primary: "{{ states('sensor.speedtest_download') | float(0) | round(0) }} Mbps"
                    secondary: Downlink
                    icon: mdi:arrow-down-circle-outline
                    icon_color: |-
                      {% set d = states('sensor.speedtest_download') | float(0) %}
                      {% if d > 200 %}cyan{% elif d > 100 %}amber{% else %}red{% endif %}
                    layout: vertical
                    tap_action:
                      action: more-info
                      entity: sensor.speedtest_download
                    card_mod: *speed_card

                  - type: custom:mushroom-template-card
                    primary: "{{ states('sensor.speedtest_upload') | float(0) | round(0) }} Mbps"
                    secondary: Uplink
                    icon: mdi:arrow-up-circle-outline
                    icon_color: |-
                      {% set u = states('sensor.speedtest_upload') | float(0) %}
                      {% if u > 20 %}purple{% elif u > 10 %}amber{% else %}red{% endif %}
                    layout: vertical
                    tap_action:
                      action: more-info
                      entity: sensor.speedtest_upload
                    card_mod: *speed_card
