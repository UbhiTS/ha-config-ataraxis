title: Energy
icon: mdi:solar-power-variant-outline
panel: true
cards:
  - type: vertical-stack
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr
          grid-gap: 14px
          margin: 14px 18px 24px 18px
        cards:

          # ════════════════════════════════════════════════════════════════════
          #  SOLSTICE ENERGY HUD — Solar, Powerwall & Utility Intelligence
          # ════════════════════════════════════════════════════════════════════
          - type: markdown
            content: >-
              <div class="hud-bar">
                <div class="hud-left">
                  <div class="hud-eyebrow">SOLSTICE MICROGRID · TESLA POWERWALL & SOLAR TELEMETRY</div>
                  <div class="hud-title">Energy & Power Flow <span class="hud-divider">·</span> <span class="hud-sub">{{ states('sensor.energy_production_today') }} kWh Generated Today</span></div>
                </div>
                <div class="hud-badges">
                  <span class="hud-pill pill-amber">☀ Solar {{ states('sensor.solar_power') }} kW</span>
                  <span class="hud-pill pill-emerald">⚡ Powerwall {{ states('sensor.powerwall_power_name') }}</span>
                  <span class="hud-pill pill-sky">⌂ Load {{ states('sensor.house_load') }} kW</span>
                  <span class="hud-pill pill-violet">$ Bill {{ states('sensor.current_bill_electric_cost_to_date') | default('--') }}</span>
                </div>
              </div>
            card_mod: &hud_card
              style: |
                ha-card {
                  background: linear-gradient(135deg, rgba(41, 50, 72, 0.92) 0%, rgba(28, 35, 52, 0.96) 100%) !important;
                  border-radius: 8px !important;
                  border: 1px solid rgba(255, 255, 255, 0.09) !important;
                  box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.14), 0 12px 30px -8px rgba(8, 12, 21, 0.5) !important;
                  padding: 4px 10px !important;
                }
                .hud-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
                .hud-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 1.8px; color: #fbbf24; margin-bottom: 2px; }
                .hud-title { font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 700; color: #f8fafc; letter-spacing: -0.3px; }
                .hud-divider { color: rgba(148, 163, 184, 0.45); margin: 0 4px; }
                .hud-sub { font-weight: 500; font-size: 16px; color: #94a3b8; }
                .hud-badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
                .hud-pill { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12.5px; font-weight: 600; padding: 6px 14px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.08); }
                .pill-amber { background: rgba(251, 191, 36, 0.14); color: #fde68a; border-color: rgba(251, 191, 36, 0.3); }
                .pill-emerald { background: rgba(52, 211, 153, 0.14); color: #6ee7b7; border-color: rgba(52, 211, 153, 0.3); }
                .pill-sky { background: rgba(56, 189, 248, 0.14); color: #bae6fd; border-color: rgba(56, 189, 248, 0.3); }
                .pill-violet { background: rgba(167, 139, 250, 0.14); color: #ddd6fe; border-color: rgba(167, 139, 250, 0.3); }

          # ── Live Power & Billing Chips ──
          - type: custom:mushroom-chips-card
            alignment: center
            card_mod:
              style: |
                mushroom-chip {
                  --chip-background: rgba(36, 45, 66, 0.82) !important;
                  --chip-border-radius: 6px !important;
                  border: 1px solid rgba(255,255,255,0.07) !important;
                }
            chips:
              - type: template
                icon: mdi:solar-power-variant
                icon_color: amber
                content: "Solar {{ states('sensor.solar_power') }} kW"
              - type: template
                icon: mdi:transmission-tower
                icon_color: light-blue
                content: "Grid {{ states('sensor.grid_power') }} kW"
              - type: template
                icon: mdi:battery-heart-variant
                icon_color: >-
                  {% set pct = states('sensor.home_energy_gateway_charge') | float(0) %}
                  {% if pct > 50 %}green{% elif pct > 20 %}amber{% else %}red{% endif %}
                content: "Battery {{ states('sensor.powerwall_power_name') }}"
              - type: template
                icon: mdi:home-lightning-bolt-outline
                icon_color: red
                content: "Load {{ states('sensor.house_load') }} kW"
              - type: template
                icon: mdi:currency-usd
                icon_color: green
                content: >-
                  Bill ${{ states('sensor.current_bill_electric_cost_to_date') | default('--') }}
              - type: template
                icon: mdi:chart-timeline-variant
                icon_color: purple
                content: >-
                  Forecast ${{ states('sensor.current_bill_electric_forecasted_cost') | default('--') }}

          # ════════════════════════════════════════════════════════════════════
          #  HERO ROW — Energy Distribution + Live Power Bars + Gauges
          # ════════════════════════════════════════════════════════════════════
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: 1.15fr 1fr
              grid-gap: 14px
              mediaquery:
                "(max-width: 900px)":
                  grid-template-columns: 1fr
            cards:
              - type: vertical-stack
                cards:
                  - type: energy-date-selection
                    card_mod: &energy_card
                      style: |
                        ha-card {
                          background: linear-gradient(145deg, rgba(41, 50, 72, 0.90) 0%, rgba(30, 37, 54, 0.94) 100%) !important;
                          border-radius: 8px !important;
                          border: 1px solid rgba(255, 255, 255, 0.085) !important;
                          box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.12), 0 12px 28px -8px rgba(9, 13, 22, 0.45) !important;
                        }
                  - type: energy-distribution
                    card_mod: *energy_card

              - type: vertical-stack
                cards:
                  - type: "custom:config-template-card"
                    entities:
                      - sensor.solar_power
                      - sensor.grid_power
                      - sensor.grid_power_target
                      - sensor.powerwall_power
                      - sensor.powerwall_power_target
                      - sensor.powerwall_power_name
                      - sensor.house_load
                    card:
                      type: custom:bar-card
                      columns: 4
                      height: 145px
                      width: 92%
                      decimal: 1
                      direction: up
                      positions:
                        icon: inside
                        name: 'off'
                        value: outside
                        indicator: 'off'
                      animation:
                        state: 'on'
                        speed: 5
                      card_mod:
                        style: |
                          ha-card {
                            background: linear-gradient(145deg, rgba(41, 50, 72, 0.90) 0%, rgba(30, 37, 54, 0.94) 100%) !important;
                            border-radius: 8px !important;
                            border: 1px solid rgba(255, 255, 255, 0.085) !important;
                            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.12), 0 12px 28px -8px rgba(9, 13, 22, 0.45) !important;
                            padding: 12px 8px !important;
                          }
                          bar-card-backgroundbar { border-radius: 6px !important; background: rgba(15, 23, 42, 0.45) !important; }
                          bar-card-currentbar, bar-card-targetbar { border-radius: 6px !important; }
                      entities:
                        - entity: sensor.solar_power
                          name: "Solar"
                          target: "${states['sensor.solar_power'].state}"
                          min: 0
                          max: 8
                          icon: mdi:solar-power-variant
                          severity:
                            - color: '#fbbf24'
                              from: 0
                              to: 8
                        - entity: sensor.grid_power
                          name: "Grid"
                          target: "${states['sensor.grid_power_target'].state}"
                          min: 0
                          max: 8
                          icon: mdi:transmission-tower
                          severity:
                            - color: '#38bdf8'
                              from: 0
                              to: 8
                        - entity: sensor.powerwall_power
                          name: "${states['sensor.powerwall_power_name'].state}"
                          target: "${states['sensor.powerwall_power_target'].state}"
                          min: 0
                          max: 8
                          icon: mdi:battery-charging
                          severity:
                            - color: '#34d399'
                              from: 0
                              to: 8
                          positions:
                            name: inside
                        - entity: sensor.house_load
                          name: "Load"
                          target: "${states['sensor.house_load'].state}"
                          min: 0
                          max: 8
                          icon: mdi:home-lightning-bolt
                          severity:
                            - color: '#fb7185'
                              from: 0
                              to: 8

                  - type: horizontal-stack
                    cards:
                      - type: energy-grid-neutrality-gauge
                        card_mod: *energy_card
                      - type: energy-self-sufficiency-gauge
                        card_mod: *energy_card

          # ════════════════════════════════════════════════════════════════════
          #  PRODUCTION & CONSUMPTION GRAPHS
          # ════════════════════════════════════════════════════════════════════
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: 1fr 1fr
              grid-gap: 14px
              mediaquery:
                "(max-width: 850px)":
                  grid-template-columns: 1fr
            cards:
              - type: energy-solar-graph
                title: Solar Production
                card_mod: *energy_card
              - type: energy-usage-graph
                title: Home Consumption
                card_mod: *energy_card

          # ════════════════════════════════════════════════════════════════════
          #  SOLAR FORECAST — Today, Tomorrow & Peak Production Window
          # ════════════════════════════════════════════════════════════════════
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: 1fr 1fr 1fr
              grid-gap: 14px
              mediaquery:
                "(max-width: 800px)":
                  grid-template-columns: 1fr
            cards:
              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.energy_production_today') }} kWh"
                secondary: Solar Production Today
                icon: mdi:solar-power-variant
                icon_color: amber
                layout: horizontal
                card_mod: &forecast_card
                  style: |
                    ha-card {
                      background: radial-gradient(circle at 0% 50%, rgba(251, 191, 36, 0.14), rgba(31, 38, 56, 0.86) 75%) !important;
                      border-radius: 8px !important;
                      border: 1px solid rgba(251, 191, 36, 0.22) !important;
                      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.12), 0 12px 28px -8px rgba(9, 13, 22, 0.45) !important;
                    }
                    mushroom-state-info {
                      --card-primary-font-size: 20px;
                      --card-primary-font-weight: 700;
                    }

              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.energy_production_tomorrow') }} kWh"
                secondary: Solar Forecast Tomorrow
                icon: mdi:weather-sunset-up
                icon_color: orange
                layout: horizontal
                card_mod: *forecast_card

              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.power_highest_peak_time_today') }}"
                secondary: Peak Production Window
                icon: mdi:clock-Check-outline
                icon_color: yellow
                layout: horizontal
                card_mod: *forecast_card

          # ════════════════════════════════════════════════════════════════════
          #  UTILITY BILLING — Electric & Gas Telemetry
          # ════════════════════════════════════════════════════════════════════
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(4, 1fr)
              grid-gap: 14px
              mediaquery:
                "(max-width: 1000px)":
                  grid-template-columns: 1fr 1fr
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.current_bill_electric_usage_to_date
                name: Electric Usage
                icon: mdi:flash
                icon_color: amber
                layout: horizontal
                card_mod: *energy_card

              - type: custom:mushroom-entity-card
                entity: sensor.current_bill_electric_forecasted_usage
                name: Electric Forecast
                icon: mdi:flash-outline
                icon_color: orange
                layout: horizontal
                card_mod: *energy_card

              - type: custom:mushroom-entity-card
                entity: sensor.current_bill_gas_usage_to_date
                name: Gas Usage
                icon: mdi:fire
                icon_color: red
                layout: horizontal
                card_mod: *energy_card

              - type: custom:mushroom-entity-card
                entity: sensor.current_bill_gas_forecasted_usage
                name: Gas Forecast
                icon: mdi:fire-circle
                icon_color: deep-orange
                layout: horizontal
                card_mod: *energy_card

          # ════════════════════════════════════════════════════════════════════
          #  GRAFANA — Deep Energy Profile Viewport
          # ════════════════════════════════════════════════════════════════════
          - type: iframe
            url: https://grafana.ubhits.com/d/fe75d2wuk7hfka/energy-profile?orgId=1&timezone=browser&kiosk
            aspect_ratio: 55%
            card_mod:
              style: |
                ha-card {
                  background: rgba(25, 31, 46, 0.88) !important;
                  border-radius: 8px !important;
                  border: 1px solid rgba(255, 255, 255, 0.09) !important;
                  box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.12), 0 16px 36px -10px rgba(8, 12, 21, 0.5) !important;
                  overflow: hidden;
                }
