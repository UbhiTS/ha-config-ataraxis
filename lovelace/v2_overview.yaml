title: Overview
path: overview
icon: mdi:view-dashboard-outline
type: custom:grid-layout
layout:
  grid-template-columns: 1fr
  grid-gap: 10px
  margin: 8px 12px 16px 12px
  mediaquery:
    "(max-width: 640px)":
      grid-gap: 8px
      margin: 6px 8px 14px 8px
cards:
  # ════════════════════════════════════════════════════════════════════════════
  #  COMPACT STATUS & QUICK ACTION BAR
  # ════════════════════════════════════════════════════════════════════════════
  - type: custom:mushroom-chips-card
    alignment: justify
    chips:
      - type: template
        entity: sensor.solar_power
        icon: mdi:solar-power-variant
        icon_color: amber
        content: "Solar {{ states('sensor.solar_power') | float(0) | round(1) }} kW"
        tap_action:
          action: navigate
          navigation_path: /lovelace/energy
      - type: template
        entity: sensor.powerwall_charge
        icon: mdi:battery-high
        icon_color: >-
          {% set soc = states('sensor.powerwall_charge') | float(0) %}
          {{ 'green' if soc >= 50 else ('amber' if soc >= 20 else 'red') }}
        content: "PW {{ states('sensor.powerwall_charge') | float(0) | round(0) }}%"
        tap_action:
          action: navigate
          navigation_path: /lovelace/energy
      - type: template
        entity: sensor.house_load
        icon: mdi:home-lightning-bolt-outline
        icon_color: cyan
        content: "Load {{ states('sensor.house_load') | float(0) | round(1) }} kW"
        tap_action:
          action: navigate
          navigation_path: /lovelace/energy
      - type: template
        entity: cover.garage_door_small
        icon: >-
          {% set g_open = ['cover.garage_door_small', 'cover.garage_door_big'] | select('is_state', 'open') | list | count %}
          {% set d_open = ['binary_sensor.main_door', 'binary_sensor.backyard_left_door', 'binary_sensor.upper_big_bedroom_door', 'binary_sensor.upper_small_bedroom_door', 'binary_sensor.upper_guest_bedroom_door', 'binary_sensor.lower_common_bathroom_door'] | select('is_state', 'on') | list | count %}
          {{ 'mdi:shield-alert' if (g_open + d_open) > 0 else 'mdi:shield-check' }}
        icon_color: >-
          {% set g_open = ['cover.garage_door_small', 'cover.garage_door_big'] | select('is_state', 'open') | list | count %}
          {% set d_open = ['binary_sensor.main_door', 'binary_sensor.backyard_left_door', 'binary_sensor.upper_big_bedroom_door', 'binary_sensor.upper_small_bedroom_door', 'binary_sensor.upper_guest_bedroom_door', 'binary_sensor.lower_common_bathroom_door'] | select('is_state', 'on') | list | count %}
          {{ 'red' if g_open > 0 else ('amber' if d_open > 0 else 'green') }}
        content: >-
          {% set g_open = ['cover.garage_door_small', 'cover.garage_door_big'] | select('is_state', 'open') | list | count %}
          {% set d_open = ['binary_sensor.main_door', 'binary_sensor.backyard_left_door', 'binary_sensor.upper_big_bedroom_door', 'binary_sensor.upper_small_bedroom_door', 'binary_sensor.upper_guest_bedroom_door', 'binary_sensor.lower_common_bathroom_door'] | select('is_state', 'on') | list | count %}
          {% set w_open = ['binary_sensor.living_room_window_left', 'binary_sensor.living_room_window_right', 'binary_sensor.kitchen_window_left', 'binary_sensor.kitchen_window_right', 'binary_sensor.welcome_window_front', 'binary_sensor.welcome_window_left', 'binary_sensor.welcome_window_right', 'binary_sensor.entryway_window_peep', 'binary_sensor.master_bedroom_window_left', 'binary_sensor.master_bedroom_window_right', 'binary_sensor.master_bedroom_window_left_small', 'binary_sensor.master_bedroom_window_right_small', 'binary_sensor.upper_big_bedroom_window_left', 'binary_sensor.upper_big_bedroom_window_right', 'binary_sensor.upper_small_bedroom_window', 'binary_sensor.upper_guest_bedroom_window', 'binary_sensor.lower_guest_bedroom_window', 'binary_sensor.entertainment_window_left', 'binary_sensor.entertainment_window_right'] | select('is_state', 'on') | list | count %}
          {% if (g_open + d_open + w_open) == 0 %}Secure{% else %}{{ g_open }}G · {{ d_open }}D · {{ w_open }}W Open{% endif %}
        tap_action:
          action: navigate
          navigation_path: /lovelace/security
      - type: weather
        entity: weather.home
        show_temperature: true
        show_conditions: true
      - type: template
        icon: mdi:shield-moon-outline
        icon_color: indigo
        content: "Goodnight Lockdown"
        tap_action:
          action: call-service
          service: script.goodnight_lockdown

  # ════════════════════════════════════════════════════════════════════════════
  #  ROW 1 — 3-COLUMN COMMAND CENTER (GARAGES/SCENES · ENERGY · WEATHER/LIGHTS)
  # ════════════════════════════════════════════════════════════════════════════
  - type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(3, minmax(0, 1fr))
      grid-gap: 10px
      margin: 0
      mediaquery:
        "(max-width: 1150px)":
          grid-template-columns: repeat(2, minmax(0, 1fr))
        "(max-width: 720px)":
          grid-template-columns: 1fr
    cards:
      # ── COLUMN 1: GARAGE BAYS & QUICK SCENES ──
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Garages & Quick Scenes
            subtitle: 1-tap bay access & house modes
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(2, minmax(0, 1fr))
              grid-gap: 8px
              margin: 0
            cards:
              - type: custom:mushroom-template-card
                entity: cover.garage_door_small
                primary: Moto Bay (Small)
                secondary: >-
                  {{ states('cover.garage_door_small') | title }} · Tap to Toggle
                icon: >-
                  {{ 'mdi:garage-open' if is_state('cover.garage_door_small', 'open') else 'mdi:motorbike' }}
                icon_color: >-
                  {{ 'red' if is_state('cover.garage_door_small', 'open') else ('amber' if states('cover.garage_door_small') in ['opening', 'closing'] else 'green') }}
                tap_action:
                  action: call-service
                  service: script.moto_garage_bay
                hold_action:
                  action: more-info

              - type: custom:mushroom-template-card
                entity: cover.garage_door_big
                primary: Big Garage Door
                secondary: >-
                  {{ states('cover.garage_door_big') | title }} · Tap to Toggle
                icon: >-
                  {{ 'mdi:garage-open-variant' if is_state('cover.garage_door_big', 'open') else 'mdi:garage-variant' }}
                icon_color: >-
                  {{ 'red' if is_state('cover.garage_door_big', 'open') else ('amber' if states('cover.garage_door_big') in ['opening', 'closing'] else 'green') }}
                tap_action:
                  action: call-service
                  service: cover.toggle
                  target:
                    entity_id: cover.garage_door_big
                hold_action:
                  action: more-info

              - type: custom:mushroom-template-card
                entity: binary_sensor.main_door
                primary: Front Entry Door
                secondary: >-
                  {{ 'OPEN' if is_state('binary_sensor.main_door', 'on') else 'Closed' }} · Motion {{ 'Active' if is_state('binary_sensor.main_door_motion', 'on') else 'Clear' }}
                icon: >-
                  {{ 'mdi:door-open' if is_state('binary_sensor.main_door', 'on') else 'mdi:door-closed-lock' }}
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.main_door', 'on') else 'green' }}
                tap_action:
                  action: more-info

              - type: custom:mushroom-template-card
                entity: script.close_all_garages
                primary: Close Both Bays
                secondary: Immediate Garage Lockdown
                icon: mdi:garage-lock
                icon_color: cyan
                tap_action:
                  action: call-service
                  service: script.close_all_garages

              - type: custom:mushroom-template-card
                entity: script.scene_daylight_work
                primary: Daylight Mode
                secondary: Work & main floor lights
                icon: mdi:white-balance-sunny
                icon_color: amber
                tap_action:
                  action: call-service
                  service: script.scene_daylight_work

              - type: custom:mushroom-template-card
                entity: script.scene_evening_relax
                primary: Evening Relax
                secondary: Warm lounge & patio
                icon: mdi:weather-sunset
                icon_color: orange
                tap_action:
                  action: call-service
                  service: script.scene_evening_relax

              - type: custom:mushroom-template-card
                entity: script.lights_all_off
                primary: All Lights Off
                secondary: Shut off interior & yard
                icon: mdi:lightbulb-Group-off
                icon_color: blue
                tap_action:
                  action: call-service
                  service: script.lights_all_off

              - type: custom:mushroom-template-card
                entity: script.goodnight_lockdown
                primary: Goodnight
                secondary: Garages + Lights + Sleep 67°
                icon: mdi:shield-moon-outline
                icon_color: indigo
                tap_action:
                  action: call-service
                  service: script.goodnight_lockdown

      # ── COLUMN 2: SOLAR, POWERWALL & HOME LOAD ──
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Energy & Powerwall
            subtitle: Real-time microgrid telemetry
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(2, minmax(0, 1fr))
              grid-gap: 8px
              margin: 0
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.solar_power
                name: Solar Generation
                icon: mdi:solar-power-variant
                icon_color: amber
              - type: custom:mushroom-entity-card
                entity: sensor.house_load
                name: Home Load
                icon: mdi:home-lightning-bolt-outline
                icon_color: cyan
              - type: custom:mushroom-template-card
                entity: sensor.powerwall_charge
                primary: Powerwall Battery
                secondary: >-
                  {{ states('sensor.powerwall_charge') | float(0) | round(0) }}% · {{ states('sensor.powerwall_power') | float(0) | round(2) }} kW
                icon: mdi:battery-charging-80
                icon_color: green
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/energy
              - type: custom:mushroom-template-card
                entity: sensor.grid_power
                primary: Utility Grid
                secondary: >-
                  {{ states('sensor.grid_power') | float(0) | round(2) }} kW · {{ states('binary_sensor.grid_status') | title }}
                icon: mdi:transmission-tower
                icon_color: >-
                  {{ 'green' if is_state('binary_sensor.grid_status', 'on') else 'red' }}
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/energy
          - type: energy-distribution
            link_dashboard: true

      # ── COLUMN 3: WEATHER & PRIMARY LIGHTING ──
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Weather & Quick Lights
            subtitle: Forecast & frequent switches
          - type: weather-forecast
            entity: weather.home
            show_current: true
            show_forecast: true
            forecast_type: daily
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(2, minmax(0, 1fr))
              grid-gap: 8px
              margin: 0
            cards:
              - type: custom:mushroom-light-card
                entity: light.living_room_light
                name: Living Room
                show_brightness_control: false
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: switch.kitchen_light
                name: Kitchen Light
                icon: mdi:countertop-outline
                icon_color: amber
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: switch.welcome_room_light
                name: Welcome Room
                icon: mdi:sofa-single-outline
                icon_color: amber
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: switch.backyard_patio_lights
                name: Patio Lights
                icon: mdi:outdoor-lamp
                icon_color: orange
                tap_action:
                  action: toggle

  # ════════════════════════════════════════════════════════════════════════════
  #  ROW 2 — 7-ZONE CLIMATE MATRIX (RESPONSIVE 4-COL LAPTOP / 2-COL PHONE)
  # ════════════════════════════════════════════════════════════════════════════
  - type: vertical-stack
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr auto
          align-items: center
          grid-gap: 8px
          margin: 0
          mediaquery:
            "(max-width: 720px)":
              grid-template-columns: 1fr
        cards:
          - type: custom:mushroom-title-card
            title: Whole-Home Climate (7 Zones)
            subtitle: Tap any zone for controls or use whole-home presets
          - type: custom:mushroom-chips-card
            alignment: end
            chips:
              - type: template
                icon: mdi:thermostat-auto
                icon_color: green
                content: "All Auto"
                tap_action:
                  action: call-service
                  service: script.climate_all_zones_preset
                  data:
                    preset_mode: auto
                    target_temp: 73
              - type: template
                icon: mdi:snowflake
                icon_color: blue
                content: "All Cool 72°"
                tap_action:
                  action: call-service
                  service: script.climate_all_zones_preset
                  data:
                    preset_mode: cool
                    target_temp: 72
              - type: template
                icon: mdi:fire
                icon_color: orange
                content: "All Heat 69°"
                tap_action:
                  action: call-service
                  service: script.climate_all_zones_preset
                  data:
                    preset_mode: heat
                    target_temp: 69
              - type: template
                icon: mdi:power-standby
                icon_color: grey
                content: "All Off"
                tap_action:
                  action: call-service
                  service: script.climate_all_zones_preset
                  data:
                    preset_mode: "off"

      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: repeat(4, minmax(0, 1fr))
          grid-gap: 8px
          margin: 0
          mediaquery:
            "(max-width: 1100px)":
              grid-template-columns: repeat(3, minmax(0, 1fr))
            "(max-width: 768px)":
              grid-template-columns: repeat(2, minmax(0, 1fr))
            "(max-width: 400px)":
              grid-template-columns: 1fr
        cards:
          # 1. Living Room
          - type: custom:mushroom-template-card
            entity: climate.thermostat_living_room
            primary: Living Room
            secondary: >-
              {% set t = states('sensor.thermostat_living_room_temperature') | float(state_attr('climate.thermostat_living_room', 'current_temperature') | float(0)) | round(0) %}
              {% set h = states('sensor.thermostat_living_room_humidity') | float(0) | round(0) %}
              {% set m = states('input_select.thermostat_living_room_mode') | lower %}
              {% set lo = states('input_number.thermostat_living_room_heat_setpoint') | float(68) | round(0) %}
              {% set hi = states('input_number.thermostat_living_room_setpoint') | float(73) | round(0) %}
              {{ t }}°F · {{ h }}% · {% if m == 'auto' %}Auto {{ lo }}°–{{ hi }}°{% elif m == 'heat' %}Heat {{ lo }}°{% elif m == 'cool' %}Cool {{ hi }}°{% else %}Off{% endif %}
            icon: mdi:sofa-outline
            icon_color: >-
              {% set m = states('input_select.thermostat_living_room_mode') | lower %}
              {{ 'blue' if m == 'cool' else ('orange' if m == 'heat' else ('green' if m == 'auto' else 'disabled')) }}
            tap_action:
              action: navigate
              navigation_path: /lovelace/climate
            hold_action:
              action: more-info

          # 2. Master Suite
          - type: custom:mushroom-template-card
            entity: climate.thermostat_master_bedroom
            primary: Master Suite
            secondary: >-
              {% set t = states('sensor.thermostat_master_bedroom_temperature') | float(state_attr('climate.thermostat_master_bedroom', 'current_temperature') | float(0)) | round(0) %}
              {% set h = states('sensor.thermostat_master_bedroom_humidity') | float(0) | round(0) %}
              {% set m = states('input_select.thermostat_master_bedroom_mode') | lower %}
              {% set lo = states('input_number.thermostat_master_bedroom_heat_setpoint') | float(68) | round(0) %}
              {% set hi = states('input_number.thermostat_master_bedroom_setpoint') | float(73) | round(0) %}
              {{ t }}°F · {{ h }}% · {% if m == 'auto' %}Auto {{ lo }}°–{{ hi }}°{% elif m == 'heat' %}Heat {{ lo }}°{% elif m == 'cool' %}Cool {{ hi }}°{% else %}Off{% endif %}
            icon: mdi:bed-king-outline
            icon_color: >-
              {% set m = states('input_select.thermostat_master_bedroom_mode') | lower %}
              {{ 'blue' if m == 'cool' else ('orange' if m == 'heat' else ('green' if m == 'auto' else 'disabled')) }}
            tap_action:
              action: navigate
              navigation_path: /lovelace/climate
            hold_action:
              action: more-info

          # 3. Upper Big Bedroom
          - type: custom:mushroom-template-card
            entity: climate.thermostat_upper_big_bedroom
            primary: Upper Big Bed
            secondary: >-
              {% set t = states('sensor.thermostat_upper_big_bedroom_temperature') | float(state_attr('climate.thermostat_upper_big_bedroom', 'current_temperature') | float(0)) | round(0) %}
              {% set h = states('sensor.thermostat_upper_big_bedroom_humidity') | float(0) | round(0) %}
              {% set m = states('input_select.thermostat_upper_big_bedroom_mode') | lower %}
              {% set lo = states('input_number.thermostat_upper_big_bedroom_heat_setpoint') | float(68) | round(0) %}
              {% set hi = states('input_number.thermostat_upper_big_bedroom_setpoint') | float(73) | round(0) %}
              {{ t }}°F · {{ h }}% · {% if m == 'auto' %}Auto {{ lo }}°–{{ hi }}°{% elif m == 'heat' %}Heat {{ lo }}°{% elif m == 'cool' %}Cool {{ hi }}°{% else %}Off{% endif %}
            icon: mdi:bed-double-outline
            icon_color: >-
              {% set m = states('input_select.thermostat_upper_big_bedroom_mode') | lower %}
              {{ 'blue' if m == 'cool' else ('orange' if m == 'heat' else ('green' if m == 'auto' else 'disabled')) }}
            tap_action:
              action: navigate
              navigation_path: /lovelace/climate
            hold_action:
              action: more-info

          # 4. Upper Small Bedroom
          - type: custom:mushroom-template-card
            entity: climate.thermostat_upper_small_bedroom
            primary: Upper Small Bed
            secondary: >-
              {% set t = states('sensor.thermostat_upper_small_bedroom_temperature') | float(state_attr('climate.thermostat_upper_small_bedroom', 'current_temperature') | float(0)) | round(0) %}
              {% set h = states('sensor.thermostat_upper_small_bedroom_humidity') | float(0) | round(0) %}
              {% set m = states('input_select.thermostat_upper_small_bedroom_mode') | lower %}
              {% set lo = states('input_number.thermostat_upper_small_bedroom_heat_setpoint') | float(68) | round(0) %}
              {% set hi = states('input_number.thermostat_upper_small_bedroom_setpoint') | float(73) | round(0) %}
              {{ t }}°F · {{ h }}% · {% if m == 'auto' %}Auto {{ lo }}°–{{ hi }}°{% elif m == 'heat' %}Heat {{ lo }}°{% elif m == 'cool' %}Cool {{ hi }}°{% else %}Off{% endif %}
            icon: mdi:bed-single-outline
            icon_color: >-
              {% set m = states('input_select.thermostat_upper_small_bedroom_mode') | lower %}
              {{ 'blue' if m == 'cool' else ('orange' if m == 'heat' else ('green' if m == 'auto' else 'disabled')) }}
            tap_action:
              action: navigate
              navigation_path: /lovelace/climate
            hold_action:
              action: more-info

          # 5. Upper Guest Bedroom
          - type: custom:mushroom-template-card
            entity: climate.thermostat_upper_guest_bedroom
            primary: Upper Guest Bed
            secondary: >-
              {% set t = states('sensor.thermostat_upper_guest_bedroom_temperature') | float(state_attr('climate.thermostat_upper_guest_bedroom', 'current_temperature') | float(0)) | round(0) %}
              {% set h = states('sensor.thermostat_upper_guest_bedroom_humidity') | float(0) | round(0) %}
              {% set m = states('input_select.thermostat_upper_guest_bedroom_mode') | lower %}
              {% set lo = states('input_number.thermostat_upper_guest_bedroom_heat_setpoint') | float(68) | round(0) %}
              {% set hi = states('input_number.thermostat_upper_guest_bedroom_setpoint') | float(73) | round(0) %}
              {{ t }}°F · {{ h }}% · {% if m == 'auto' %}Auto {{ lo }}°–{{ hi }}°{% elif m == 'heat' %}Heat {{ lo }}°{% elif m == 'cool' %}Cool {{ hi }}°{% else %}Off{% endif %}
            icon: mdi:bed-queen-outline
            icon_color: >-
              {% set m = states('input_select.thermostat_upper_guest_bedroom_mode') | lower %}
              {{ 'blue' if m == 'cool' else ('orange' if m == 'heat' else ('green' if m == 'auto' else 'disabled')) }}
            tap_action:
              action: navigate
              navigation_path: /lovelace/climate
            hold_action:
              action: more-info

          # 6. Entertainment Room (Lower Floor)
          - type: custom:mushroom-template-card
            entity: climate.thermostat_entertainment_room
            primary: Entertainment Rm
            secondary: >-
              {% set t = states('sensor.thermostat_entertainment_room_temperature') | float(state_attr('climate.thermostat_entertainment_room', 'current_temperature') | float(0)) | round(0) %}
              {% set h = states('sensor.thermostat_entertainment_room_humidity') | float(0) | round(0) %}
              {% set m = states('input_select.thermostat_entertainment_room_mode') | lower %}
              {% set lo = states('input_number.thermostat_entertainment_room_heat_setpoint') | float(68) | round(0) %}
              {% set hi = states('input_number.thermostat_entertainment_room_setpoint') | float(73) | round(0) %}
              {{ t }}°F · {{ h }}% · {% if m == 'auto' %}Auto {{ lo }}°–{{ hi }}°{% elif m == 'heat' %}Heat {{ lo }}°{% elif m == 'cool' %}Cool {{ hi }}°{% else %}Off{% endif %}
            icon: mdi:television-ambient-light
            icon_color: >-
              {% set m = states('input_select.thermostat_entertainment_room_mode') | lower %}
              {{ 'blue' if m == 'cool' else ('orange' if m == 'heat' else ('green' if m == 'auto' else 'disabled')) }}
            tap_action:
              action: navigate
              navigation_path: /lovelace/climate
            hold_action:
              action: more-info

          # 7. Attic Zone
          - type: custom:mushroom-template-card
            entity: climate.thermostat_attic
            primary: Attic Zone
            secondary: >-
              {% set t = state_attr('climate.thermostat_attic', 'current_temperature') | float(0) | round(0) %}
              {% set h = states('sensor.thermostat_attic_humidity') | float(0) | round(0) %}
              {% set m = states('input_select.thermostat_attic_mode') | lower %}
              {% set lo = states('input_number.thermostat_attic_heat_setpoint') | float(68) | round(0) %}
              {% set hi = states('input_number.thermostat_attic_setpoint') | float(74) | round(0) %}
              {{ t }}°F · {{ h }}% · {% if m == 'auto' %}Auto {{ lo }}°–{{ hi }}°{% elif m == 'heat' %}Heat {{ lo }}°{% elif m == 'cool' %}Cool {{ hi }}°{% else %}Off{% endif %}
            icon: mdi:home-roof
            icon_color: >-
              {% set m = states('input_select.thermostat_attic_mode') | lower %}
              {{ 'blue' if m == 'cool' else ('orange' if m == 'heat' else ('green' if m == 'auto' else 'disabled')) }}
            tap_action:
              action: navigate
              navigation_path: /lovelace/climate
            hold_action:
              action: more-info

          # 8. Open Interactive Climate Sliders
          - type: custom:mushroom-template-card
            primary: All Zone Sliders
            secondary: Open full 7-zone range bars
            icon: mdi:tune-variant
            icon_color: cyan
            tap_action:
              action: navigate
              navigation_path: /lovelace/climate

  # ════════════════════════════════════════════════════════════════════════════
  #  ROW 3 — PRIMARY PERIMETER CAMERAS (4-COL LAPTOP / 2-COL MOBILE)
  # ════════════════════════════════════════════════════════════════════════════
  - type: vertical-stack
    cards:
      - type: custom:mushroom-title-card
        title: Primary Perimeter Cameras
        subtitle: Snapshot view for fast loading — tap any feed for live HD stream
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: repeat(4, minmax(0, 1fr))
          grid-gap: 10px
          margin: 0
          mediaquery:
            "(max-width: 1100px)":
              grid-template-columns: repeat(2, minmax(0, 1fr))
            "(max-width: 520px)":
              grid-template-columns: 1fr
        cards:
          - type: picture-glance
            title: Driveway
            camera_image: camera.driveway_high
            camera_view: auto
            aspect_ratio: "16:9"
            entities:
              - entity: cover.garage_door_big
              - entity: cover.garage_door_small

          - type: picture-glance
            title: Front Door
            camera_image: camera.front_door_high
            camera_view: auto
            aspect_ratio: "16:9"
            entities:
              - entity: binary_sensor.main_door
              - entity: binary_sensor.main_door_motion
              - entity: switch.entryway_light

          - type: picture-glance
            title: Backyard
            camera_image: camera.backyard_high
            camera_view: auto
            aspect_ratio: "16:9"
            entities:
              - entity: binary_sensor.backyard_left_door
              - entity: switch.backyard_patio_lights

          - type: picture-glance
            title: Side Yard
            camera_image: camera.side_yard_high
            camera_view: auto
            aspect_ratio: "16:9"
            entities:
              - entity: switch.side_deck_light
