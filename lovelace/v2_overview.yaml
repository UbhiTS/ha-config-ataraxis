title: Overview
icon: mdi:view-dashboard-variant-outline
panel: true
cards:
  - type: vertical-stack
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr
          grid-gap: 14px
          margin: 14px 18px 24px 18px
        cards:

          # ════════════════════════════════════════════════════════════════════
          #  SOLSTICE EVENING COMMAND DECK — Hero Glass HUD
          # ════════════════════════════════════════════════════════════════════
          - type: markdown
            content: >-
              {% set h = now().hour %}
              {% set greet = 'Good Morning' if h < 12 else ('Good Afternoon' if h < 17 else 'Good Evening') %}
              {% set temps = [
                state_attr('climate.thermostat_living_room','current_temperature') | float(0),
                state_attr('climate.thermostat_master_bedroom','current_temperature') | float(0),
                state_attr('climate.thermostat_entertainment_room','current_temperature') | float(0),
                state_attr('climate.thermostat_upper_big_bedroom','current_temperature') | float(0),
                state_attr('climate.thermostat_upper_small_bedroom','current_temperature') | float(0),
                state_attr('climate.thermostat_upper_guest_bedroom','current_temperature') | float(0)
              ] | reject('eq', 0) | list %}
              {% set avg_t = (temps | sum / temps | count) | round(0) if temps | count > 0 else '--' %}
              {% set doors = expand(["binary_sensor.main_door","binary_sensor.welcome_laundry_door","binary_sensor.garage_laundry_door","binary_sensor.kitchen_door","binary_sensor.master_bedroom_door","binary_sensor.upper_big_bedroom_door","binary_sensor.upper_small_bedroom_door","binary_sensor.upper_guest_bedroom_door","binary_sensor.upper_common_bathroom_door","binary_sensor.lower_common_bathroom_door"]) | selectattr("state","eq","on") | list | count %}
              {% set wins = expand(["binary_sensor.welcome_window_left","binary_sensor.welcome_window_right","binary_sensor.welcome_window_front","binary_sensor.welcome_window_peep","binary_sensor.living_room_window_left","binary_sensor.living_room_window_right","binary_sensor.kitchen_window_left","binary_sensor.kitchen_window_right","binary_sensor.entertainment_room_window_left","binary_sensor.entertainment_room_window_right","binary_sensor.master_bedroom_window_left","binary_sensor.master_bedroom_window_right","binary_sensor.master_bedroom_window_left_small","binary_sensor.master_bedroom_window_right_small","binary_sensor.master_bathroom_window","binary_sensor.upper_big_bedroom_window_left","binary_sensor.upper_big_bedroom_window_right","binary_sensor.upper_small_bedroom_window","binary_sensor.upper_guest_bedroom_window"]) | selectattr("state","eq","on") | list | count %}
              {% set garage = expand(["cover.garage_door_small","cover.garage_door_big"]) | selectattr("state","eq","open") | list | count %}
              {% set total_open = doors + wins + garage %}
              <div class="hud-bar">
                <div class="hud-left">
                  <div class="hud-eyebrow">SOLSTICE COMMAND DECK · EVENING ATMOSPHERE</div>
                  <div class="hud-title">{{ greet }} <span class="hud-divider">·</span> <span class="hud-sub">Indoor Avg {{ avg_t }}°F · {{ states('weather.openweathermap') | title }}</span></div>
                </div>
                <div class="hud-badges">
                  <span class="hud-pill {{ 'pill-alert' if total_open > 0 else 'pill-ok' }}">
                    {{ '● All Entry Points Secure' if total_open == 0 else ('▲ ' ~ total_open ~ ' Entry Open') }}
                  </span>
                  <span class="hud-pill pill-amber">☀ Solar {{ states('sensor.solar_power') }} kW</span>
                  <span class="hud-pill pill-emerald">⚡ Powerwall {{ states('sensor.powerwall_power_name') }}</span>
                  <span class="hud-pill pill-sky">⌂ Load {{ states('sensor.house_load') }} kW</span>
                </div>
              </div>
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg, rgba(41, 50, 72, 0.92) 0%, rgba(28, 35, 52, 0.96) 100%) !important;
                  border-radius: 8px !important;
                  border: 1px solid rgba(255, 255, 255, 0.09) !important;
                  box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.14), 0 12px 30px -8px rgba(8, 12, 21, 0.5) !important;
                  padding: 4px 10px !important;
                }
                .hud-bar {
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  flex-wrap: wrap;
                  gap: 12px;
                }
                .hud-eyebrow {
                  font-family: 'JetBrains Mono', monospace;
                  font-size: 10.5px;
                  font-weight: 600;
                  letter-spacing: 1.8px;
                  color: #38bdf8;
                  margin-bottom: 2px;
                }
                .hud-title {
                  font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif;
                  font-size: 22px;
                  font-weight: 700;
                  color: #f8fafc;
                  letter-spacing: -0.3px;
                }
                .hud-divider {
                  color: rgba(148, 163, 184, 0.45);
                  margin: 0 4px;
                }
                .hud-sub {
                  font-weight: 500;
                  font-size: 16px;
                  color: #94a3b8;
                }
                .hud-badges {
                  display: flex;
                  flex-wrap: wrap;
                  gap: 8px;
                  align-items: center;
                }
                .hud-pill {
                  font-family: 'Plus Jakarta Sans', sans-serif;
                  font-size: 12.5px;
                  font-weight: 600;
                  padding: 6px 14px;
                  border-radius: 6px;
                  border: 1px solid rgba(255, 255, 255, 0.08);
                }
                .pill-ok {
                  background: rgba(52, 211, 153, 0.14);
                  color: #6ee7b7;
                  border-color: rgba(52, 211, 153, 0.3);
                }
                .pill-alert {
                  background: rgba(251, 113, 133, 0.18);
                  color: #fda4af;
                  border-color: rgba(251, 113, 133, 0.38);
                }
                .pill-amber {
                  background: rgba(251, 191, 36, 0.14);
                  color: #fde68a;
                  border-color: rgba(251, 191, 36, 0.3);
                }
                .pill-emerald {
                  background: rgba(52, 211, 153, 0.14);
                  color: #6ee7b7;
                  border-color: rgba(52, 211, 153, 0.3);
                }
                .pill-sky {
                  background: rgba(56, 189, 248, 0.14);
                  color: #bae6fd;
                  border-color: rgba(56, 189, 248, 0.3);
                }

          # ════════════════════════════════════════════════════════════════════
          #  STATUS CHIP BAR — Soft-UI Floating Capsules
          # ════════════════════════════════════════════════════════════════════
          - type: custom:mushroom-chips-card
            alignment: center
            card_mod:
              style: |
                mushroom-chip {
                  --chip-background: rgba(36, 45, 66, 0.82) !important;
                  --chip-border-radius: 6px !important;
                  --chip-box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.12), 0 4px 12px rgba(9, 13, 22, 0.28) !important;
                  border: 1px solid rgba(255,255,255,0.07) !important;
                }
            chips:
              - type: weather
                entity: weather.openweathermap
                show_conditions: true
                show_temperature: true
              - type: template
                icon: mdi:solar-power-variant
                icon_color: amber
                content: "{{ states('sensor.solar_power') }} kW"
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/3
              - type: template
                icon: mdi:battery-heart-variant
                icon_color: >-
                  {% set pct = states('sensor.home_energy_gateway_charge') | float(0) %}
                  {% if pct > 50 %}green{% elif pct > 20 %}amber{% else %}red{% endif %}
                content: "{{ states('sensor.powerwall_power_name') }}"
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/3
              - type: template
                icon: mdi:home-lightning-bolt-outline
                icon_color: "{{ 'red' if states('sensor.house_load') | float(0) > 5 else 'orange' }}"
                content: "{{ states('sensor.house_load') }} kW"
              - type: template
                icon: mdi:shield-home-outline
                icon_color: |-
                  {% set doors = expand(["binary_sensor.main_door","binary_sensor.welcome_laundry_door","binary_sensor.garage_laundry_door","binary_sensor.kitchen_door","binary_sensor.master_bedroom_door","binary_sensor.upper_big_bedroom_door","binary_sensor.upper_small_bedroom_door","binary_sensor.upper_guest_bedroom_door","binary_sensor.upper_common_bathroom_door","binary_sensor.lower_common_bathroom_door"]) | selectattr("state","eq","on") | list | count %}
                  {% set wins = expand(["binary_sensor.welcome_window_left","binary_sensor.welcome_window_right","binary_sensor.welcome_window_front","binary_sensor.welcome_window_peep","binary_sensor.living_room_window_left","binary_sensor.living_room_window_right","binary_sensor.kitchen_window_left","binary_sensor.kitchen_window_right","binary_sensor.entertainment_room_window_left","binary_sensor.entertainment_room_window_right","binary_sensor.master_bedroom_window_left","binary_sensor.master_bedroom_window_right","binary_sensor.master_bedroom_window_left_small","binary_sensor.master_bedroom_window_right_small","binary_sensor.master_bathroom_window","binary_sensor.upper_big_bedroom_window_left","binary_sensor.upper_big_bedroom_window_right","binary_sensor.upper_small_bedroom_window","binary_sensor.upper_guest_bedroom_window"]) | selectattr("state","eq","on") | list | count %}
                  {% set garage = expand(["cover.garage_door_small","cover.garage_door_big"]) | selectattr("state","eq","open") | list | count %}
                  {{ 'red' if (doors + wins + garage) > 0 else 'green' }}
                content: >-
                  {% set doors = expand(["binary_sensor.main_door","binary_sensor.welcome_laundry_door","binary_sensor.garage_laundry_door","binary_sensor.kitchen_door","binary_sensor.master_bedroom_door","binary_sensor.upper_big_bedroom_door","binary_sensor.upper_small_bedroom_door","binary_sensor.upper_guest_bedroom_door","binary_sensor.upper_common_bathroom_door","binary_sensor.lower_common_bathroom_door"]) | selectattr("state","eq","on") | list | count %}
                  {% set wins = expand(["binary_sensor.welcome_window_left","binary_sensor.welcome_window_right","binary_sensor.welcome_window_front","binary_sensor.welcome_window_peep","binary_sensor.living_room_window_left","binary_sensor.living_room_window_right","binary_sensor.kitchen_window_left","binary_sensor.kitchen_window_right","binary_sensor.entertainment_room_window_left","binary_sensor.entertainment_room_window_right","binary_sensor.master_bedroom_window_left","binary_sensor.master_bedroom_window_right","binary_sensor.master_bedroom_window_left_small","binary_sensor.master_bedroom_window_right_small","binary_sensor.master_bathroom_window","binary_sensor.upper_big_bedroom_window_left","binary_sensor.upper_big_bedroom_window_right","binary_sensor.upper_small_bedroom_window","binary_sensor.upper_guest_bedroom_window"]) | selectattr("state","eq","on") | list | count %}
                  {% set garage = expand(["cover.garage_door_small","cover.garage_door_big"]) | selectattr("state","eq","open") | list | count %}
                  {% set total = doors + wins + garage %}
                  {{ 'All Secure' if total == 0 else (total | string + ' open') }}
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/4
              - type: template
                icon: mdi:account-group-outline
                icon_color: >-
                  {% set home = states.device_tracker | selectattr('state','eq','home') | list | count %}
                  {{ 'green' if home > 0 else 'grey' }}
                content: >-
                  {% set home = states.device_tracker | selectattr('state','eq','home') | list | count %}
                  {{ home | string + ' home' if home > 0 else 'Nobody' }}
              - type: template
                icon: mdi:wan
                icon_color: |-
                  {% if states('sensor.xfinity_usage') | int(0) > states('sensor.data_allowance_till_date') | int(0) %}red
                  {% else %}cyan{% endif %}
                content: "{{ states('sensor.xfinity_usage') | int(0) }} / 1229 GB"

          # ════════════════════════════════════════════════════════════════════
          #  CRITICAL GRID OUTAGE OR GARAGE UL LOCKOUT ALERT (Auto-Shows on Fault)
          # ════════════════════════════════════════════════════════════════════
          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity: binary_sensor.grid_status
                    state: "off"
                  - condition: state
                    entity: binary_sensor.garage_door_small_barrier_ul_disabling_status
                    state: "on"
                  - condition: state
                    entity: binary_sensor.garage_barrier_ul_disabling_status
                    state: "on"
            card:
              type: custom:mushroom-template-card
              primary: >-
                {% if is_state('binary_sensor.grid_status', 'off') %}
                  ⚡ GRID OUTAGE ACTIVE — Running on Tesla Powerwall ({{ states('sensor.powerwall_charge') }}%)
                {% else %}
                  ⚠️ Garage Z-Wave Barrier UL Lockout Detected — Cycle Wall Button Once
                {% endif %}
              secondary: >-
                {% if is_state('binary_sensor.grid_status', 'off') %}
                  Current House Load: {{ states('sensor.house_load') }} kW · Solar: {{ states('sensor.solar_power') }} kW
                {% else %}
                  Moto Tilt Battery: {{ states('sensor.garage_door_small_battery_level') }}% · Big Tilt Battery: {{ states('sensor.garage_battery_level') }}%
                {% endif %}
              icon: mdi:alert-octagon
              icon_color: red
              card_mod:
                style: |
                  ha-card {
                    background: linear-gradient(135deg, rgba(225, 29, 72, 0.28) 0%, rgba(30, 38, 56, 0.94) 100%) !important;
                    border: 1px solid rgba(251, 113, 133, 0.55) !important;
                    border-radius: 8px !important;
                  }

          # ════════════════════════════════════════════════════════════════════
          #  🏍️ MOTO BAY & GARAGE QUICK-COMMAND DECK (1-Tap Gloved-Thumb Bar)
          # ════════════════════════════════════════════════════════════════════
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: 1.25fr 1.25fr 1fr 1fr
              grid-gap: 12px
              mediaquery:
                "(max-width: 900px)":
                  grid-template-columns: 1fr 1fr
            cards:
              # 1. 🏍️ MOTO BAY (Small Garage) — 1-Tap Toggle + Auto Entry Lights
              - type: custom:mushroom-template-card
                entity: cover.garage_door_small
                primary: >-
                  🏍️ Moto Bay · {{ states('cover.garage_door_small') | upper }}
                secondary: >-
                  {% if is_state('cover.garage_door_small', 'closed') %}
                    1-Tap Open + Entry Lights · Tilt Batt {{ states('sensor.garage_door_small_battery_level') }}%
                  {% else %}
                    ⚡ BAY OPEN — 1-Tap to Close Moto Bay
                  {% endif %}
                icon: >-
                  {{ 'mdi:motorbike' if is_state('cover.garage_door_small', 'closed') else 'mdi:garage-open-variant' }}
                icon_color: >-
                  {{ 'cyan' if is_state('cover.garage_door_small', 'closed') else 'red' }}
                layout: horizontal
                tap_action:
                  action: call-service
                  service: script.moto_garage_bay
                hold_action:
                  action: more-info
                  entity: camera.garage_right_camera
                card_mod:
                  style: |
                    ha-card {
                      {% if not is_state('cover.garage_door_small', 'closed') %}
                      background: linear-gradient(135deg, rgba(244, 63, 94, 0.28) 0%, rgba(36, 45, 66, 0.92) 100%) !important;
                      border: 1.5px solid rgba(251, 113, 133, 0.65) !important;
                      box-shadow: 0 0 22px rgba(244, 63, 94, 0.28), inset 0 1px 0 0 rgba(255, 255, 255, 0.18) !important;
                      {% else %}
                      background: linear-gradient(135deg, rgba(14, 165, 233, 0.18) 0%, rgba(30, 38, 56, 0.90) 100%) !important;
                      border: 1px solid rgba(56, 189, 248, 0.38) !important;
                      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.14), 0 10px 24px -6px rgba(8, 12, 21, 0.45) !important;
                      {% endif %}
                      border-radius: 8px !important;
                      min-height: 66px !important;
                    }
                    mushroom-state-info {
                      --card-primary-font-size: 15px;
                      --card-primary-font-weight: 700;
                      --card-secondary-font-size: 11.5px;
                    }

              # 2. 🚗 BIG GARAGE — 1-Tap Toggle
              - type: custom:mushroom-template-card
                entity: cover.garage_door_big
                primary: >-
                  🚗 Big Garage · {{ states('cover.garage_door_big') | upper }}
                secondary: >-
                  {% if is_state('cover.garage_door_big', 'closed') %}
                    1-Tap Open Main Bay · Tilt Batt {{ states('sensor.garage_battery_level') }}%
                  {% else %}
                    ⚡ BAY OPEN — 1-Tap to Close Big Garage
                  {% endif %}
                icon: >-
                  {{ 'mdi:garage' if is_state('cover.garage_door_big', 'closed') else 'mdi:garage-open' }}
                icon_color: >-
                  {{ 'green' if is_state('cover.garage_door_big', 'closed') else 'red' }}
                layout: horizontal
                tap_action:
                  action: call-service
                  service: cover.toggle
                  target:
                    entity_id: cover.garage_door_big
                hold_action:
                  action: more-info
                  entity: camera.garage_left_camera
                card_mod:
                  style: |
                    ha-card {
                      {% if not is_state('cover.garage_door_big', 'closed') %}
                      background: linear-gradient(135deg, rgba(244, 63, 94, 0.28) 0%, rgba(36, 45, 66, 0.92) 100%) !important;
                      border: 1.5px solid rgba(251, 113, 133, 0.65) !important;
                      box-shadow: 0 0 22px rgba(244, 63, 94, 0.28), inset 0 1px 0 0 rgba(255, 255, 255, 0.18) !important;
                      {% else %}
                      background: linear-gradient(145deg, rgba(41, 50, 72, 0.82) 0%, rgba(30, 37, 54, 0.90) 100%) !important;
                      border: 1px solid rgba(52, 211, 153, 0.28) !important;
                      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.12), 0 10px 24px -6px rgba(8, 12, 21, 0.45) !important;
                      {% endif %}
                      border-radius: 8px !important;
                      min-height: 66px !important;
                    }
                    mushroom-state-info {
                      --card-primary-font-size: 15px;
                      --card-primary-font-weight: 700;
                      --card-secondary-font-size: 11.5px;
                    }

              # 3. 🔒 SEAL BOTH GARAGES
              - type: custom:mushroom-template-card
                primary: Seal Both Bays
                secondary: >-
                  Laundry Door: {{ 'Open!' if is_state('binary_sensor.garage_laundry_door', 'on') else 'Closed' }}
                icon: mdi:garage-lock
                icon_color: >-
                  {{ 'amber' if (not is_state('cover.garage_door_small', 'closed') or not is_state('cover.garage_door_big', 'closed')) else 'teal' }}
                layout: horizontal
                tap_action:
                  action: call-service
                  service: script.close_all_garages
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(145deg, rgba(41, 50, 72, 0.82) 0%, rgba(30, 37, 54, 0.90) 100%) !important;
                      border: 1px solid rgba(255, 255, 255, 0.09) !important;
                      border-radius: 8px !important;
                      min-height: 66px !important;
                    }
                    mushroom-state-info {
                      --card-primary-font-size: 14px;
                      --card-primary-font-weight: 700;
                      --card-secondary-font-size: 11px;
                    }

              # 4. 🌙 GOODNIGHT HOUSE LOCKDOWN
              - type: custom:mushroom-template-card
                primary: Goodnight Lockdown
                secondary: Garages · Lights · Sleep 67°F
                icon: mdi:shield-moon-outline
                icon_color: indigo
                layout: horizontal
                tap_action:
                  action: call-service
                  service: script.goodnight_lockdown
                  confirmation:
                    text: "Run Goodnight Lockdown (Close both garages, turn off downstairs/outdoor lights, and set HVAC to Sleep 67°F)?"
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(145deg, rgba(49, 46, 129, 0.34) 0%, rgba(30, 37, 54, 0.90) 100%) !important;
                      border: 1px solid rgba(129, 140, 248, 0.32) !important;
                      border-radius: 8px !important;
                      min-height: 66px !important;
                    }
                    mushroom-state-info {
                      --card-primary-font-size: 14px;
                      --card-primary-font-weight: 700;
                      --card-secondary-font-size: 11px;
                    }

          # ── Auto-Expanding Live Garage Camera Optics (Visible Automatically Whenever Any Bay is Open/Moving) ──
          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity: cover.garage_door_small
                    state_not: "closed"
                  - condition: state
                    entity: cover.garage_door_big
                    state_not: "closed"
            card:
              type: custom:layout-card
              layout_type: custom:grid-layout
              layout:
                grid-template-columns: 1fr 1fr
                grid-gap: 12px
                mediaquery:
                  "(max-width: 700px)":
                    grid-template-columns: 1fr
              cards:
                - type: picture-glance
                  title: "🏍️ Moto Bay Optics (Garage Right)"
                  camera_image: camera.garage_right_camera
                  camera_view: live
                  entities:
                    - cover.garage_door_small
                    - binary_sensor.garage_laundry_door
                - type: picture-glance
                  title: "🚗 Big Garage Optics (Garage Left)"
                  camera_image: camera.garage_left_camera
                  camera_view: live
                  entities:
                    - cover.garage_door_big

          # ════════════════════════════════════════════════════════════════════
          #  HERO BENTO ROW — Weather | Live Energy Flow | Power Telemetry Bars
          # ════════════════════════════════════════════════════════════════════
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: 1.15fr 1.15fr 1fr
              grid-gap: 14px
              mediaquery:
                "(max-width: 1150px)":
                  grid-template-columns: 1fr 1fr
                "(max-width: 720px)":
                  grid-template-columns: 1fr
            cards:
              - type: custom:clock-weather-card
                entity: weather.openweathermap
                card_mod: &card_style
                  style: |
                    ha-card {
                      background: linear-gradient(145deg, rgba(41, 50, 72, 0.90) 0%, rgba(30, 37, 54, 0.94) 100%) !important;
                      border-radius: 8px !important;
                      border: 1px solid rgba(255, 255, 255, 0.085) !important;
                      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.12), 0 12px 28px -8px rgba(9, 13, 22, 0.45) !important;
                    }

              - type: vertical-stack
                cards:
                  - type: energy-date-selection
                    card_mod: *card_style
                  - type: energy-distribution
                    card_mod: *card_style

              - type: "custom:config-template-card"
                entities:
                  - sensor.solar_power
                  - sensor.grid_power
                  - sensor.grid_power_target
                  - sensor.powerwall_power
                  - sensor.powerwall_power_target
                  - sensor.powerwall_power_name
                  - sensor.house_load
                card:
                  type: custom:bar-card
                  columns: 4
                  height: 155px
                  width: 92%
                  decimal: 1
                  direction: up
                  positions:
                    icon: inside
                    name: 'off'
                    value: outside
                    indicator: 'off'
                  animation:
                    state: 'on'
                    speed: 5
                  card_mod:
                    style: |
                      ha-card {
                        background: linear-gradient(145deg, rgba(41, 50, 72, 0.90) 0%, rgba(30, 37, 54, 0.94) 100%) !important;
                        border-radius: 8px !important;
                        border: 1px solid rgba(255, 255, 255, 0.085) !important;
                        box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.12), 0 12px 28px -8px rgba(9, 13, 22, 0.45) !important;
                        padding: 12px 8px !important;
                      }
                      bar-card-backgroundbar {
                        border-radius: 6px !important;
                        background: rgba(15, 23, 42, 0.45) !important;
                      }
                      bar-card-currentbar, bar-card-targetbar {
                        border-radius: 6px !important;
                      }
                      bar-card-value {
                        font-family: 'JetBrains Mono', monospace !important;
                        font-weight: 600 !important;
                        font-size: 13px !important;
                      }
                  entities:
                    - entity: sensor.solar_power
                      name: "Solar"
                      target: "${states['sensor.solar_power'].state}"
                      min: 0
                      max: 8
