title: Floorplan
path: home
icon: mdi:floor-plan
type: custom:grid-layout
layout:
  grid-template-columns: 1fr
  grid-gap: 10px
  margin: 8px 12px 16px 12px
  mediaquery:
    "(max-width: 640px)":
      grid-gap: 8px
      margin: 6px 8px 14px 8px
cards:
  # ════════════════════════════════════════════════════════════════════════════
  #  COMPACT FLOORPLAN TELEMETRY BAR
  # ════════════════════════════════════════════════════════════════════════════
  - type: custom:mushroom-chips-card
    alignment: justify
    chips:
      - type: template
        icon: mdi:home-thermometer-outline
        icon_color: cyan
        content: >-
          {% set temps = [
            states('sensor.thermostat_living_room_temperature') | float(0),
            states('sensor.thermostat_master_bedroom_temperature') | float(0),
            states('sensor.thermostat_upper_big_bedroom_temperature') | float(0),
            states('sensor.thermostat_upper_small_bedroom_temperature') | float(0),
            states('sensor.thermostat_upper_guest_bedroom_temperature') | float(0),
            states('sensor.thermostat_entertainment_room_temperature') | float(0)
          ] | reject('le', 0) | list %}
          Avg {{ (temps | sum / (temps | count if temps | count > 0 else 1)) | round(1) }}°F
        tap_action:
          action: navigate
          navigation_path: /lovelace/climate
      - type: template
        entity: cover.garage_door_small
        icon: >-
          {% set g = ['cover.garage_door_small', 'cover.garage_door_big'] | select('is_state', 'open') | list | count %}
          {{ 'mdi:garage-alert' if g > 0 else 'mdi:garage-lock' }}
        icon_color: >-
          {% set g = ['cover.garage_door_small', 'cover.garage_door_big'] | select('is_state', 'open') | list | count %}
          {{ 'red' if g > 0 else 'green' }}
        content: >-
          {% set g = ['cover.garage_door_small', 'cover.garage_door_big'] | select('is_state', 'open') | list | count %}
          Garages: {{ g ~ ' Open' if g > 0 else 'Closed' }}
        tap_action:
          action: navigate
          navigation_path: /lovelace/security
      - type: template
        icon: mdi:white-balance-sunny
        icon_color: amber
        content: "Daylight Scene"
        tap_action:
          action: call-service
          service: script.scene_daylight_work
      - type: template
        icon: mdi:weather-sunset
        icon_color: orange
        content: "Evening Scene"
        tap_action:
          action: call-service
          service: script.scene_evening_relax
      - type: template
        icon: mdi:lightbulb-group-off
        icon_color: blue
        content: "All Lights Off"
        tap_action:
          action: call-service
          service: script.lights_all_off

  # ════════════════════════════════════════════════════════════════════════════
  #  LEVEL 3 — UPPER FLOOR (BEDROOMS & ATTIC)
  # ════════════════════════════════════════════════════════════════════════════
  - type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: 1.5fr 1fr
      grid-gap: 10px
      margin: 0
      mediaquery:
        "(max-width: 960px)":
          grid-template-columns: 1fr
    cards:
      - type: picture-elements
        image: /local/solstice/floor_upper.svg
        elements:
          - type: state-label
            entity: sensor.thermostat_master_bedroom_temperature
            prefix: "Master "
            style:
              top: 38%
              left: 24%
              color: "#f8fafc"
              font-weight: 700
              font-size: 11px
              background: "#0f172ae6"
              padding: 2px 8px
              border-radius: 999px
              border: 1px solid rgba(56, 189, 248, 0.4)
          - type: state-icon
            entity: fan.master_bedroom_fan_dimmer
            tap_action:
              action: toggle
            style:
              top: 52%
              left: 24%
              --paper-item-icon-color: "#94a3b8"
              --paper-item-icon-active-color: "#38bdf8"
              background: "#0f172ae6"
              border-radius: 50%
              padding: 3px
          - type: state-label
            entity: sensor.thermostat_upper_big_bedroom_temperature
            prefix: "Big Bed "
            style:
              top: 36%
              left: 55%
              color: "#f8fafc"
              font-weight: 700
              font-size: 11px
              background: "#0f172ae6"
              padding: 2px 8px
              border-radius: 999px
              border: 1px solid rgba(52, 211, 153, 0.4)
          - type: state-icon
            entity: switch.upper_big_bedroom_light_fan
            tap_action:
              action: toggle
            style:
              top: 50%
              left: 55%
              --paper-item-icon-color: "#94a3b8"
              --paper-item-icon-active-color: "#fbbf24"
              background: "#0f172ae6"
              border-radius: 50%
              padding: 3px
          - type: state-label
            entity: sensor.thermostat_upper_small_bedroom_temperature
            prefix: "Small "
            style:
              top: 36%
              left: 80%
              color: "#f8fafc"
              font-weight: 700
              font-size: 11px
              background: "#0f172ae6"
              padding: 2px 8px
              border-radius: 999px
              border: 1px solid rgba(251, 191, 36, 0.4)
          - type: state-icon
            entity: switch.upper_small_bedroom_light_fan
            tap_action:
              action: toggle
            style:
              top: 50%
              left: 80%
              --paper-item-icon-color: "#94a3b8"
              --paper-item-icon-active-color: "#fbbf24"
              background: "#0f172ae6"
              border-radius: 50%
              padding: 3px
          - type: state-label
            entity: sensor.thermostat_upper_guest_bedroom_temperature
            prefix: "Guest "
            style:
              top: 76%
              left: 74%
              color: "#f8fafc"
              font-weight: 700
              font-size: 11px
              background: "#0f172ae6"
              padding: 2px 8px
              border-radius: 999px
              border: 1px solid rgba(167, 139, 250, 0.4)
          - type: state-icon
            entity: switch.upper_guest_bedroom_light_fan
            tap_action:
              action: toggle
            style:
              top: 86%
              left: 84%
              --paper-item-icon-color: "#94a3b8"
              --paper-item-icon-active-color: "#fbbf24"
              background: "#0f172ae6"
              border-radius: 50%
              padding: 3px

      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Level 3 — Upper Floor
            subtitle: 4 bedroom suites & attic zone
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(2, minmax(0, 1fr))
              grid-gap: 8px
              margin: 0
            cards:
              - type: custom:mushroom-template-card
                entity: climate.thermostat_master_bedroom
                primary: Master Suite
                secondary: >-
                  {{ states('sensor.thermostat_master_bedroom_temperature') | round(0) }}°F · {{ states('sensor.thermostat_master_bedroom_humidity') | round(0) }}% · {{ states('input_select.thermostat_master_bedroom_mode') }}
                icon: mdi:bed-king-outline
                icon_color: >-
                  {% set m = states('input_select.thermostat_master_bedroom_mode') | lower %}
                  {{ 'blue' if m == 'cool' else ('orange' if m == 'heat' else ('green' if m == 'auto' else 'disabled')) }}
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/climate
              - type: custom:mushroom-template-card
                entity: climate.thermostat_upper_big_bedroom
                primary: Upper Big Bed
                secondary: >-
                  {{ states('sensor.thermostat_upper_big_bedroom_temperature') | round(0) }}°F · {{ states('sensor.thermostat_upper_big_bedroom_humidity') | round(0) }}% · {{ states('input_select.thermostat_upper_big_bedroom_mode') }}
                icon: mdi:bed-double-outline
                icon_color: >-
                  {% set m = states('input_select.thermostat_upper_big_bedroom_mode') | lower %}
                  {{ 'blue' if m == 'cool' else ('orange' if m == 'heat' else ('green' if m == 'auto' else 'disabled')) }}
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/climate
              - type: custom:mushroom-template-card
                entity: climate.thermostat_upper_small_bedroom
                primary: Upper Small Bed
                secondary: >-
                  {{ states('sensor.thermostat_upper_small_bedroom_temperature') | round(0) }}°F · {{ states('sensor.thermostat_upper_small_bedroom_humidity') | round(0) }}% · {{ states('input_select.thermostat_upper_small_bedroom_mode') }}
                icon: mdi:bed-single-outline
                icon_color: >-
                  {% set m = states('input_select.thermostat_upper_small_bedroom_mode') | lower %}
                  {{ 'blue' if m == 'cool' else ('orange' if m == 'heat' else ('green' if m == 'auto' else 'disabled')) }}
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/climate
              - type: custom:mushroom-template-card
                entity: climate.thermostat_upper_guest_bedroom
                primary: Upper Guest Bed
                secondary: >-
                  {{ states('sensor.thermostat_upper_guest_bedroom_temperature') | round(0) }}°F · {{ states('sensor.thermostat_upper_guest_bedroom_humidity') | round(0) }}% · {{ states('input_select.thermostat_upper_guest_bedroom_mode') }}
                icon: mdi:bed-queen-outline
                icon_color: >-
                  {% set m = states('input_select.thermostat_upper_guest_bedroom_mode') | lower %}
                  {{ 'blue' if m == 'cool' else ('orange' if m == 'heat' else ('green' if m == 'auto' else 'disabled')) }}
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/climate
              - type: custom:mushroom-entity-card
                entity: switch.upper_big_bedroom_light_fan
                name: Big Bed Fan/Light
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: switch.upper_small_bedroom_light_fan
                name: Small Bed Fan/Light
                tap_action:
                  action: toggle

  # ════════════════════════════════════════════════════════════════════════════
  #  LEVEL 2 — MAIN FLOOR (LIVING, KITCHEN, WELCOME, ENTRYWAY)
  # ════════════════════════════════════════════════════════════════════════════
  - type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: 1.5fr 1fr
      grid-gap: 10px
      margin: 0
      mediaquery:
        "(max-width: 960px)":
          grid-template-columns: 1fr
    cards:
      - type: picture-elements
        image: /local/solstice/floor_main.svg
        elements:
          - type: state-label
            entity: sensor.thermostat_living_room_temperature
            prefix: "Living "
            style:
              top: 38%
              left: 26%
              color: "#f8fafc"
              font-weight: 700
              font-size: 11px
              background: "#0f172ae6"
              padding: 2px 8px
              border-radius: 999px
              border: 1px solid rgba(56, 189, 248, 0.4)
          - type: state-icon
            entity: light.living_room_light
            tap_action:
              action: toggle
            style:
              top: 52%
              left: 26%
              --paper-item-icon-color: "#94a3b8"
              --paper-item-icon-active-color: "#fbbf24"
              background: "#0f172ae6"
              border-radius: 50%
              padding: 3px
          - type: state-icon
            entity: switch.kitchen_light
            tap_action:
              action: toggle
            style:
              top: 48%
              left: 58%
              --paper-item-icon-color: "#94a3b8"
              --paper-item-icon-active-color: "#fbbf24"
              background: "#0f172ae6"
              border-radius: 50%
              padding: 3px
          - type: state-icon
            entity: switch.welcome_room_light
            tap_action:
              action: toggle
            style:
              top: 45%
              left: 82%
              --paper-item-icon-color: "#94a3b8"
              --paper-item-icon-active-color: "#fbbf24"
              background: "#0f172ae6"
              border-radius: 50%
              padding: 3px
          - type: state-icon
            entity: switch.entryway_light
            tap_action:
              action: toggle
            style:
              top: 78%
              left: 78%
              --paper-item-icon-color: "#94a3b8"
              --paper-item-icon-active-color: "#fbbf24"
              background: "#0f172ae6"
              border-radius: 50%
              padding: 3px
          - type: state-icon
            entity: binary_sensor.main_door
            style:
              top: 84%
              left: 88%
              --paper-item-icon-color: "#34d399"
              --paper-item-icon-active-color: "#fb7185"
              background: "#0f172ae6"
              border-radius: 50%
              padding: 3px

      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Level 2 — Main Living Level
            subtitle: Living Room, Kitchen, Welcome Room, and Front Entry
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(2, minmax(0, 1fr))
              grid-gap: 8px
              margin: 0
            cards:
              - type: custom:mushroom-template-card
                entity: climate.thermostat_living_room
                primary: Living Room HVAC
                secondary: >-
                  {{ states('sensor.thermostat_living_room_temperature') | round(0) }}°F · {{ states('sensor.thermostat_living_room_humidity') | round(0) }}% · {{ states('input_select.thermostat_living_room_mode') }}
                icon: mdi:sofa-outline
                icon_color: >-
                  {% set m = states('input_select.thermostat_living_room_mode') | lower %}
                  {{ 'blue' if m == 'cool' else ('orange' if m == 'heat' else ('green' if m == 'auto' else 'disabled')) }}
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/climate
              - type: custom:mushroom-light-card
                entity: light.living_room_light
                name: Living Room Light
                show_brightness_control: false
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: switch.kitchen_light
                name: Kitchen Overhead
                icon: mdi:countertop-outline
                icon_color: amber
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: switch.welcome_room_light
                name: Welcome Room
                icon: mdi:sofa-single-outline
                icon_color: amber
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: switch.entryway_light
                name: Entryway Light
                icon: mdi:coach-lamp
                icon_color: amber
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: binary_sensor.main_door
                name: Front Entry Door
                icon_color: red

  # ════════════════════════════════════════════════════════════════════════════
  #  LEVEL 1 — LOWER LEVEL & GARAGE BAYS
  # ════════════════════════════════════════════════════════════════════════════
  - type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: 1.5fr 1fr
      grid-gap: 10px
      margin: 0
      mediaquery:
        "(max-width: 960px)":
          grid-template-columns: 1fr
    cards:
      - type: picture-elements
        image: /local/solstice/floor_lower.svg
        elements:
          - type: state-label
            entity: sensor.thermostat_entertainment_room_temperature
            prefix: "Media "
            style:
              top: 38%
              left: 25%
              color: "#f8fafc"
              font-weight: 700
              font-size: 11px
              background: "#0f172ae6"
              padding: 2px 8px
              border-radius: 999px
              border: 1px solid rgba(52, 211, 153, 0.4)
          - type: state-icon
            entity: switch.lower_common_bathroom_light
            tap_action:
              action: toggle
            style:
              top: 48%
              left: 55%
              --paper-item-icon-color: "#94a3b8"
              --paper-item-icon-active-color: "#fbbf24"
              background: "#0f172ae6"
              border-radius: 50%
              padding: 3px
          - type: state-icon
            entity: cover.garage_door_big
            tap_action:
              action: toggle
            style:
              top: 45%
              left: 80%
              --paper-item-icon-color: "#34d399"
              --paper-item-icon-active-color: "#fb7185"
              background: "#0f172ae6"
              border-radius: 50%
              padding: 3px
          - type: state-icon
            entity: cover.garage_door_small
            tap_action:
              action: toggle
            style:
              top: 68%
              left: 80%
              --paper-item-icon-color: "#34d399"
              --paper-item-icon-active-color: "#fb7185"
              background: "#0f172ae6"
              border-radius: 50%
              padding: 3px
          - type: state-icon
            entity: switch.backyard_patio_lights
            tap_action:
              action: toggle
            style:
              top: 82%
              left: 28%
              --paper-item-icon-color: "#94a3b8"
              --paper-item-icon-active-color: "#fbbf24"
              background: "#0f172ae6"
              border-radius: 50%
              padding: 3px

      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Level 1 — Lower Level & Garage
            subtitle: Entertainment Room, Garage Bays, and Patio
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(2, minmax(0, 1fr))
              grid-gap: 8px
              margin: 0
            cards:
              - type: custom:mushroom-template-card
                entity: climate.thermostat_entertainment_room
                primary: Entertainment HVAC
                secondary: >-
                  {{ states('sensor.thermostat_entertainment_room_temperature') | round(0) }}°F · {{ states('sensor.thermostat_entertainment_room_humidity') | round(0) }}% · {{ states('input_select.thermostat_entertainment_room_mode') }}
                icon: mdi:television-ambient-light
                icon_color: >-
                  {% set m = states('input_select.thermostat_entertainment_room_mode') | lower %}
                  {{ 'blue' if m == 'cool' else ('orange' if m == 'heat' else ('green' if m == 'auto' else 'disabled')) }}
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/climate
              - type: custom:mushroom-template-card
                entity: cover.garage_door_small
                primary: Moto Bay (Small)
                secondary: "{{ states('cover.garage_door_small') | title }} · Tap to Toggle"
                icon: "{{ 'mdi:garage-open' if is_state('cover.garage_door_small', 'open') else 'mdi:motorbike' }}"
                icon_color: "{{ 'red' if is_state('cover.garage_door_small', 'open') else 'green' }}"
                tap_action:
                  action: call-service
                  service: script.moto_garage_bay
              - type: custom:mushroom-template-card
                entity: cover.garage_door_big
                primary: Big Garage Door
                secondary: "{{ states('cover.garage_door_big') | title }} · Tap to Toggle"
                icon: "{{ 'mdi:garage-open-variant' if is_state('cover.garage_door_big', 'open') else 'mdi:garage-variant' }}"
                icon_color: "{{ 'red' if is_state('cover.garage_door_big', 'open') else 'green' }}"
                tap_action:
                  action: call-service
                  service: cover.toggle
                  target:
                    entity_id: cover.garage_door_big
              - type: custom:mushroom-entity-card
                entity: switch.lower_common_bathroom_light
                name: Lower Bath Light
                icon: mdi:shower-head
                icon_color: amber
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: switch.backyard_patio_lights
                name: Backyard Patio
                icon: mdi:outdoor-lamp
                icon_color: amber
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: switch.backyard_gym_lights
                name: Backyard Gym
                icon: mdi:dumbbell
                icon_color: cyan
                tap_action:
                  action: toggle
