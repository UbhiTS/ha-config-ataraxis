Solstice Evening:
  # ════════════════════════════════════════════════════════════════════════════
  #  SOLSTICE EVENING — Futuristic Soft-UI & Twilight Atmosphere Theme
  #  Designed for Home Assistant 2026 · Warm Dusk Slate-Indigo (Not Midnight)
  # ════════════════════════════════════════════════════════════════════════════
  modes:
    dark:
      background-image: "center / cover no-repeat fixed url('/local/solstice/evening_horizon.svg')"
      primary-background-color: "#1b2232"
      secondary-background-color: "#222a3d"
      app-header-background-color: "rgba(25, 31, 46, 0.92)"
      ha-card-background: "linear-gradient(145deg, rgba(41, 50, 72, 0.90) 0%, rgba(31, 38, 56, 0.94) 100%)"
      app-theme-color: "#1b2232"
    light:
      background-image: "center / cover no-repeat fixed url('/local/solstice/evening_horizon.svg')"
      primary-background-color: "#1b2232"
      secondary-background-color: "#222a3d"
      app-header-background-color: "rgba(25, 31, 46, 0.92)"
      ha-card-background: "linear-gradient(145deg, rgba(41, 50, 72, 0.90) 0%, rgba(31, 38, 56, 0.94) 100%)"
      app-theme-color: "#1b2232"

  # ── Global Canvas & Typography ──
  lovelace-background: var(--background-image)
  primary-font-family: "'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  paper-font-common-base_-_font-family: var(--primary-font-family)
  paper-font-common-expensive-kerning_-_font-family: var(--primary-font-family)
  paper-font-common-code_-_font-family: "'JetBrains Mono', monospace"
  ha-font-family-body: var(--primary-font-family)
  ha-font-family-heading: "'Space Grotesk', 'Plus Jakarta Sans', sans-serif"
  ha-font-family-code: "'JetBrains Mono', monospace"

  # ── Core Palette (Evening Twilight + Warm Horizon) ──
  primary-color: "#38bdf8"
  accent-color: "#f59e0b"
  dark-primary-color: "#0284c7"
  light-primary-color: "#7dd3fc"
  divider-color: "rgba(148, 163, 184, 0.12)"
  outline-color: "rgba(148, 163, 184, 0.12)"

  # ── Text Hierarchy (Soft Alabaster & Cool Twilight Silver) ──
  primary-text-color: "#f1f5f9"
  secondary-text-color: "#94a3b8"
  ha-color-text-primary: "#f1f5f9"
  ha-color-text-secondary: "#94a3b8"
  text-primary-color: "#f1f5f9"
  disabled-text-color: "rgba(148, 163, 184, 0.45)"
  text-dark-color: "#f1f5f9"

  # ── Semantic & Accent Colors (Softened Futuristic Pastels) ──
  red-color: "#fb7185"
  pink-color: "#f472b6"
  purple-color: "#a78bfa"
  indigo-color: "#818cf8"
  blue-color: "#38bdf8"
  light-blue-color: "#7dd3fc"
  cyan-color: "#22d3ee"
  teal-color: "#2dd4bf"
  green-color: "#34d399"
  light-green-color: "#6ee7b7"
  yellow-color: "#fbbf24"
  amber-color: "#f59e0b"
  orange-color: "#fb923c"
  deep-orange-color: "#f97316"
  brown-color: "#bcaaa4"
  grey-color: "#64748b"
  blue-grey-color: "#94a3b8"

  # ── RGB Equivalents for Mushroom & Card-Mod Alpha Blends ──
  rgb-primary-color: "56, 189, 248"
  rgb-accent-color: "245, 158, 11"
  rgb-red-color: "251, 113, 133"
  rgb-pink-color: "244, 114, 182"
  rgb-purple-color: "167, 139, 250"
  rgb-indigo-color: "129, 140, 248"
  rgb-blue-color: "56, 189, 248"
  rgb-cyan-color: "34, 211, 238"
  rgb-teal-color: "45, 212, 191"
  rgb-green-color: "52, 211, 153"
  rgb-yellow-color: "251, 191, 36"
  rgb-amber-color: "245, 158, 11"
  rgb-orange-color: "251, 146, 60"
  rgb-grey-color: "100, 116, 139"
  rgb-primary-text-color: "241, 245, 249"
  rgb-secondary-text-color: "148, 163, 184"
  rgb-card-background-color: "34, 42, 61"

  # ── States & Icons ──
  state-icon-color: "#94a3b8"
  state-icon-active-color: "#fbbf24"
  state-icon-unavailable-color: "rgba(148, 163, 184, 0.35)"
  state-inactive-color: "#64748b"
  state-active-color: "#fbbf24"
  state-light-active-color: "#fbbf24"
  state-switch-active-color: "#38bdf8"
  state-fan-active-color: "#22d3ee"
  state-climate-cool-color: "#38bdf8"
  state-climate-heat-color: "#fb923c"
  state-climate-auto-color: "#34d399"
  state-binary_sensor-active-color: "#fb7185"
  state-cover-open-color: "#fb7185"
  state-cover-closed-color: "#34d399"
  state-person-home-color: "#34d399"

  # ── Sidebar & Header Navigation ──
  sidebar-background-color: "rgba(24, 30, 44, 0.94)"
  sidebar-icon-color: "#94a3b8"
  sidebar-text-color: "#cbd5e1"
  sidebar-selected-background-color: "rgba(56, 189, 248, 0.14)"
  sidebar-selected-icon-color: "#38bdf8"
  sidebar-selected-text-color: "#f8fafc"
  app-header-text-color: "#f1f5f9"
  app-header-backdrop-filter: "none"
  app-header-edit-background-color: "rgba(30, 37, 54, 0.95)"

  # ── Soft-UI Cards & Elevation (Crisp 8px Architectural Corners) ──
  card-background-color: "#232b3e"
  paper-card-background-color: "rgba(36, 44, 64, 0.92)"
  ha-card-border-radius: "8px"
  ha-card-features-border-radius: "6px"
  ha-card-border-width: "1px"
  ha-card-border-color: "rgba(255, 255, 255, 0.08)"
  ha-card-backdrop-filter: "none"
  ha-card-box-shadow: "inset 0 1px 0 0 rgba(255, 255, 255, 0.12), inset 0 0 0 1px rgba(255, 255, 255, 0.03), 0 12px 28px -8px rgba(9, 13, 22, 0.48), 0 4px 12px -2px rgba(9, 13, 22, 0.28)"

  # ── Mushroom Soft-UI Design Tokens ──
  mush-spacing: "12px"
  mush-card-primary-font-size: "15px"
  mush-card-secondary-font-size: "12.5px"
  mush-card-primary-font-weight: "600"
  mush-card-secondary-font-weight: "500"
  mush-card-primary-line-height: "1.35"
  mush-card-secondary-line-height: "1.3"
  mush-chip-border-radius: "6px"
  mush-chip-height: "36px"
  mush-chip-padding: "0 12px"
  mush-chip-font-size: "13px"
  mush-chip-font-weight: "600"
  mush-chip-background: "rgba(36, 45, 66, 0.90)"
  mush-chip-box-shadow: "inset 0 1px 0 0 rgba(255, 255, 255, 0.12), 0 4px 12px rgba(9, 13, 22, 0.3)"
  mush-control-border-radius: "6px"
  mush-control-height: "40px"
  mush-icon-border-radius: "8px"
  mush-icon-size: "42px"
  mush-title-padding: "18px 8px 10px"
  mush-title-font-size: "21px"
  mush-title-font-weight: "700"
  mush-subtitle-font-size: "13.5px"
  mush-subtitle-font-weight: "500"

  # ── Controls, Sliders & Switches ──
  switch-checked-track-color: "#38bdf8"
  switch-checked-button-color: "#ffffff"
  switch-unchecked-track-color: "rgba(100, 116, 139, 0.45)"
  switch-unchecked-button-color: "#cbd5e1"
  paper-slider-knob-color: "#ffffff"
  paper-slider-knob-start-color: "#ffffff"
  paper-slider-pin-color: "#38bdf8"
  paper-slider-active-color: "#38bdf8"
  paper-slider-container-color: "rgba(148, 163, 184, 0.2)"
  ha-slider-background: "none !important"

  # ── Dialogs, Modals & Overlays ──
  ha-dialog-surface-backdrop-filter: "none"
  ha-dialog-surface-background: "rgba(31, 38, 56, 0.96)"
  paper-dialog-background-color: "rgba(31, 38, 56, 0.96)"
  more-info-header-background: "rgba(25, 31, 46, 0.90)"
  mdc-theme-surface: "#232b3e"
  material-background-color: "#232b3e"
  code-editor-background-color: "#171d2b"
  markdown-code-background-color: "rgba(15, 23, 42, 0.55)"

  # ── Energy Dashboard Colors (Harmonized with Evening Palette) ──
  energy-solar-color: "#fbbf24"
  energy-grid-consumption-color: "#38bdf8"
  energy-grid-return-color: "#a78bfa"
  energy-battery-in-color: "#34d399"
  energy-battery-out-color: "#2dd4bf"
  energy-gas-color: "#fb923c"
  energy-water-color: "#22d3ee"

  # ── Global Card-Mod Styling ──
  card-mod-theme: "Solstice Evening"
  card-mod-drawer-yaml: |
    .: |
      .mdc-drawer {
        background-color: rgba(24, 30, 44, 0.94) !important;
        border-right: 1px solid rgba(255, 255, 255, 0.07) !important;
      }
      .sidebar-shell {
        background-color: rgba(24, 30, 44, 0.94) !important;
      }
  card-mod-sidebar: |
    :host {
      background: rgba(24, 30, 44, 0.94) !important;
    }
    ha-md-list-item,
    ha-list-item-button {
      border-radius: 14px !important;
      margin: 2px 8px !important;
      transition: background-color 0.15s ease !important;
    }
  card-mod-card-yaml: |
    .: |
      ha-card {
        background: var(--ha-card-background);
        border-radius: var(--ha-card-border-radius);
        border: 1px solid rgba(255, 255, 255, 0.085);
        box-shadow: var(--ha-card-box-shadow);
        transition: border-color 0.15s ease;
      }
      ha-card:hover {
        border-color: rgba(255, 255, 255, 0.15);
      }

      /* Keep Mushroom Title & Chip Containers Transparent */
      :host(mushroom-title-card) ha-card,
      :host(hui-heading-card) ha-card {
        background: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        border: none !important;
        box-shadow: none !important;
      }
      :host(mushroom-chips-card) ha-card {
        background: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        border: none !important;
        box-shadow: none !important;
      }

      /* Energy & Data Tables */
      .mdc-data-table,
      .mdc-data-table__row,
      .mdc-data-table__header-cell,
      ha-sankey-chart {
        background: none !important;
      }
