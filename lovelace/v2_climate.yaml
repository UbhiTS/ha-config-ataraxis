title: Climate
path: climate
icon: mdi:thermostat
type: custom:grid-layout
layout:
  grid-template-columns: 1fr
  grid-gap: 10px
  margin: 8px 12px 16px 12px
  mediaquery:
    "(max-width: 640px)":
      grid-gap: 8px
      margin: 6px 8px 14px 8px
cards:
  # ════════════════════════════════════════════════════════════════════════════
  #  COMPACT CLIMATE STATUS & MASTER PRESET BAR
  # ════════════════════════════════════════════════════════════════════════════
  - type: custom:mushroom-chips-card
    alignment: justify
    chips:
      - type: template
        icon: mdi:home-thermometer-outline
        icon_color: cyan
        content: >-
          {% set temps = [
            states('sensor.thermostat_living_room_temperature') | float(0),
            states('sensor.thermostat_master_bedroom_temperature') | float(0),
            states('sensor.thermostat_upper_big_bedroom_temperature') | float(0),
            states('sensor.thermostat_upper_small_bedroom_temperature') | float(0),
            states('sensor.thermostat_upper_guest_bedroom_temperature') | float(0),
            states('sensor.thermostat_entertainment_room_temperature') | float(0)
          ] | reject('le', 0) | list %}
          Avg {{ (temps | sum / (temps | count if temps | count > 0 else 1)) | round(1) }}°F
      - type: weather
        entity: weather.home
        show_temperature: true
        show_conditions: true
      - type: template
        icon: mdi:thermostat-auto
        icon_color: green
        content: "All Auto (68°–73°)"
        tap_action:
          action: call-service
          service: script.climate_all_zones_preset
          data:
            preset_mode: auto
            target_temp: 73
      - type: template
        icon: mdi:snowflake
        icon_color: blue
        content: "All Cool 72°"
        tap_action:
          action: call-service
          service: script.climate_all_zones_preset
          data:
            preset_mode: cool
            target_temp: 72
      - type: template
        icon: mdi:fire
        icon_color: orange
        content: "All Heat 69°"
        tap_action:
          action: call-service
          service: script.climate_all_zones_preset
          data:
            preset_mode: heat
            target_temp: 69
      - type: template
        icon: mdi:weather-night
        icon_color: indigo
        content: "Sleep 67°"
        tap_action:
          action: call-service
          service: script.climate_all_zones_preset
          data:
            preset_mode: sleep
            target_temp: 67
      - type: template
        icon: mdi:power-standby
        icon_color: red
        content: "All Off"
        tap_action:
          action: call-service
          service: script.climate_all_zones_preset
          data:
            preset_mode: "off"

  # ════════════════════════════════════════════════════════════════════════════
  #  7-ZONE INTERACTIVE THERMOSTAT MATRIX (3-COL LAPTOP / 2-COL TABLET / 1-COL PHONE)
  # ════════════════════════════════════════════════════════════════════════════
  - type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(3, minmax(0, 1fr))
      grid-gap: 10px
      margin: 0
      mediaquery:
        "(max-width: 1180px)":
          grid-template-columns: repeat(2, minmax(0, 1fr))
        "(max-width: 680px)":
          grid-template-columns: 1fr
    cards:
      # ── 1. LIVING ROOM ──
      - type: vertical-stack
        cards:
          - type: custom:mushroom-template-card
            entity: climate.thermostat_living_room
            primary: Living Room
            secondary: >-
              {% set t = states('sensor.thermostat_living_room_temperature') | float(state_attr('climate.thermostat_living_room', 'current_temperature') | float(0)) | round(0) %}
              {% set h = states('sensor.thermostat_living_room_humidity') | float(0) | round(0) %}
              {% set m = states('input_select.thermostat_living_room_mode') | lower %}
              {% set f = states('input_select.thermostat_living_room_fan_mode') | default('Auto') %}
              {% set lo = states('input_number.thermostat_living_room_heat_setpoint') | float(68) | round(0) %}
              {% set hi = states('input_number.thermostat_living_room_setpoint') | float(73) | round(0) %}
              {{ t }}°F · {{ h }}% RH · {% if m == 'auto' %}Auto {{ lo }}°–{{ hi }}°F{% elif m == 'heat' %}Heat {{ lo }}°F{% elif m == 'cool' %}Cool {{ hi }}°F{% else %}Off{% endif %} · Fan {{ f }}
            icon: mdi:sofa-outline
            icon_color: >-
              {% set m = states('input_select.thermostat_living_room_mode') | lower %}
              {{ 'blue' if m == 'cool' else ('orange' if m == 'heat' else ('green' if m == 'auto' else 'disabled')) }}
            tap_action:
              action: more-info
          - type: custom:thermostat-range-bar
            entity: climate.thermostat_living_room
            min: 55
            max: 85
            step: 1
            min_gap: 2

      # ── 2. MASTER SUITE ──
      - type: vertical-stack
        cards:
          - type: custom:mushroom-template-card
            entity: climate.thermostat_master_bedroom
            primary: Master Suite
            secondary: >-
              {% set t = states('sensor.thermostat_master_bedroom_temperature') | float(state_attr('climate.thermostat_master_bedroom', 'current_temperature') | float(0)) | round(0) %}
              {% set h = states('sensor.thermostat_master_bedroom_humidity') | float(0) | round(0) %}
              {% set m = states('input_select.thermostat_master_bedroom_mode') | lower %}
              {% set f = states('input_select.thermostat_master_bedroom_fan_mode') | default('Auto') %}
              {% set lo = states('input_number.thermostat_master_bedroom_heat_setpoint') | float(68) | round(0) %}
              {% set hi = states('input_number.thermostat_master_bedroom_setpoint') | float(73) | round(0) %}
              {{ t }}°F · {{ h }}% RH · {% if m == 'auto' %}Auto {{ lo }}°–{{ hi }}°F{% elif m == 'heat' %}Heat {{ lo }}°F{% elif m == 'cool' %}Cool {{ hi }}°F{% else %}Off{% endif %} · Fan {{ f }}
            icon: mdi:bed-king-outline
            icon_color: >-
              {% set m = states('input_select.thermostat_master_bedroom_mode') | lower %}
              {{ 'blue' if m == 'cool' else ('orange' if m == 'heat' else ('green' if m == 'auto' else 'disabled')) }}
            tap_action:
              action: more-info
          - type: custom:thermostat-range-bar
            entity: climate.thermostat_master_bedroom
            min: 55
            max: 85
            step: 1
            min_gap: 2

      # ── 3. UPPER BIG BEDROOM ──
      - type: vertical-stack
        cards:
          - type: custom:mushroom-template-card
            entity: climate.thermostat_upper_big_bedroom
            primary: Upper Big Bedroom
            secondary: >-
              {% set t = states('sensor.thermostat_upper_big_bedroom_temperature') | float(state_attr('climate.thermostat_upper_big_bedroom', 'current_temperature') | float(0)) | round(0) %}
              {% set h = states('sensor.thermostat_upper_big_bedroom_humidity') | float(0) | round(0) %}
              {% set m = states('input_select.thermostat_upper_big_bedroom_mode') | lower %}
              {% set f = states('input_select.thermostat_upper_big_bedroom_fan_mode') | default('Auto') %}
              {% set lo = states('input_number.thermostat_upper_big_bedroom_heat_setpoint') | float(68) | round(0) %}
              {% set hi = states('input_number.thermostat_upper_big_bedroom_setpoint') | float(73) | round(0) %}
              {{ t }}°F · {{ h }}% RH · {% if m == 'auto' %}Auto {{ lo }}°–{{ hi }}°F{% elif m == 'heat' %}Heat {{ lo }}°F{% elif m == 'cool' %}Cool {{ hi }}°F{% else %}Off{% endif %} · Fan {{ f }}
            icon: mdi:bed-double-outline
            icon_color: >-
              {% set m = states('input_select.thermostat_upper_big_bedroom_mode') | lower %}
              {{ 'blue' if m == 'cool' else ('orange' if m == 'heat' else ('green' if m == 'auto' else 'disabled')) }}
            tap_action:
              action: more-info
          - type: custom:thermostat-range-bar
            entity: climate.thermostat_upper_big_bedroom
            min: 55
            max: 85
            step: 1
            min_gap: 2

      # ── 4. UPPER SMALL BEDROOM ──
      - type: vertical-stack
        cards:
          - type: custom:mushroom-template-card
            entity: climate.thermostat_upper_small_bedroom
            primary: Upper Small Bedroom
            secondary: >-
              {% set t = states('sensor.thermostat_upper_small_bedroom_temperature') | float(state_attr('climate.thermostat_upper_small_bedroom', 'current_temperature') | float(0)) | round(0) %}
              {% set h = states('sensor.thermostat_upper_small_bedroom_humidity') | float(0) | round(0) %}
              {% set m = states('input_select.thermostat_upper_small_bedroom_mode') | lower %}
              {% set f = states('input_select.thermostat_upper_small_bedroom_fan_mode') | default('Auto') %}
              {% set lo = states('input_number.thermostat_upper_small_bedroom_heat_setpoint') | float(68) | round(0) %}
              {% set hi = states('input_number.thermostat_upper_small_bedroom_setpoint') | float(73) | round(0) %}
              {{ t }}°F · {{ h }}% RH · {% if m == 'auto' %}Auto {{ lo }}°–{{ hi }}°F{% elif m == 'heat' %}Heat {{ lo }}°F{% elif m == 'cool' %}Cool {{ hi }}°F{% else %}Off{% endif %} · Fan {{ f }}
            icon: mdi:bed-single-outline
            icon_color: >-
              {% set m = states('input_select.thermostat_upper_small_bedroom_mode') | lower %}
              {{ 'blue' if m == 'cool' else ('orange' if m == 'heat' else ('green' if m == 'auto' else 'disabled')) }}
            tap_action:
              action: more-info
          - type: custom:thermostat-range-bar
            entity: climate.thermostat_upper_small_bedroom
            min: 55
            max: 85
            step: 1
            min_gap: 2

      # ── 5. UPPER GUEST BEDROOM ──
      - type: vertical-stack
        cards:
          - type: custom:mushroom-template-card
            entity: climate.thermostat_upper_guest_bedroom
            primary: Upper Guest Bedroom
            secondary: >-
              {% set t = states('sensor.thermostat_upper_guest_bedroom_temperature') | float(state_attr('climate.thermostat_upper_guest_bedroom', 'current_temperature') | float(0)) | round(0) %}
              {% set h = states('sensor.thermostat_upper_guest_bedroom_humidity') | float(0) | round(0) %}
              {% set m = states('input_select.thermostat_upper_guest_bedroom_mode') | lower %}
              {% set f = states('input_select.thermostat_upper_guest_bedroom_fan_mode') | default('Auto') %}
              {% set lo = states('input_number.thermostat_upper_guest_bedroom_heat_setpoint') | float(68) | round(0) %}
              {% set hi = states('input_number.thermostat_upper_guest_bedroom_setpoint') | float(73) | round(0) %}
              {{ t }}°F · {{ h }}% RH · {% if m == 'auto' %}Auto {{ lo }}°–{{ hi }}°F{% elif m == 'heat' %}Heat {{ lo }}°F{% elif m == 'cool' %}Cool {{ hi }}°F{% else %}Off{% endif %} · Fan {{ f }}
            icon: mdi:bed-queen-outline
            icon_color: >-
              {% set m = states('input_select.thermostat_upper_guest_bedroom_mode') | lower %}
              {{ 'blue' if m == 'cool' else ('orange' if m == 'heat' else ('green' if m == 'auto' else 'disabled')) }}
            tap_action:
              action: more-info
          - type: custom:thermostat-range-bar
            entity: climate.thermostat_upper_guest_bedroom
            min: 55
            max: 85
            step: 1
            min_gap: 2

      # ── 6. ENTERTAINMENT ROOM (LOWER LEVEL) ──
      - type: vertical-stack
        cards:
          - type: custom:mushroom-template-card
            entity: climate.thermostat_entertainment_room
            primary: Entertainment Room
            secondary: >-
              {% set t = states('sensor.thermostat_entertainment_room_temperature') | float(state_attr('climate.thermostat_entertainment_room', 'current_temperature') | float(0)) | round(0) %}
              {% set h = states('sensor.thermostat_entertainment_room_humidity') | float(0) | round(0) %}
              {% set m = states('input_select.thermostat_entertainment_room_mode') | lower %}
              {% set f = states('input_select.thermostat_entertainment_room_fan_mode') | default('Auto') %}
              {% set lo = states('input_number.thermostat_entertainment_room_heat_setpoint') | float(68) | round(0) %}
              {% set hi = states('input_number.thermostat_entertainment_room_setpoint') | float(73) | round(0) %}
              {{ t }}°F · {{ h }}% RH · {% if m == 'auto' %}Auto {{ lo }}°–{{ hi }}°F{% elif m == 'heat' %}Heat {{ lo }}°F{% elif m == 'cool' %}Cool {{ hi }}°F{% else %}Off{% endif %} · Fan {{ f }}
            icon: mdi:television-ambient-light
            icon_color: >-
              {% set m = states('input_select.thermostat_entertainment_room_mode') | lower %}
              {{ 'blue' if m == 'cool' else ('orange' if m == 'heat' else ('green' if m == 'auto' else 'disabled')) }}
            tap_action:
              action: more-info
          - type: custom:thermostat-range-bar
            entity: climate.thermostat_entertainment_room
            min: 55
            max: 85
            step: 1
            min_gap: 2

      # ── 7. ATTIC THERMAL BUFFER ──
      - type: vertical-stack
        cards:
          - type: custom:mushroom-template-card
            entity: climate.thermostat_attic
            primary: Attic Thermal Zone
            secondary: >-
              {% set t = state_attr('climate.thermostat_attic', 'current_temperature') | float(0) | round(0) %}
              {% set h = states('sensor.thermostat_attic_humidity') | float(0) | round(0) %}
              {% set m = states('input_select.thermostat_attic_mode') | lower %}
              {% set f = states('input_select.thermostat_attic_fan_mode') | default('Auto') %}
              {% set lo = states('input_number.thermostat_attic_heat_setpoint') | float(68) | round(0) %}
              {% set hi = states('input_number.thermostat_attic_setpoint') | float(74) | round(0) %}
              {{ t }}°F · {{ h }}% RH · {% if m == 'auto' %}Auto {{ lo }}°–{{ hi }}°F{% elif m == 'heat' %}Heat {{ lo }}°F{% elif m == 'cool' %}Cool {{ hi }}°F{% else %}Off{% endif %} · Fan {{ f }}
            icon: mdi:home-roof
            icon_color: >-
              {% set m = states('input_select.thermostat_attic_mode') | lower %}
              {{ 'blue' if m == 'cool' else ('orange' if m == 'heat' else ('green' if m == 'auto' else 'disabled')) }}
            tap_action:
              action: more-info
          - type: custom:thermostat-range-bar
