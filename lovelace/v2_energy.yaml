title: Energy
path: energy
icon: mdi:solar-power-variant-outline
type: custom:grid-layout
layout:
  grid-template-columns: 1fr
  grid-gap: 10px
  margin: 8px 12px 16px 12px
  mediaquery:
    "(max-width: 640px)":
      grid-gap: 8px
      margin: 6px 8px 14px 8px
cards:
  # ════════════════════════════════════════════════════════════════════════════
  #  COMPACT ENERGY TELEMETRY & GRAFANA LAUNCH BAR
  # ════════════════════════════════════════════════════════════════════════════
  - type: custom:mushroom-chips-card
    alignment: justify
    chips:
      - type: template
        entity: sensor.solar_power
        icon: mdi:solar-power-variant
        icon_color: amber
        content: "Solar {{ states('sensor.solar_power') | float(0) | round(2) }} kW"
        tap_action:
          action: more-info
      - type: template
        entity: sensor.house_load
        icon: mdi:home-lightning-bolt-outline
        icon_color: cyan
        content: "Load {{ states('sensor.house_load') | float(0) | round(2) }} kW"
        tap_action:
          action: more-info
      - type: template
        entity: sensor.powerwall_charge
        icon: mdi:battery-charging-80
        icon_color: >-
          {% set soc = states('sensor.powerwall_charge') | float(0) %}
          {{ 'green' if soc >= 50 else ('amber' if soc >= 20 else 'red') }}
        content: "Powerwall {{ states('sensor.powerwall_charge') | float(0) | round(0) }}% ({{ states('sensor.powerwall_power') | float(0) | round(2) }} kW)"
        tap_action:
          action: more-info
      - type: template
        entity: sensor.grid_power
        icon: mdi:transmission-tower
        icon_color: >-
          {{ 'green' if is_state('binary_sensor.grid_status', 'on') else 'red' }}
        content: "Grid {{ states('sensor.grid_power') | float(0) | round(2) }} kW ({{ states('binary_sensor.grid_status') | title }})"
        tap_action:
          action: more-info
      - type: template
        icon: mdi:chart-areaspline
        icon_color: orange
        content: "Open Grafana Dashboard ↗"
        tap_action:
          action: url
          url_path: "http://192.168.10.105:3000/d/tesla-powerwall/tesla-powerwall?orgId=1&refresh=30s"

  # ════════════════════════════════════════════════════════════════════════════
  #  ROW 1 — LIVE FLOW & GAUGE TELEMETRY (2-COL LAPTOP / 1-COL PHONE)
  # ════════════════════════════════════════════════════════════════════════════
  - type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: 1fr 1.15fr
      grid-gap: 10px
      margin: 0
      mediaquery:
        "(max-width: 960px)":
          grid-template-columns: 1fr
    cards:
      # ── LEFT: ENERGY DISTRIBUTION & POWERWALL CONTROLS ──
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Live Microgrid Distribution
            subtitle: Real-time Solar, Powerwall, Grid, and Home routing
          - type: energy-distribution
            link_dashboard: true
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(2, minmax(0, 1fr))
              grid-gap: 8px
              margin: 0
              mediaquery:
                "(max-width: 480px)":
                  grid-template-columns: 1fr
            cards:
              - type: custom:mushroom-number-card
                entity: number.home_energy_gateway_backup_reserve
                name: Backup Reserve %
                icon: mdi:shield-battery-outline
                icon_color: green
                display_mode: slider
              - type: custom:mushroom-select-card
                entity: select.home_energy_gateway_operation_mode
                name: Powerwall Mode
                icon: mdi:cog-transfer-outline
                icon_color: cyan

      # ── RIGHT: 2x2 REAL-TIME GAUGES ──
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Instantaneous Power & Storage Gauges
            subtitle: Zero-lag native gauges
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(2, minmax(0, 1fr))
              grid-gap: 8px
              margin: 0
              mediaquery:
                "(max-width: 420px)":
                  grid-template-columns: 1fr
            cards:
              - type: gauge
                entity: sensor.solar_power
                name: Solar Generation
                unit: kW
                min: 0
                max: 12
                needle: true
                segments:
                  - from: 0
                    color: "#64748b"
                  - from: 1
                    color: "#fbbf24"
                  - from: 4
                    color: "#34d399"

              - type: gauge
                entity: sensor.house_load
                name: Home Load
                unit: kW
                min: 0
                max: 12
                needle: true
                segments:
                  - from: 0
                    color: "#34d399"
                  - from: 3
                    color: "#38bdf8"
                  - from: 6
                    color: "#fb923c"
                  - from: 9
                    color: "#fb7185"

              - type: gauge
                entity: sensor.powerwall_charge
                name: Powerwall SOC
                unit: "%"
                min: 0
                max: 100
                needle: true
                segments:
                  - from: 0
                    color: "#fb7185"
                  - from: 20
                    color: "#fbbf24"
                  - from: 50
                    color: "#34d399"

              - type: gauge
                entity: sensor.grid_power
                name: Grid Power
                unit: kW
                min: 0
                max: 12
                needle: true
                segments:
                  - from: 0
                    color: "#34d399"
                  - from: 2
                    color: "#38bdf8"
                  - from: 6
                    color: "#fb7185"

  # ════════════════════════════════════════════════════════════════════════════
  #  ROW 2 — GATEWAY & CIRCUIT METERS (4-COL LAPTOP / 2-COL PHONE)
  # ════════════════════════════════════════════════════════════════════════════
  - type: vertical-stack
    cards:
      - type: custom:mushroom-title-card
        title: Gateway & Circuit Telemetry
        subtitle: Tesla Gateway, Z-Wave HEM Gen5, and AV Rack meters
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: repeat(4, minmax(0, 1fr))
          grid-gap: 8px
          margin: 0
          mediaquery:
            "(max-width: 960px)":
              grid-template-columns: repeat(2, minmax(0, 1fr))
            "(max-width: 400px)":
              grid-template-columns: 1fr
        cards:
          - type: custom:mushroom-entity-card
            entity: binary_sensor.grid_status
            name: Grid Islanding Status
            icon: mdi:transmission-tower
            icon_color: green

          - type: custom:mushroom-entity-card
            entity: binary_sensor.powerwall_status
            name: Powerwall System Status
            icon: mdi:battery-check-outline
            icon_color: green

          - type: custom:mushroom-entity-card
            entity: binary_sensor.powerwall_charging
            name: Powerwall Charging State
            icon: mdi:battery-charging
            icon_color: amber

          - type: custom:mushroom-entity-card
            entity: sensor.home_theatre_living_room_electric_consumption_w
            name: Home Theater Load (W)
            icon: mdi:speaker-wireless
            icon_color: purple

  # ════════════════════════════════════════════════════════════════════════════
  #  ROW 3 — 24-HOUR POWER & BATTERY HISTORY (2-COL LAPTOP / 1-COL PHONE)
  # ════════════════════════════════════════════════════════════════════════════
  - type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(2, minmax(0, 1fr))
      grid-gap: 10px
      margin: 0
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: 1fr
    cards:
      - type: history-graph
        title: 24h Power Flow (Solar · Load · Battery · Grid)
        hours_to_show: 24
        entities:
          - entity: sensor.solar_power
            name: Solar
          - entity: sensor.house_load
            name: Load
          - entity: sensor.powerwall_power
            name: Powerwall
          - entity: sensor.grid_power
            name: Grid

      - type: history-graph
        title: 24h Powerwall Charge (%)
        hours_to_show: 24
        entities:
          - entity: sensor.powerwall_charge
            name: Battery SOC %
