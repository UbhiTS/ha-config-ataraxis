title: Controls
path: controls
icon: mdi:lightbulb-group-outline
type: custom:grid-layout
layout:
  grid-template-columns: 1fr
  grid-gap: 10px
  margin: 8px 12px 16px 12px
  mediaquery:
    "(max-width: 640px)":
      grid-gap: 8px
      margin: 6px 8px 14px 8px
cards:
  # ════════════════════════════════════════════════════════════════════════════
  #  COMPACT CONTROLS & SCENE ACTION BAR
  # ════════════════════════════════════════════════════════════════════════════
  - type: custom:mushroom-chips-card
    alignment: justify
    chips:
      - type: template
        icon: mdi:lightbulb-on-outline
        icon_color: amber
        content: >-
          {% set on_cnt = [
            'light.living_room_light', 'light.home_theatre_living_room_rgb_dimmer',
            'light.glide_hexa', 'light.glide_hexa_ultra', 'light.govee_glide_y_lights',
            'light.upper_wleds', 'light.entry_leds', 'light.garage_leds',
            'switch.kitchen_light', 'switch.welcome_room_light', 'switch.entryway_light',
            'switch.lower_common_bathroom_light', 'switch.upper_big_bedroom_light_fan',
            'switch.upper_small_bedroom_light_fan', 'switch.upper_guest_bedroom_light_fan',
            'switch.backyard_patio_lights', 'switch.backyard_light_left', 'switch.backyard_light_right',
            'switch.backyard_mesh_lights', 'switch.backyard_gym_lights', 'switch.side_deck_light'
          ] | select('is_state', 'on') | list | count %}
          {{ on_cnt }} Active Lights
      - type: template
        icon: mdi:white-balance-sunny
        icon_color: amber
        content: "Daylight Scene"
        tap_action:
          action: call-service
          service: script.scene_daylight_work
      - type: template
        icon: mdi:weather-sunset
        icon_color: orange
        content: "Evening Scene"
        tap_action:
          action: call-service
          service: script.scene_evening_relax
      - type: template
        icon: mdi:lightbulb-group-off
        icon_color: blue
        content: "All Lights Off"
        tap_action:
          action: call-service
          service: script.lights_all_off
      - type: template
        icon: mdi:shield-moon-outline
        icon_color: indigo
        content: "Goodnight Lockdown"
        tap_action:
          action: call-service
          service: script.goodnight_lockdown

  # ════════════════════════════════════════════════════════════════════════════
  #  SECTION 1 — GARAGE BAYS & MASTER SCENES (4-COL LAPTOP / 2-COL PHONE)
  # ════════════════════════════════════════════════════════════════════════════
  - type: vertical-stack
    cards:
      - type: custom:mushroom-title-card
        title: Garage Bays & Master Scenes
        subtitle: Instant access & whole-home lighting presets
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: repeat(4, minmax(0, 1fr))
          grid-gap: 8px
          margin: 0
          mediaquery:
            "(max-width: 960px)":
              grid-template-columns: repeat(2, minmax(0, 1fr))
        cards:
          - type: custom:mushroom-template-card
            entity: cover.garage_door_small
            primary: Moto Bay (Small)
            secondary: "{{ states('cover.garage_door_small') | title }} · Tap to Toggle"
            icon: "{{ 'mdi:garage-open' if is_state('cover.garage_door_small', 'open') else 'mdi:motorbike' }}"
            icon_color: "{{ 'red' if is_state('cover.garage_door_small', 'open') else 'green' }}"
            tap_action:
              action: call-service
              service: script.moto_garage_bay
            hold_action:
              action: more-info

          - type: custom:mushroom-template-card
            entity: cover.garage_door_big
            primary: Big Garage Door
            secondary: "{{ states('cover.garage_door_big') | title }} · Tap to Toggle"
            icon: "{{ 'mdi:garage-open-variant' if is_state('cover.garage_door_big', 'open') else 'mdi:garage-variant' }}"
            icon_color: "{{ 'red' if is_state('cover.garage_door_big', 'open') else 'green' }}"
            tap_action:
              action: call-service
              service: cover.toggle
              target:
                entity_id: cover.garage_door_big
            hold_action:
              action: more-info

          - type: custom:mushroom-template-card
            entity: script.close_all_garages
            primary: Close Both Garages
            secondary: Lock down both bays
            icon: mdi:garage-lock
            icon_color: cyan
            tap_action:
              action: call-service
              service: script.close_all_garages

          - type: custom:mushroom-template-card
            entity: script.lights_all_off
            primary: All Lights Off
            secondary: Interior & exterior off
            icon: mdi:power-standby
            icon_color: red
            tap_action:
              action: call-service
              service: script.lights_all_off

  # ════════════════════════════════════════════════════════════════════════════
  #  SECTION 2 — MAIN FLOOR & LOWER LEVEL LIGHTING
  # ════════════════════════════════════════════════════════════════════════════
  - type: vertical-stack
    cards:
      - type: custom:mushroom-title-card
        title: Main & Lower Level Lighting
        subtitle: Living Room, Kitchen, Entryway, and Entertainment
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: repeat(4, minmax(0, 1fr))
          grid-gap: 8px
          margin: 0
          mediaquery:
            "(max-width: 1024px)":
              grid-template-columns: repeat(3, minmax(0, 1fr))
            "(max-width: 720px)":
              grid-template-columns: repeat(2, minmax(0, 1fr))
            "(max-width: 380px)":
              grid-template-columns: 1fr
        cards:
          - type: custom:mushroom-light-card
            entity: light.living_room_light
            name: Living Room Dimmer
            icon: mdi:Floor-lamp-dual-outline
            show_brightness_control: true
            collapsible_controls: true

          - type: custom:mushroom-light-card
            entity: light.home_theatre_living_room_rgb_dimmer
            name: Home Theater RGB
            icon: mdi:television-ambient-light
            show_brightness_control: true
            show_color_control: true
            collapsible_controls: true

          - type: custom:mushroom-entity-card
            entity: switch.home_theatre_living_room
            name: Home Theater Power
            icon: mdi:speaker-wireless
            icon_color: cyan
            tap_action:
              action: toggle

          - type: custom:mushroom-entity-card
            entity: switch.kitchen_light
            name: Kitchen Overhead
            icon: mdi:countertop-outline
            icon_color: amber
            tap_action:
              action: toggle

          - type: custom:mushroom-entity-card
            entity: switch.welcome_room_light
            name: Welcome Room
            icon: mdi:sofa-single-outline
            icon_color: amber
            tap_action:
              action: toggle

          - type: custom:mushroom-entity-card
            entity: switch.entryway_light
            name: Entryway Light
            icon: mdi:coach-lamp
            icon_color: amber
            tap_action:
              action: toggle

          - type: custom:mushroom-entity-card
            entity: switch.lower_common_bathroom_light
            name: Lower Bath Light
            icon: mdi:shower-head
            icon_color: amber
            tap_action:
              action: toggle

          - type: custom:mushroom-entity-card
            entity: switch.living_room_doorbell
            name: Doorbell Chime
            icon: mdi:bell-ring-outline
            icon_color: green
            tap_action:
              action: toggle

  # ════════════════════════════════════════════════════════════════════════════
  #  SECTION 3 — UPPER LEVEL BEDROOMS, FANS & ACCENT LEDS
  # ════════════════════════════════════════════════════════════════════════════
  - type: vertical-stack
    cards:
      - type: custom:mushroom-title-card
        title: Upper Level Bedrooms & WLED Strips
        subtitle: Ceiling fan/light combos and architectural LEDs
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: repeat(4, minmax(0, 1fr))
          grid-gap: 8px
          margin: 0
          mediaquery:
            "(max-width: 1024px)":
              grid-template-columns: repeat(3, minmax(0, 1fr))
            "(max-width: 720px)":
              grid-template-columns: repeat(2, minmax(0, 1fr))
            "(max-width: 380px)":
              grid-template-columns: 1fr
        cards:
          - type: custom:mushroom-fan-card
            entity: fan.master_bedroom_fan_dimmer
            name: Master Suite Fan
            icon: mdi:ceiling-fan
            show_percentage_control: true
            collapsible_controls: true

          - type: custom:mushroom-entity-card
            entity: switch.upper_big_bedroom_light_fan
            name: Upper Big Bed Fan/Light
            icon: mdi:ceiling-fan-light
            icon_color: amber
            tap_action:
              action: toggle

          - type: custom:mushroom-entity-card
            entity: switch.upper_small_bedroom_light_fan
            name: Upper Small Bed Fan/Light
            icon: mdi:ceiling-fan-light
            icon_color: amber
            tap_action:
              action: toggle

          - type: custom:mushroom-entity-card
            entity: switch.upper_guest_bedroom_light_fan
            name: Upper Guest Bed Fan/Light
            icon: mdi:ceiling-fan-light
            icon_color: amber
            tap_action:
              action: toggle

          - type: custom:mushroom-light-card
            entity: light.upper_wleds
            name: Upper WLED Strip
            icon: mdi:led-strip-variant
            show_brightness_control: true
            show_color_control: true
            collapsible_controls: true

          - type: custom:mushroom-light-card
            entity: light.entry_leds
            name: Entryway WLEDs
            icon: mdi:led-strip
            show_brightness_control: true
            show_color_control: true
            collapsible_controls: true

          - type: custom:mushroom-light-card
            entity: light.garage_leds
            name: Garage WLEDs
            icon: mdi:led-strip
            show_brightness_control: true
            show_color_control: true
            collapsible_controls: true

          - type: custom:mushroom-template-card
            primary: Govee RGB Studio
            secondary: Open Hexa & Y-Lights controller
            icon: mdi:hexagon-multiple-outline
            icon_color: purple
            tap_action:
              action: navigate
              navigation_path: /lovelace/govee

  # ════════════════════════════════════════════════════════════════════════════
  #  SECTION 4 — EXTERIOR, BACKYARD & PERIMETER LIGHTING
  # ════════════════════════════════════════════════════════════════════════════
  - type: vertical-stack
    cards:
      - type: custom:mushroom-title-card
        title: Exterior & Backyard Lighting
        subtitle: Patio, deck, floods, gym, and festival lights
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: repeat(4, minmax(0, 1fr))
          grid-gap: 8px
          margin: 0
          mediaquery:
            "(max-width: 1024px)":
              grid-template-columns: repeat(3, minmax(0, 1fr))
            "(max-width: 720px)":
              grid-template-columns: repeat(2, minmax(0, 1fr))
            "(max-width: 380px)":
              grid-template-columns: 1fr
        cards:
          - type: custom:mushroom-entity-card
            entity: switch.backyard_patio_lights
            name: Backyard Patio
            icon: mdi:outdoor-lamp
            icon_color: amber
            tap_action:
              action: toggle

          - type: custom:mushroom-entity-card
            entity: switch.backyard_light_left
            name: Backyard Flood Left
            icon: mdi:wall-sconce-flat-variant
            icon_color: amber
            tap_action:
              action: toggle

          - type: custom:mushroom-entity-card
            entity: switch.backyard_light_right
            name: Backyard Flood Right
            icon: mdi:wall-sconce-flat-variant
            icon_color: amber
            tap_action:
              action: toggle

          - type: custom:mushroom-entity-card
            entity: switch.backyard_mesh_lights
            name: Backyard Mesh Lights
            icon: mdi:string-lights
            icon_color: orange
            tap_action:
              action: toggle

          - type: custom:mushroom-entity-card
            entity: switch.backyard_gym_lights
            name: Backyard Gym Lights
            icon: mdi:dumbbell
            icon_color: cyan
            tap_action:
              action: toggle

          - type: custom:mushroom-entity-card
            entity: switch.side_deck_light
            name: Side Deck Light
            icon: mdi:Spotlight-beam
            icon_color: amber
            tap_action:
              action: toggle

          - type: custom:mushroom-entity-card
            entity: switch.entryway_festival_leds_01
            name: Festival LEDs 01
            icon: mdi:string-lights
            icon_color: purple
            tap_action:
              action: toggle

          - type: custom:mushroom-entity-card
            entity: switch.entryway_festival_leds_02
            name: Festival LEDs 02
            icon: mdi:string-lights
            icon_color: pink
            tap_action:
              action: toggle
