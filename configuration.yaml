ios:
  actions:
    - name: Moto Bay Toggle
      background_color: "#0ea5e9"
      label:
        text: "Moto Bay (Open/Close)"
        color: "#ffffff"
      icon:
        icon: motorbike
        color: "#ffffff"
      show_in_carplay: true
      show_in_watch: true
    - name: Big Garage Toggle
      background_color: "#10b981"
      label:
        text: "Big Garage (Open/Close)"
        color: "#ffffff"
      icon:
        icon: garage
        color: "#ffffff"
      show_in_carplay: true
      show_in_watch: true
    - name: Close All Garages
      background_color: "#ef4444"
      label:
        text: "Lockdown Both Garages"
        color: "#ffffff"
      icon:
        icon: garage-lock
        color: "#ffffff"
      show_in_carplay: true
      show_in_watch: true
    - name: Goodnight Lockdown
      background_color: "#6366f1"
      label:
        text: "Goodnight House Lockdown"
        color: "#ffffff"
      icon:
        icon: shield-moon-outline
        color: "#ffffff"
      show_in_carplay: false
      show_in_watch: true

homekit:
  - name: Solstice Moto & Home Bridge
    port: 21064
    filter:
      include_entities:
        - cover.garage_door_small
        - cover.garage_door_big
        - script.moto_garage_bay
        - script.close_all_garages
        - script.goodnight_lockdown
        - switch.entryway_light
        - switch.welcome_room_light
        - light.living_room_light
    entity_config:
      cover.garage_door_small:
        name: "Motorcycle Garage"
      cover.garage_door_big:
        name: "Big Garage"
      script.moto_garage_bay:
        name: "Moto Ride Bay"

