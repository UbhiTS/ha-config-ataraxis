                      border: 1px solid rgba(56, 189, 248, 0.34) !important;
                      {% elif m == 'Auto' %}
                      background: radial-gradient(circle at 50% 0%, rgba(52, 211, 153, 0.18), rgba(31, 38, 56, 0.88) 75%) !important;
