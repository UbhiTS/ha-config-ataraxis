title: Admin
path: admin
icon: mdi:tune-vertical
panel: true
cards:
  - type: vertical-stack
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr
          grid-gap: 10px
          margin: 8px 12px 16px 12px
          mediaquery:
            "(max-width: 600px)":
              grid-gap: 8px
              margin: 6px 6px 14px 6px
        cards:

          # ════════════════════════════════════════════════════════════════════
          #  COMPACT ADMIN & DIAGNOSTICS BAR
          # ════════════════════════════════════════════════════════════════════
          - type: custom:mushroom-chips-card
            alignment: justify
            chips:
              - type: entity
                entity: device_tracker.funky_monkey_s_iphone
                icon_color: green
              - type: entity
                entity: device_tracker.ivavvays_iphone
                icon_color: green
              - type: template
                icon: mdi:battery-check
                icon_color: green
                content: "Min Battery: {{ [states('sensor.main_door_lock_battery_level')|float(100), states('sensor.garage_door_small_battery_level')|float(100), states('sensor.garage_battery_level')|float(100)] | min | round(0) }}%"
              - type: template
                icon: mdi:cpu-64-bit
                icon_color: light-blue
                content: "HA CPU {{ states('sensor.processor_use') }}% · RAM {{ states('sensor.memory_use_percent') }}%"
                tap_action:
                  action: more-info
                  entity: sensor.processor_use

          # ════════════════════════════════════════════════════════════════════
          #  HIGH-SIGNAL SYSTEM DIAGNOSTICS (2-Column Laptop / 1-Column Mobile)
          # ════════════════════════════════════════════════════════════════════
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(2, minmax(0, 1fr))
              grid-gap: 10px
              mediaquery:
                "(max-width: 800px)":
                  grid-template-columns: 1fr
            cards:
              # 1. Unavailable / Unknown Entities Watchlist
              - type: custom:auto-entities
                show_empty: true
                card:
                  type: entities
                  title: "⚠️ Unavailable / Alert Entities"
                  show_header_toggle: false
                  state_color: true
                filter:
                  include:
                    - state: "unavailable"
                    - state: "unknown"
                  exclude:
                    - domain: group
                    - domain: zone
                    - entity_id: "sensor.supermicro_*"
                    - entity_id: "sensor.hp_ilo_*"

              # 2. Z-Wave Battery Replacement Queue (Lowest First)
              - type: custom:auto-entities
                card:
                  type: entities
                  title: "🔋 Z-Wave Battery Levels (Lowest First)"
                  show_header_toggle: false
                  state_color: true
                sort:
                  method: state
                  numeric: true
                  reverse: false
                filter:
                  include:
                    - entity_id: "sensor.*battery_level*"
                  exclude:
                    - entity_id: "sensor.*iphone*"
                    - entity_id: "sensor.*watch*"

              # 3. 7-Zone Climate & Helper Diagnostics
              - type: entities
                title: "🌡️ 7-Zone Climate Entities & Setpoints"
                show_header_toggle: false
                state_color: true
                entities:
                  - entity: climate.thermostat_living_room
                    name: Living Room
                  - entity: climate.thermostat_master_bedroom
                    name: Master Bedroom
                  - entity: climate.thermostat_upper_big_bedroom
                    name: Upper Big Bedroom
                  - entity: climate.thermostat_upper_small_bedroom
                    name: Upper Small Bedroom
                  - entity: climate.thermostat_upper_guest_bedroom
                    name: Upper Guest Bedroom
                  - entity: climate.thermostat_entertainment_room
                    name: Entertainment Room (Lower Guest)
                  - entity: climate.thermostat_attic
                    name: Attic

              # 4. Garage Controllers & Barrier Health
              - type: entities
                title: "🏍️ Garage Controllers & Tilt Sensors"
                show_header_toggle: false
                state_color: true
                entities:
                  - entity: cover.garage_door_small
                    name: Moto Bay (Small Garage)
                  - entity: sensor.garage_door_small_battery_level
                    name: Moto Bay Tilt Sensor Battery
                  - entity: binary_sensor.garage_door_small_barrier_ul_disabling_status
                    name: Moto Bay UL Lockout Status
                  - entity: cover.garage_door_big
                    name: Big Garage Door
                  - entity: sensor.garage_battery_level
                    name: Big Garage Tilt Sensor Battery
                  - entity: binary_sensor.garage_barrier_ul_disabling_status
                    name: Big Garage UL Lockout Status

              # 5. Energy & Solar Telemetry
              - type: entities
                title: "☀️ Powerwall & Solar Telemetry"
                show_header_toggle: false
                state_color: true
                entities:
                  - entity: sensor.powerwall_charge
                    name: Powerwall Reserve
                  - entity: sensor.powerwall_solar_now
                    name: Solar Production Now
                  - entity: sensor.powerwall_load_now
                    name: Home Load Now
                  - entity: sensor.powerwall_battery_now
                    name: Battery Flow Now
                  - entity: sensor.powerwall_site_now
                    name: Grid Flow Now
                  - entity: binary_sensor.grid_status
                    name: Grid Connected

              # 6. Host & WAN Telemetry
              - type: entities
                title: "🖥️ Host & WAN Telemetry"
                show_header_toggle: false
                state_color: true
                entities:
                  - entity: sensor.processor_use
                    name: CPU Usage
                  - entity: sensor.memory_use_percent
                    name: Memory Usage
                  - entity: sensor.disk_free
                    name: Disk Free
                  - entity: sensor.load_1m
                    name: System Load (1m)
                  - entity: sensor.speedtest_download
                    name: WAN Download
                  - entity: sensor.speedtest_upload
                    name: WAN Upload
                  - entity: sensor.xfinity_usage
                    name: Xfinity Monthly Data
