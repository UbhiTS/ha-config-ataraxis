title: Services
path: services
icon: mdi:apps
panel: true
cards:
  - type: vertical-stack
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr
          grid-gap: 10px
          margin: 8px 12px 16px 12px
          mediaquery:
            "(max-width: 600px)":
              grid-gap: 8px
              margin: 6px 6px 14px 6px
        cards:

          # ════════════════════════════════════════════════════════════════════
          #  COMPACT SERVICES PORTAL BAR
          # ════════════════════════════════════════════════════════════════════
          - type: custom:mushroom-chips-card
            alignment: justify
            chips:
              - type: template
                icon: mdi:apps
                icon_color: light-blue
                content: "Homelab Portal · 9 Endpoints"
              - type: template
                icon: mdi:nas
                icon_color: "{{ 'green' if is_state('sensor.ubhinas_status','good') else 'red' }}"
                content: "UbhiNAS"
                tap_action:
                  action: url
                  url_path: !secret ubhinas_url
              - type: template
                icon: mdi:nas
                icon_color: "{{ 'green' if is_state('sensor.plexnas_status','good') else 'red' }}"
                content: "PlexNAS"
                tap_action:
                  action: url
                  url_path: !secret plexnas_url
              - type: template
                icon: mdi:chart-areaspline
                icon_color: amber
                content: "Grafana"
                tap_action:
                  action: url
                  url_path: !secret grafana_url

          # ════════════════════════════════════════════════════════════════════
          #  SERVICES LAUNCHPAD — Responsive 3-Col Laptop / 2-Col Mobile Grid
          # ════════════════════════════════════════════════════════════════════
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(3, minmax(0, 1fr))
              grid-gap: 10px
              mediaquery:
                "(max-width: 900px)":
                  grid-template-columns: repeat(2, minmax(0, 1fr))
                  grid-gap: 8px
                "(max-width: 480px)":
                  grid-template-columns: 1fr
            cards:
              - type: custom:mushroom-template-card
                primary: Grafana
                secondary: Dashboards & Telemetry Analytics
                icon: mdi:chart-areaspline
                icon_color: amber
                layout: horizontal
                tap_action:
                  action: url
                  url_path: !secret grafana_url

              - type: custom:mushroom-template-card
                primary: Z-Wave JS UI
                secondary: Mesh Network & Node Management
                icon: mdi:z-wave
                icon_color: light-blue
                layout: horizontal
                tap_action:
                  action: url
                  url_path: !secret zwavejs_url

              - type: custom:mushroom-template-card
                primary: Portainer
                secondary: Docker Container Orchestration
                icon: mdi:docker
                icon_color: cyan
                layout: horizontal
                tap_action:
                  action: url
                  url_path: !secret portainer_url

              - type: custom:mushroom-template-card
                primary: InfluxDB
                secondary: Time-Series Telemetry Engine
                icon: mdi:database-settings-outline
                icon_color: purple
                layout: horizontal
                tap_action:
                  action: url
                  url_path: !secret influxdb_url

              - type: custom:mushroom-template-card
                primary: NGINX Proxy
                secondary: Reverse Proxy & TLS Certificates
                icon: mdi:server-security
                icon_color: green
                layout: horizontal
                tap_action:
                  action: url
                  url_path: !secret nginx_url

              - type: custom:mushroom-template-card
                primary: UbhiNAS
                secondary: Primary QNAP Storage Array
                icon: mdi:nas
                icon_color: amber
                layout: horizontal
                tap_action:
                  action: url
                  url_path: !secret ubhinas_url

              - type: custom:mushroom-template-card
                primary: PlexNAS
                secondary: Media Streaming Storage Array
                icon: mdi:nas
                icon_color: orange
                layout: horizontal
                tap_action:
                  action: url
                  url_path: !secret plexnas_url

              - type: custom:mushroom-template-card
                primary: Xfinity Usage
                secondary: ISP Bandwidth & Quota Tracker
                icon: mdi:wan
                icon_color: red
                layout: horizontal
                tap_action:
                  action: url
                  url_path: !secret xfinity_usage_url

              - type: custom:mushroom-template-card
                primary: Mosquitto MQTT
                secondary: Event Bus & Message Broker
                icon: mdi:message-settings-outline
                icon_color: teal
                layout: horizontal
                tap_action:
                  action: url
                  url_path: !secret mqtt_url
